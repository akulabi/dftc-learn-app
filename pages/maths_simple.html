<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數學小勇士 - 幼稚園加減法學習 App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        candy: {
                            pink: '#FF6B8B',
                            yellow: '#FFD166',
                            green: '#06D6A0',
                            blue: '#118AB2',
                            purple: '#8338EC',
                            red: '#EF476F',
                            bg: '#FFF9F2'
                        }
                    },
                    boxShadow: {
                        'fun': '0 8px 0 0 rgba(0,0,0,0.12)',
                        'fun-lg': '0 12px 0 0 rgba(0,0,0,0.12)',
                        'btn': '0 6px 0 0 rgba(0,0,0,0.15)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@700;900&display=swap');
        
        body {
            font-family: 'Zen Maru Gothic', 'Fredoka', cursive, sans-serif;
            background-color: #FFF9F2;
            background-image: radial-gradient(#FFD166 1.5px, transparent 1.5px), radial-gradient(#118AB2 1.5px, #FFF9F2 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-bounce {
            transition: all 0.1s ease;
        }
        .btn-bounce:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 0 rgba(0,0,0,0.15) !important;
        }

        .ten-frame-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 4px;
            background-color: #FFFFFF;
            padding: 6px;
            border-radius: 14px;
            border: 3px solid #FCD34D;
            box-shadow: 0 4px 0 0 #F59E0B;
        }

        .ten-frame-cell {
            width: 24px;
            height: 24px;
            border: 2px dashed #FCD34D;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .crossed-out::after {
            content: '✕';
            position: absolute;
            color: #EF476F;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 2px white;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes pop {
            0% { transform: scale(0.85); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <script>
        // 全域狀態
        let currentOpMode = 'add';
        let currentMaxNum = 10;
        let questions = [];
        let currentQuestionIdx = 0;
        let score = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let currentInput = "";
        let soundEnabled = true;
        let activeTab = 10;

        // Web Audio API 音效
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(120, now + 0.15);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'fanfare') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g);
                        g.connect(ctx.destination);
                        o.frequency.setValueAtTime(freq, now + idx * 0.1);
                        g.gain.setValueAtTime(0.12, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.25);
                    });
                }
            } catch (e) {
                console.log("Audio Error:", e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high';
                playSound('click');
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
            }
        }

        function setOpMode(mode) {
            playSound('click');
            currentOpMode = mode;
            
            const btnAdd = document.getElementById('opAddBtn');
            const btnSub = document.getElementById('opSubBtn');
            const btnMix = document.getElementById('opMixBtn');

            [btnAdd, btnSub, btnMix].forEach(btn => {
                btn.className = "py-2.5 rounded-2xl border-2 font-black text-xs sm:text-sm flex flex-col items-center justify-center gap-1 btn-bounce bg-white text-gray-600 border-gray-200";
            });

            if (mode === 'add') {
                btnAdd.className = "py-2.5 rounded-2xl border-2 font-black text-xs sm:text-sm flex flex-col items-center justify-center gap-1 btn-bounce bg-candy-pink text-white border-pink-600 shadow-sm";
            } else if (mode === 'sub') {
                btnSub.className = "py-2.5 rounded-2xl border-2 font-black text-xs sm:text-sm flex flex-col items-center justify-center gap-1 btn-bounce bg-candy-blue text-white border-sky-600 shadow-sm";
            } else {
                btnMix.className = "py-2.5 rounded-2xl border-2 font-black text-xs sm:text-sm flex flex-col items-center justify-center gap-1 btn-bounce bg-candy-purple text-white border-purple-600 shadow-sm";
            }
        }

        function showScreen(screenId) {
            ['mainScreen', 'gameScreen', 'resultScreen', 'leaderboardScreen'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            const target = document.getElementById(screenId);
            target.classList.remove('hidden');
            target.classList.add('flex');
        }

        function startGame(maxNum) {
            playSound('click');
            currentMaxNum = maxNum;
            questions = generateQuestions(maxNum, 10);
            currentQuestionIdx = 0;
            score = 0;
            timerSeconds = 0;
            currentInput = "";

            renderProgressDots();
            renderQuestion();
            showScreen('gameScreen');

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timerSeconds++;
                document.getElementById('timer').innerText = `${timerSeconds}s`;
            }, 1000);
        }

        // 題目生成算法：確保無負數
        function generateQuestions(maxLimit, count) {
            const list = [];
            for (let i = 0; i < count; i++) {
                let isAdd = true;
                if (currentOpMode === 'add') isAdd = true;
                else if (currentOpMode === 'sub') isAdd = false;
                else isAdd = Math.random() > 0.5;

                let num1, num2, answer, operator;

                if (isAdd) {
                    operator = '+';
                    if (maxLimit === 10) {
                        num1 = Math.floor(Math.random() * 9) + 1;
                        num2 = Math.floor(Math.random() * (10 - num1)) + 1;
                    } else {
                        num1 = Math.floor(Math.random() * (maxLimit - 5)) + 3;
                        num2 = Math.floor(Math.random() * (maxLimit - num1)) + 1;
                    }
                    answer = num1 + num2;
                } else {
                    operator = '-';
                    // 減法保證：被減數 >= 減數
                    num1 = Math.floor(Math.random() * (maxLimit - 2)) + 2;
                    num2 = Math.floor(Math.random() * num1) + 1;
                    answer = num1 - num2;
                }
                list.push({ num1, num2, operator, answer });
            }
            return list;
        }

        function renderProgressDots() {
            const dotsContainer = document.getElementById('progressDots');
            dotsContainer.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const dot = document.createElement('div');
                dot.id = `dot-${i}`;
                dot.className = "w-2.5 h-2.5 rounded-full bg-gray-200 border border-gray-300 transition-all";
                dotsContainer.appendChild(dot);
            }
        }

        function updateProgressDots() {
            for (let i = 0; i < 10; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentQuestionIdx) {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-candy-green border border-emerald-500 shadow-sm";
                } else if (i === currentQuestionIdx) {
                    dot.className = "w-3.5 h-3.5 rounded-full bg-candy-yellow border-2 border-amber-400 animate-pulse";
                } else {
                    dot.className = "w-2.5 h-2.5 rounded-full bg-gray-200 border border-gray-300";
                }
            }
        }

        function renderQuestion() {
            const q = questions[currentQuestionIdx];
            document.getElementById('num1').innerText = q.num1;
            document.getElementById('num2').innerText = q.num2;
            document.getElementById('operator').innerText = q.operator;
            
            currentInput = "";
            updateAnswerDisplay();
            updateProgressDots();

            document.getElementById('hintBox').classList.add('hidden');
            renderHintContent(q);
        }

        // 精準十格陣 (Ten-Frame) 拆解算理
        function renderHintContent(q) {
            const hintText = document.getElementById('hintText');
            const tenFrameContainer = document.getElementById('tenFrameContainer');

            hintText.innerText = "";
            tenFrameContainer.innerHTML = "";

            if (q.operator === '+') {
                const big = Math.max(q.num1, q.num2);
                const small = Math.min(q.num1, q.num2);
                const onesBig = big % 10;

                // 1. 不進位加法 (大數在前如 13+6，或大數在後如 4+12)
                if (big >= 10 && (onesBig + small < 10)) {
                    const tens = Math.floor(big / 10) * 10;
                    const sumOnes = onesBig + small;
                    hintText.innerText = `💡 拆大數 ${big} 為 ${tens} 和 ${onesBig} ➔ 先算 ${onesBig} + ${small} = ${sumOnes}，再算 ${tens} + ${sumOnes} = ${q.answer}`;

                    for (let t = 0; t < Math.floor(tens / 10); t++) {
                        renderTenFrame(tenFrameContainer, 10, 'bg-purple-400');
                    }
                    renderTenFrame(tenFrameContainer, onesBig, 'bg-amber-400', small, 'bg-sky-400');
                    return;
                }

                // 2. 10以內基礎加法
                if (q.num1 + q.num2 <= 10) {
                    hintText.innerText = `💡 直接相加：${q.num1} + ${q.num2} = ${q.answer}`;
                    renderTenFrame(tenFrameContainer, q.num1, 'bg-amber-400', q.num2, 'bg-sky-400');
                    return;
                }

                // 3. 進位加法 (如 8 + 5 / 4 + 8)：湊十法 (拆小數)
                const needToTen = 10 - (big % 10);
                const remain = small - needToTen;

                hintText.innerText = `💡 湊十法：把小數 ${small} 拆成 ${needToTen} 和 ${remain} ➔ 先算 ${big} + ${needToTen} = 10，再算 10 + ${remain} = ${q.answer}`;

                if (q.num1 >= q.num2) {
                    renderTenFrame(tenFrameContainer, q.num1, 'bg-amber-400', needToTen, 'bg-sky-400');
                    renderTenFrame(tenFrameContainer, remain, 'bg-sky-400');
                } else {
                    renderTenFrame(tenFrameContainer, needToTen, 'bg-amber-400');
                    renderTenFrame(tenFrameContainer, q.num2, 'bg-sky-400', remain, 'bg-amber-400');
                }

            } else {
                // === 減法：破十法 / 劃線拿走 (無負數) ===
                if (q.num1 <= 10) {
                    hintText.innerText = `💡 拿走 ${q.num2} 個 ➔ 剩下 ${q.answer} 個`;
                    renderTenFrame(tenFrameContainer, q.answer, 'bg-candy-green', q.num2, 'bg-gray-300 crossed-out');
                    return;
                }

                const ones = q.num1 % 10;
                if (q.num2 > ones) {
                    const remainFromTen = 10 - (q.num2 - ones);
                    hintText.innerText = `💡 破十法：從 10 拿走 ${q.num2} ➔ 剩下 ${q.answer}`;
                    renderTenFrame(tenFrameContainer, remainFromTen, 'bg-candy-green', q.num2, 'bg-gray-300 crossed-out');
                    if (ones > 0) renderTenFrame(tenFrameContainer, ones, 'bg-sky-400');
                } else {
                    hintText.innerText = `💡 個位相減：${ones} - ${q.num2} = ${ones - q.num2} ➔ 剩下 ${q.answer}`;
                    renderTenFrame(tenFrameContainer, 10, 'bg-purple-400');
                    renderTenFrame(tenFrameContainer, ones - q.num2, 'bg-candy-green', q.num2, 'bg-gray-300 crossed-out');
                }
            }
        }

        function renderTenFrame(container, count1, colorClass1, count2 = 0, colorClass2 = '') {
            const frame = document.createElement('div');
            frame.className = "ten-frame-grid";

            const total = count1 + count2;
            for (let i = 0; i < 10; i++) {
                const cell = document.createElement('div');
                cell.className = "ten-frame-cell";

                if (i < count1) {
                    const dot = document.createElement('div');
                    dot.className = `w-3.5 h-3.5 rounded-full ${colorClass1} shadow-inner`;
                    cell.appendChild(dot);
                } else if (i < total) {
                    const dot = document.createElement('div');
                    dot.className = `w-3.5 h-3.5 rounded-full ${colorClass2} shadow-inner`;
                    cell.appendChild(dot);
                }
                frame.appendChild(cell);
            }
            container.appendChild(frame);
        }

        function toggleHint() {
            playSound('click');
            const hintBox = document.getElementById('hintBox');
            hintBox.classList.toggle('hidden');
            hintBox.classList.toggle('flex');
        }

        function pressNum(numStr) {
            playSound('click');
            if (currentInput.length < 2) {
                currentInput += numStr;
                updateAnswerDisplay();
            }
        }

        function pressDelete() {
            playSound('click');
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateAnswerDisplay();
            }
        }

        function updateAnswerDisplay() {
            const display = document.getElementById('answerDisplay');
            if (currentInput === "") {
                display.innerText = "?";
                display.className = "min-w-[65px] sm:min-w-[80px] h-12 sm:h-16 bg-amber-50 rounded-2xl border-4 border-dashed border-amber-400 flex items-center justify-center text-amber-600 px-2 font-black transition-all text-2xl sm:text-3xl";
            } else {
                display.innerText = currentInput;
                display.className = "min-w-[65px] sm:min-w-[80px] h-12 sm:h-16 bg-white rounded-2xl border-4 border-amber-400 flex items-center justify-center text-amber-700 px-2 font-black transition-all text-3xl sm:text-4xl shadow-inner";
            }
        }

        function submitAnswer() {
            if (currentInput === "") return;

            const q = questions[currentQuestionIdx];
            const userAns = parseInt(currentInput, 10);
            const overlay = document.getElementById('feedbackOverlay');
            const icon = document.getElementById('feedbackIcon');

            if (userAns === q.answer) {
                playSound('correct');
                score++;
                icon.innerText = "✔️";
                icon.className = "text-7xl text-candy-green animate-bounce";
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');

                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    currentQuestionIdx++;
                    if (currentQuestionIdx < 10) {
                        renderQuestion();
                    } else {
                        endGame();
                    }
                }, 550);

            } else {
                playSound('wrong');
                icon.innerText = "❌";
                icon.className = "text-7xl text-candy-red animate-shake";
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');

                setTimeout(() => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                    currentInput = "";
                    updateAnswerDisplay();
                }, 550);
            }
        }

        function endGame() {
            if (timerInterval) clearInterval(timerInterval);
            playSound('fanfare');

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            document.getElementById('finalScore').innerText = `${score} / 10`;
            document.getElementById('finalTime').innerText = `${timerSeconds}s`;

            const starContainer = document.getElementById('starContainer');
            if (score >= 9) {
                starContainer.innerHTML = '<span>⭐</span><span>⭐</span><span>⭐</span>';
            } else if (score >= 6) {
                starContainer.innerHTML = '<span>⭐</span><span>⭐</span><span class="opacity-30">⭐</span>';
            } else {
                starContainer.innerHTML = '<span>⭐</span><span class="opacity-30">⭐</span><span class="opacity-30">⭐</span>';
            }

            document.getElementById('playerNameInput').value = "";
            document.getElementById('saveBtn').disabled = false;
            document.getElementById('saveBtn').innerText = "💾 記錄";

            showScreen('resultScreen');
        }

        function getLeaderboardData() {
            const data = localStorage.getItem('math_hero_leaderboard');
            return data ? JSON.parse(data) : { 10: [], 20: [], 30: [] };
        }

        function saveResult() {
            const nameInput = document.getElementById('playerNameInput');
            const name = nameInput.value.trim() || "小勇士";
            
            const board = getLeaderboardData();
            if (!board[currentMaxNum]) board[currentMaxNum] = [];

            board[currentMaxNum].push({
                name: name,
                score: score,
                time: timerSeconds,
                date: new Date().toLocaleDateString()
            });

            board[currentMaxNum].sort((a, b) => b.score - a.score || a.time - b.time);
            board[currentMaxNum] = board[currentMaxNum].slice(0, 10);

            localStorage.setItem('math_hero_leaderboard', JSON.stringify(board));
            playSound('click');

            document.getElementById('saveBtn').innerText = "✔️ 已記錄";
            document.getElementById('saveBtn').disabled = true;

            setTimeout(() => {
                showScreen('leaderboardScreen');
                loadLeaderboard(currentMaxNum);
            }, 500);
        }

        function loadLeaderboard(maxNum = activeTab) {
            switchTab(maxNum);
        }

        function switchTab(maxNum) {
            playSound('click');
            activeTab = maxNum;
            [10, 20, 30].forEach(num => {
                const btn = document.getElementById(`tab${num}`);
                if (num === maxNum) {
                    btn.className = "py-1 text-xs font-black rounded-xl text-white bg-candy-green shadow-sm";
                } else {
                    btn.className = "py-1 text-xs font-black rounded-xl text-gray-500";
                }
            });

            const data = getLeaderboardData()[maxNum] || [];
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = "";

            if (data.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 text-gray-400 text-xs font-bold">
                        👻 尚未有紀錄
                    </div>`;
                return;
            }

            data.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-amber-50/80 p-2 rounded-xl border border-amber-200 text-xs font-bold";
                
                let rankBadge = `<span class="w-5 h-5 rounded-full bg-gray-200 flex items-center justify-center text-gray-600 font-black text-xs">${index + 1}</span>`;
                if (index === 0) rankBadge = `<span class="text-base">🥇</span>`;
                else if (index === 1) rankBadge = `<span class="text-base">🥈</span>`;
                else if (index === 2) rankBadge = `<span class="text-base">🥉</span>`;

                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        ${rankBadge}
                        <span class="text-gray-800 font-extrabold text-xs sm:text-sm">${item.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-candy-green font-black text-xs sm:text-sm">⭐ ${item.score}</span>
                        <span class="text-gray-400 text-xs">⏱️ ${item.time}s</span>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function goHomeDirectly() {
            playSound('click');
            if (timerInterval) clearInterval(timerInterval);
            currentInput = "";
            showScreen('mainScreen');
        }

        window.onload = function() {
            showScreen('mainScreen');
        };
    </script>
</body>
</html>
