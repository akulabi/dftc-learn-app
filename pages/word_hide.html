<!DOCTYPE html>
<html lang="zh-Hant">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #db2777 100%);
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* 3D Card Flipping Styles */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), left 0.5s ease-in-out;
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            border: 4px solid #ffffff;
        }

        /* Card Shuffle Motion Keyframes */
        @keyframes card-shuffle {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.08) translateY(-15px) rotate(-6deg); }
            50% { transform: scale(0.95) translateY(10px) rotate(6deg); }
            75% { transform: scale(1.05) translateY(-5px) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .animate-shuffle {
            animation: card-shuffle 0.6s ease-in-out;
        }

        /* Shake animation for wrong answers */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }
        .animate-shake {
            animation: shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        /* Pulse glow effect */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.5); }
            50% { box-shadow: 0 0 30px rgba(234, 179, 8, 0.9); }
        }
        .glow-active {
            animation: pulse-glow 1.5s infinite;
        }

        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="text-slate-800 flex items-center justify-center p-3 sm:p-6 min-h-screen">

    <script>
        /* ==================== WEB AUDIO API SYNTHESIZER ==================== */
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, delay = 0, gainVal = 0.15) {
                if (!this.ctx) return;
                setTimeout(() => {
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch (e) {}
                }, delay);
            }

            flip() {
                this.init();
                this.playTone(350, 'sine', 0.08, 0, 0.1);
            }

            tick() {
                this.init();
                this.playTone(700, 'triangle', 0.04, 0, 0.08);
            }

            shuffle() {
                this.init();
                this.playTone(280, 'sine', 0.05, 0, 0.08);
                this.playTone(320, 'sine', 0.05, 60, 0.08);
                this.playTone(360, 'sine', 0.05, 120, 0.08);
            }

            correct() {
                this.init();
                this.playTone(523.25, 'sine', 0.1, 0);   // C5
                this.playTone(659.25, 'sine', 0.1, 80);  // E5
                this.playTone(783.99, 'sine', 0.2, 160); // G5
                this.playTone(1046.50, 'sine', 0.3, 240);// C6
            }

            retryCorrect() {
                this.init();
                this.playTone(440, 'sine', 0.1, 0);   // A4
                this.playTone(554.37, 'sine', 0.1, 100); // C#5
                this.playTone(659.25, 'sine', 0.2, 200); // E5
            }

            wrong() {
                this.init();
                this.playTone(200, 'sawtooth', 0.15, 0, 0.12);
                this.playTone(160, 'sawtooth', 0.25, 140, 0.12);
            }

            victory() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 880, 1046.50];
                notes.forEach((freq, i) => {
                    this.playTone(freq, 'triangle', 0.25, i * 110, 0.18);
                });
            }
        }

        const sound = new SoundFX();

        /* ==================== GRAPHICS & PURE TEXT POOL ==================== */
        // Cards contain strictly pure graphical emojis.
        // Choices contain strictly pure concise text words (NO emojis on buttons).
        const itemPool = [
            { name: "蘋果", emoji: "🍎", color: "bg-red-50 border-red-300 text-red-500" },
            { name: "香蕉", emoji: "🍌", color: "bg-yellow-50 border-yellow-300 text-yellow-500" },
            { name: "西瓜", emoji: "🍉", color: "bg-emerald-50 border-emerald-300 text-emerald-500" },
            { name: "草莓", emoji: "🍓", color: "bg-rose-50 border-rose-300 text-rose-500" },
            { name: "葡萄", emoji: "🍇", color: "bg-purple-50 border-purple-300 text-purple-500" },
            { name: "小狗", emoji: "🐶", color: "bg-amber-50 border-amber-300 text-amber-600" },
            { name: "貓咪", emoji: "🐱", color: "bg-orange-50 border-orange-300 text-orange-500" },
            { name: "兔子", emoji: "🐰", color: "bg-pink-50 border-pink-300 text-pink-400" },
            { name: "熊貓", emoji: "🐼", color: "bg-slate-50 border-slate-300 text-slate-700" },
            { name: "狐狸", emoji: "🦊", color: "bg-orange-100 border-orange-400 text-orange-600" },
            { name: "星星", emoji: "⭐", color: "bg-yellow-100 border-yellow-400 text-yellow-500" },
            { name: "月亮", emoji: "🌙", color: "bg-indigo-50 border-indigo-300 text-indigo-400" },
            { name: "太陽", emoji: "☀️", color: "bg-amber-100 border-amber-400 text-amber-500" },
            { name: "彩虹", emoji: "🌈", color: "bg-teal-50 border-teal-300 text-teal-400" },
            { name: "火箭", emoji: "🚀", color: "bg-blue-50 border-blue-300 text-blue-500" },
            { name: "足球", emoji: "⚽", color: "bg-slate-100 border-slate-400 text-slate-800" },
            { name: "漢堡", emoji: "🍔", color: "bg-amber-50 border-amber-300 text-amber-700" },
            { name: "雪糕", emoji: "🍦", color: "bg-pink-50 border-pink-300 text-pink-500" },
            { name: "吉他", emoji: "🎸", color: "bg-red-50 border-red-300 text-red-600" },
            { name: "蛋糕", emoji: "🎂", color: "bg-rose-100 border-rose-300 text-rose-500" },
            { name: "飛機", emoji: "✈️", color: "bg-sky-50 border-sky-300 text-sky-500" },
            { name: "汽車", emoji: "🚗", color: "bg-red-50 border-red-300 text-red-500" },
            { name: "皇冠", emoji: "👑", color: "bg-yellow-100 border-yellow-400 text-amber-500" },
            { name: "大象", emoji: "🐘", color: "bg-slate-100 border-slate-300 text-slate-500" },
            { name: "小提琴", emoji: "🎻", color: "bg-amber-100 border-amber-400 text-amber-800" },
            { name: "單車", emoji: "🚲", color: "bg-blue-50 border-blue-300 text-blue-600" }
        ];

        /* ==================== GAME STATE ==================== */
        let currentRound = 1;
        let score = 0;
        let streak = 0;
        let firstTrySuccessCount = 0;
        let secondTrySuccessCount = 0;
        
        let roundItems = [];
        let missingItem = null;
        let displayCards = [];
        let isRetryAttempt = false;
        let timerInterval = null;
        let countdownLeft = 5.0;

        /* ==================== CORE GAME FLOW ==================== */

        function startGame() {
            sound.init();
            currentRound = 1;
            score = 0;
            streak = 0;
            firstTrySuccessCount = 0;
            secondTrySuccessCount = 0;
            
            showScreen('screen-game');
            loadRound(currentRound);
        }

        // Card Progression Rules:
        // Rounds 1-3: 3 cards
        // Rounds 4-7: 4 cards
        // Rounds 8-10: 5 cards
        function getCardCountForRound(round) {
            if (round <= 3) return 3;
            if (round <= 7) return 4;
            return 5;
        }

        function loadRound(round) {
            const count = getCardCountForRound(round);
            isRetryAttempt = false;

            // Update UI headers
            document.getElementById('ui-round').textContent = round;
            document.getElementById('ui-score').textContent = score;
            document.getElementById('ui-difficulty-badge').textContent = `${count} 張卡片`;
            
            const streakBadge = document.getElementById('ui-streak-badge');
            if (streak >= 2) {
                streakBadge.classList.remove('hidden');
                document.getElementById('ui-streak-count').textContent = streak;
            } else {
                streakBadge.classList.add('hidden');
            }

            document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-eye text-indigo-500"></i> 請記住以下 ${count} 個圖樣！`;
            
            renderOptionsDisabled("記憶倒數中...");

            // Select random unique items for this round
            const shuffledPool = [...itemPool].sort(() => Math.random() - 0.5);
            roundItems = shuffledPool.slice(0, count);
            displayCards = [...roundItems];

            // Render initial cards face up
            renderCards(displayCards, false);

            // 5 Seconds Memory Timer
            startMemoryTimer(5.0, () => {
                triggerShufflePhase();
            });
        }

        function startMemoryTimer(seconds, onComplete) {
            clearInterval(timerInterval);
            countdownLeft = seconds;
            const timerBar = document.getElementById('ui-timer-bar');
            const timerText = document.getElementById('ui-timer-text');
            
            timerBar.style.width = '100%';
            timerText.textContent = countdownLeft.toFixed(1) + 's';

            const stepMs = 100;
            const totalSteps = (seconds * 1000) / stepMs;
            let currentStep = 0;

            timerInterval = setInterval(() => {
                currentStep++;
                countdownLeft = Math.max(0, seconds - (currentStep * stepMs / 1000));
                
                const percent = (countdownLeft / seconds) * 100;
                timerBar.style.width = percent + '%';
                timerText.textContent = countdownLeft.toFixed(1) + 's';

                if (currentStep % 10 === 0 && countdownLeft > 0) {
                    sound.tick();
                }

                if (countdownLeft <= 0) {
                    clearInterval(timerInterval);
                    onComplete();
                }
            }, stepMs);
        }

        function triggerShufflePhase() {
            sound.flip();
            document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-shuffle text-amber-500 animate-spin"></i> 卡片翻轉洗牌中...`;
            document.getElementById('ui-timer-text').textContent = '洗牌中';
            document.getElementById('ui-timer-bar').style.width = '0%';

            // Step 1: Flip face down
            flipAllCards(true);

            // Step 2: Shuffle & swap missing item
            setTimeout(() => {
                sound.shuffle();
                // Add shuffle animation class
                const inners = document.querySelectorAll('.card-inner');
                inners.forEach(el => el.classList.add('animate-shuffle'));

                // Choose 1 missing item
                const missingIdx = Math.floor(Math.random() * roundItems.length);
                missingItem = roundItems[missingIdx];

                // Shuffle positions
                let shuffledOrder = [...roundItems].sort(() => Math.random() - 0.5);
                displayCards = shuffledOrder.map(item => item === missingItem ? { isMissing: true } : item);

                // Re-render layout (cards remain face down)
                renderCards(displayCards, true);

                // Step 3: Flip back face up displaying ❓
                setTimeout(() => {
                    sound.flip();
                    flipAllCards(false);
                    enableAnsweringPhase();
                }, 800);

            }, 700);
        }

        function enableAnsweringPhase() {
            document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-circle-question text-rose-500 animate-bounce"></i> 哪一個圖案消失了？`;
            document.getElementById('ui-timer-text').textContent = '請選擇';
            
            // Generate option choices (Randomized list of pure text names)
            const choices = [...roundItems].sort(() => Math.random() - 0.5);
            renderOptionsButtons(choices);
        }

        /* ==================== CARD & UI DOM RENDERING ==================== */

        function renderCards(cards, isFlippedInitially = false) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const count = cards.length;
            if (count === 3) {
                container.className = "grid grid-cols-3 gap-3 sm:gap-6 my-auto max-w-lg mx-auto w-full";
            } else if (count === 4) {
                container.className = "grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 my-auto max-w-xl mx-auto w-full";
            } else {
                container.className = "grid grid-cols-3 sm:grid-cols-5 gap-2 sm:gap-3 my-auto max-w-2xl mx-auto w-full";
            }

            cards.forEach((item, index) => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = `perspective-1000 h-36 sm:h-48 w-full`;

                const inner = document.createElement('div');
                inner.className = `card-inner ${isFlippedInitially ? 'is-flipped' : ''}`;
                inner.id = `card-inner-${index}`;

                // Front View (Pure Icon/Emoji Only - No Text)
                const front = document.createElement('div');
                
                if (item.isMissing) {
                    front.className = `card-front bg-slate-200 border-4 border-dashed border-slate-400 text-slate-400`;
                    front.innerHTML = `
                        <div class="text-5xl sm:text-7xl font-black animate-pulse">❓</div>
                    `;
                } else {
                    front.className = `card-front ${item.color} border-4`;
                    front.innerHTML = `
                        <div class="text-6xl sm:text-8xl transform hover:scale-110 transition-transform">${item.emoji}</div>
                    `;
                }

                // Back View
                const back = document.createElement('div');
                back.className = `card-back`;
                back.innerHTML = `
                    <div class="text-4xl text-white/80 drop-shadow">🧠</div>
                `;

                inner.appendChild(front);
                inner.appendChild(back);
                cardWrapper.appendChild(inner);
                container.appendChild(cardWrapper);
            });
        }

        function flipAllCards(toBack) {
            const inners = document.querySelectorAll('.card-inner');
            inners.forEach(inner => {
                if (toBack) {
                    inner.classList.add('is-flipped');
                } else {
                    inner.classList.remove('is-flipped');
                }
            });
        }

        function renderOptionsDisabled(msg) {
            const container = document.getElementById('options-container');
            container.innerHTML = `<span class="text-slate-400 font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-spinner animate-spin"></i> ${msg}</span>`;
        }

        function renderOptionsButtons(choices) {
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            choices.forEach(item => {
                const btn = document.createElement('button');
                // PURE TEXT ONLY (No icons or emojis on option buttons)
                btn.className = `choice-btn bg-white hover:bg-indigo-50 active:bg-indigo-100 text-slate-800 font-black text-base sm:text-xl px-5 sm:px-7 py-3 rounded-2xl border-2 border-slate-200 shadow-md hover:border-indigo-400 transition-all transform hover:-translate-y-0.5 active:translate-y-0 tracking-wide flex-1 min-w-[90px] sm:min-w-[110px] text-center`;
                btn.textContent = item.name;
                btn.onclick = () => handleAnswerSelect(item, btn);
                container.appendChild(btn);
            });
        }

        /* ==================== ANSWER HANDLING & SCORING ==================== */

        function handleAnswerSelect(selectedItem, btnElement) {
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selectedItem.name === missingItem.name) {
                // Correct Choice
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'ring-4', 'ring-emerald-200');

                let gained = 0;
                if (!isRetryAttempt) {
                    gained = 10;
                    firstTrySuccessCount++;
                    streak++;
                    sound.correct();
                } else {
                    gained = 5;
                    secondTrySuccessCount++;
                    sound.retryCorrect();
                }

                score += gained;
                document.getElementById('ui-score').textContent = score;

                showFloatingFeedback(`+${gained} 分！答對了！`, 'text-emerald-600');

                setTimeout(() => {
                    nextRound();
                }, 1100);

            } else {
                // Wrong Choice
                sound.wrong();
                streak = 0; // Reset streak
                btnElement.classList.remove('bg-white');
                btnElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600', 'animate-shake');

                if (!isRetryAttempt) {
                    // Give Second Attempt (Retry for 5 points)
                    isRetryAttempt = true;
                    showFloatingFeedback(`答錯了！給予一次補答機會 (+5分)`, 'text-orange-500');

                    setTimeout(() => {
                        allBtns.forEach(b => {
                            if (b !== btnElement) b.disabled = false;
                        });
                        btnElement.style.opacity = '0.35';
                        document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-orange-500"></i> 再試一次！選擇消失的詞語 (補答 +5分)`;
                    }, 900);

                } else {
                    // Failed Retry -> Reveal correct answer & move on
                    showFloatingFeedback(`還是錯了！正確答案是：${missingItem.name}`, 'text-rose-500');

                    setTimeout(() => {
                        nextRound();
                    }, 1500);
                }
            }
        }

        function showFloatingFeedback(msg, colorClass) {
            const header = document.getElementById('options-header');
            header.className = `text-center font-black text-sm sm:text-base mb-3 ${colorClass}`;
            header.textContent = msg;
        }

        function nextRound() {
            currentRound++;
            if (currentRound > 10) {
                endGame();
            } else {
                document.getElementById('options-header').className = "text-center font-black text-slate-600 text-xs sm:text-sm mb-3";
                document.getElementById('options-header').textContent = "❓ 哪一個圖案消失了？請點選正確詞語：";
                loadRound(currentRound);
            }
        }

        function endGame() {
            sound.victory();
            
            // Fire Confetti
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            showScreen('screen-result');

            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-first-try').textContent = `${firstTrySuccessCount} / 10`;
            
            const accuracy = Math.round(((firstTrySuccessCount * 1.0 + secondTrySuccessCount * 0.5) / 10) * 100);
            document.getElementById('stat-accuracy').textContent = `${accuracy}%`;

            const emojiEl = document.getElementById('result-emoji');
            if (score >= 90) emojiEl.textContent = '👑';
            else if (score >= 70) emojiEl.textContent = '🏆';
            else if (score >= 50) emojiEl.textContent = '🌟';
            else emojiEl.textContent = '⚡';

            document.getElementById('name-input-box').style.display = 'block';
        }

        /* ==================== LEADERBOARD LOGIC ==================== */

        function getLeaderboardData() {
            const data = localStorage.getItem('memory_master_leaderboard');
            return data ? JSON.parse(data) : [];
        }

        function saveLeaderboardData(data) {
            localStorage.setItem('memory_master_leaderboard', JSON.stringify(data));
        }

        function submitScore() {
            const nameInput = document.getElementById('player-name-input');
            const name = nameInput.value.trim() || '無名大師';

            const records = getLeaderboardData();
            const dateStr = new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            const accuracy = Math.round(((firstTrySuccessCount * 1.0 + secondTrySuccessCount * 0.5) / 10) * 100);

            records.push({
                name: name,
                score: score,
                accuracy: accuracy,
                date: dateStr
            });

            // Sort by score descending
            records.sort((a, b) => b.score - a.score);

            // Keep top 10
            saveLeaderboardData(records.slice(0, 10));

            document.getElementById('name-input-box').style.display = 'none';
            showLeaderboard();
        }

        function showLeaderboard() {
            showScreen('screen-leaderboard');
            const container = document.getElementById('leaderboard-list');
            const records = getLeaderboardData();

            if (records.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 font-bold">
                        尚無高分紀錄，成為第一個登榜大師吧！
                    </div>
                `;
                return;
            }

            container.innerHTML = records.map((item, idx) => {
                let badgeStyle = 'bg-slate-200 text-slate-700';
                let rankLabel = `${idx + 1}`;
                
                if (idx === 0) { badgeStyle = 'bg-amber-400 text-amber-950'; rankLabel = '🥇 1'; }
                else if (idx === 1) { badgeStyle = 'bg-slate-300 text-slate-800'; rankLabel = '🥈 2'; }
                else if (idx === 2) { badgeStyle = 'bg-amber-600 text-white'; rankLabel = '🥉 3'; }

                return `
                    <div class="flex items-center justify-between bg-white/90 p-3 sm:p-3.5 rounded-2xl border border-slate-200/80 shadow-sm">
                        <div class="flex items-center gap-3">
                            <span class="w-10 h-8 flex items-center justify-center font-black rounded-xl text-xs sm:text-sm ${badgeStyle}">
                                ${rankLabel}
                            </span>
                            <div>
                                <span class="font-black text-slate-800 text-base block leading-tight">${escapeHtml(item.name)}</span>
                                <span class="text-[11px] text-slate-400 font-bold">準確率: ${item.accuracy || 0}%</span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-black text-indigo-700 leading-none">${item.score} <span class="text-xs font-normal text-slate-400">分</span></span>
                            <span class="text-[10px] text-slate-400 block">${item.date}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function clearLeaderboard() {
            if (confirm("確定要清空所有龍虎榜紀錄嗎？")) {
                localStorage.removeItem('memory_master_leaderboard');
                showLeaderboard();
            }
        }

        /* ==================== GENERAL UTILITIES ==================== */

        function showScreen(screenId) {
            ['screen-home', 'screen-game', 'screen-result', 'screen-leaderboard'].forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.remove('hidden');
                    el.classList.add('flex');
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                }
            });
        }

        function showHome() {
            clearInterval(timerInterval);
            showScreen('screen-home');
        }

        function confirmRestart() {
            if (confirm("確定要重新開始遊戲嗎？當前得分將會重置。")) {
                clearInterval(timerInterval);
                startGame();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
