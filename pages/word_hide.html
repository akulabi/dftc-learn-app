<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶大挑戰 - 超強大腦考考你</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            user-select: none;
        }

        /* Perspective for 3D card flips */
        .perspective-1000 {
            perspective: 1000px;
        }

        /* Card 3d transform container */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Back side of card (patterned overlay when flipped) */
        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: 4px solid #ffffff;
        }

        /* Shaking animation for wrong answers */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }

        /* Pulse / Highlight for timer */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.03); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 1.5s infinite;
        }

        /* Glassmorphism panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="text-slate-800 flex items-center justify-center p-3 sm:p-6">

    <!-- Container -->
    <div id="app" class="w-full max-w-4xl min-h-[620px] glass-panel rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between relative overflow-hidden">
        
        <!-- ==================== HOME SCREEN ==================== -->
        <div id="screen-home" class="flex flex-col items-center justify-center flex-1 text-center py-6 space-y-6">
            <div class="relative">
                <span class="text-6xl sm:text-8xl animate-bounce inline-block drop-shadow-md">🧠</span>

                    極速大腦

        <div id="screen-game" class="hidden flex-col flex-1 justify-between space-y-4">
            
            <!-- Top Status Bar -->
            <div class="flex items-center justify-between bg-purple-100/80 rounded-2xl p-3 sm:p-4 shadow-sm border border-purple-200">
                <div class="flex items-center gap-2 sm:gap-3">
                    <span class="bg-purple-600 text-white text-xs sm:text-base font-bold px-3 py-1.5 rounded-xl shadow">

            <!-- Cards Display Area -->

        <!-- ==================== RESULT SCREEN ==================== -->
        <div id="screen-result" class="hidden flex-col items-center justify-center flex-1 text-center py-6 space-y-6">

                    <button onclick="submitScore()" class="bg-purple-600 hover:bg-purple-700 text-white font-extrabold px-6 py-3 rounded-xl shadow-md transition">
                        提交

            </div>

            <div class="flex gap-4 w-full max-w-md">

                    <i class="fa-solid fa-rotate-right mr-1"></i> 再玩一次

                <button onclick="showHome()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-6 rounded-xl shadow transition">
                    返回主頁
                </button>
            </div>
        </div>

    </div>

    <script>
        /* ==================== AUDIO SYNTHESIZER (Web Audio API) ==================== */
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playTone(freq, type, duration, delay = 0) {
                if (!this.ctx) return;
                setTimeout(() => {
                    try {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = type;
                        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start();
                        osc.stop(this.ctx.currentTime + duration);
                    } catch (e) {}
                }, delay);
            }

            flip() {
                this.init();
                this.playTone(400, 'sine', 0.08);
            }

            tick() {
                this.init();
                this.playTone(600, 'triangle', 0.05);
            }

            correct() {
                this.init();
                this.playTone(523.25, 'sine', 0.1, 0);   // C5
                this.playTone(659.25, 'sine', 0.1, 100); // E5
                this.playTone(783.99, 'sine', 0.2, 200); // G5
            }

            retry() {
                this.init();
                this.playTone(440, 'sine', 0.1, 0);
                this.playTone(554.37, 'sine', 0.15, 120);
            }

            wrong() {
                this.init();
                this.playTone(220, 'sawtooth', 0.15, 0);
                this.playTone(180, 'sawtooth', 0.25, 150);
            }

            gameComplete() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    this.playTone(freq, 'triangle', 0.25, idx * 120);
                });
            }
        }

        const sound = new SoundEffects();

        /* ==================== ITEM POOL DATABASE (簡潔詞語，無雜質) ==================== */
        const itemPool = [
            { name: "蘋果", emoji: "🍎", color: "bg-red-50 border-red-300" },
            { name: "香蕉", emoji: "🍌", color: "bg-yellow-50 border-yellow-300" },
            { name: "西瓜", emoji: "🍉", color: "bg-emerald-50 border-emerald-300" },
            { name: "草莓", emoji: "🍓", color: "bg-rose-50 border-rose-300" },
            { name: "葡萄", emoji: "🍇", color: "bg-purple-50 border-purple-300" },
            { name: "小狗", emoji: "🐶", color: "bg-amber-50 border-amber-300" },
            { name: "貓咪", emoji: "🐱", color: "bg-orange-50 border-orange-300" },
            { name: "兔子", emoji: "🐰", color: "bg-pink-50 border-pink-300" },
            { name: "熊貓", emoji: "🐼", color: "bg-slate-50 border-slate-300" },
            { name: "狐狸", emoji: "🦊", color: "bg-orange-100 border-orange-400" },
            { name: "星星", emoji: "⭐", color: "bg-yellow-100 border-yellow-400" },
            { name: "月亮", emoji: "🌙", color: "bg-indigo-50 border-indigo-300" },
            { name: "太陽", emoji: "☀️", color: "bg-amber-100 border-amber-400" },
            { name: "彩虹", emoji: "🌈", color: "bg-teal-50 border-teal-300" },
            { name: "火箭", emoji: "🚀", color: "bg-blue-50 border-blue-300" },
            { name: "足球", emoji: "⚽", color: "bg-sky-50 border-sky-300" },
            { name: "漢堡", emoji: "🍔", color: "bg-amber-50 border-yellow-400" },
            { name: "雪糕", emoji: "🍦", color: "bg-pink-50 border-pink-300" },
            { name: "吉他", emoji: "🎸", color: "bg-red-50 border-red-300" },
            { name: "蛋糕", emoji: "🎂", color: "bg-rose-100 border-rose-300" },
            { name: "飛機", emoji: "✈️", color: "bg-sky-50 border-sky-300" },
            { name: "汽車", emoji: "🚗", color: "bg-red-50 border-red-300" },
            { name: "皇冠", emoji: "👑", color: "bg-yellow-100 border-yellow-400" },
            { name: "大象", emoji: "🐘", color: "bg-slate-100 border-slate-300" },
            { name: "鋼琴", emoji: "🎹", color: "bg-slate-50 border-slate-400" }
        ];

        /* ==================== GAME STATE ==================== */
        let currentRound = 1;
        let score = 0;
        let firstTrySuccessCount = 0;
        let secondTrySuccessCount = 0;
        
        let roundItems = [];       // items shown in current round
        let missingItem = null;    // the missing item target
        let displayCards = [];     // items state on layout
        let isSecondChance = false;// status if player is on 補答 phase
        let timerInterval = null;
        let countdownLeft = 5.0;

        /* ==================== CORE GAME LOGIC ==================== */

        function startGame() {
            sound.init();
            currentRound = 1;
            score = 0;
            firstTrySuccessCount = 0;
            secondTrySuccessCount = 0;
            
            showScreen('screen-game');
            loadRound(currentRound);
        }

        // Determine item count based on round specs:
        // Rounds 1-3: 3 items | Rounds 4-7: 4 items | Rounds 8-10: 5 items
        function getItemCountForRound(round) {
            if (round <= 3) return 3;
            if (round <= 7) return 4;
            return 5;
        }

        function loadRound(round) {
            const count = getItemCountForRound(round);
            isSecondChance = false;

            // UI updates
            document.getElementById('ui-round').textContent = round;
            document.getElementById('ui-score').textContent = score;
            document.getElementById('ui-difficulty-badge').textContent = `${count} 個圖卡`;
            document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-eye text-indigo-500"></i> 請牢記以下 ${count} 個圖案！`;
            
            // Disable option buttons during memory phase
            renderOptionsDisabled("記憶時間中...");

            // Select random unique items
            const shuffledPool = [...itemPool].sort(() => Math.random() - 0.5);
            roundItems = shuffledPool.slice(0, count);
            displayCards = [...roundItems];

            // Render cards (All active & visible)
            renderCards(displayCards, false);

            // Start 5 Seconds Timer
            startMemoryTimer(5.0, () => {
                startShuffleAndCoverPhase();
            });
        }

        function startMemoryTimer(seconds, onComplete) {
            clearInterval(timerInterval);
            countdownLeft = seconds;
            const timerBar = document.getElementById('ui-timer-bar');
            const timerText = document.getElementById('ui-timer-text');
            
            timerBar.style.width = '100%';
            timerText.textContent = countdownLeft.toFixed(1) + 's';

            const stepMs = 100;
            const totalSteps = (seconds * 1000) / stepMs;
            let currentStep = 0;

            timerInterval = setInterval(() => {
                currentStep++;
                countdownLeft = Math.max(0, seconds - (currentStep * stepMs / 1000));
                
                const percent = (countdownLeft / seconds) * 100;
                timerBar.style.width = percent + '%';
                timerText.textContent = countdownLeft.toFixed(1) + 's';

                if (currentStep % 10 === 0 && countdownLeft > 0) {
                    sound.tick();
                }

                if (countdownLeft <= 0) {
                    clearInterval(timerInterval);
                    onComplete();
                }
            }, stepMs);
        }

        function startShuffleAndCoverPhase() {
            sound.flip();
            document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-shuffle text-amber-500 animate-spin"></i> 卡片覆蓋洗牌中...`;
            document.getElementById('ui-timer-text').textContent = '洗牌中';
            document.getElementById('ui-timer-bar').style.width = '0%';

            // 1. Flip all cards face down
            flipAllCards(true);

            // 2. Wait for flip down, then shuffle order and pick missing item
            setTimeout(() => {
                // Select missing item
                const missingIndex = Math.floor(Math.random() * roundItems.length);
                missingItem = roundItems[missingIndex];

                // Shuffle order of remaining cards
                let shuffledCards = [...roundItems].sort(() => Math.random() - 0.5);
                
                // Replace missing card position with a mystery placeholder
                displayCards = shuffledCards.map(item => item === missingItem ? { isMissing: true } : item);

                // Re-render cards (they remain flipped)
                renderCards(displayCards, true);

                // 3. Reveal cards after shuffle
                setTimeout(() => {
                    sound.flip();
                    flipAllCards(false);
                    enableAnsweringPhase();
                }, 800);

            }, 600);
        }

        function enableAnsweringPhase() {
            document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-circle-question text-red-500 animate-bounce"></i> 哪一個圖案消失了？`;
            document.getElementById('ui-timer-text').textContent = '答題中';
            
            // Build choices (Current round items as choices, randomized)
            const choices = [...roundItems].sort(() => Math.random() - 0.5);
            renderOptionsButtons(choices);
        }

        /* ==================== CARD & UI RENDERING ==================== */

        function renderCards(cards, isFlippedInitially = false) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            // Adjust grid layout dynamically according to card amount
            const count = cards.length;
            if (count === 3) {
                container.className = "grid grid-cols-3 gap-3 sm:gap-6 my-auto max-w-lg mx-auto w-full";
            } else if (count === 4) {
                container.className = "grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 my-auto max-w-xl mx-auto w-full";
            } else {
                container.className = "grid grid-cols-3 sm:grid-cols-5 gap-2 sm:gap-3 my-auto max-w-2xl mx-auto w-full";
            }

            cards.forEach((item, index) => {
                const cardWrapper = document.createElement('div');
                cardWrapper.className = `perspective-1000 h-36 sm:h-48 w-full`;

                const inner = document.createElement('div');
                inner.className = `card-inner ${isFlippedInitially ? 'is-flipped' : ''}`;
                inner.id = `card-inner-${index}`;

                // Front View (Pure Graphic - NO TEXT)
                const front = document.createElement('div');
                
                if (item.isMissing) {
                    front.className = `card-front bg-slate-200 border-4 border-dashed border-slate-400 text-slate-400`;
                    front.innerHTML = `
                        <div class="text-5xl sm:text-7xl font-black animate-pulse">❓</div>
                    `;
                } else {
                    front.className = `card-front ${item.color} border-4`;
                    front.innerHTML = `
                        <div class="text-6xl sm:text-8xl transform hover:scale-110 transition-transform">${item.emoji}</div>
                    `;
                }

                // Back View (Pattern Overlay)
                const back = document.createElement('div');
                back.className = `card-back`;
                back.innerHTML = `
                    <div class="text-3xl sm:text-4xl text-purple-400 opacity-60">🧠</div>
                `;

                inner.appendChild(front);
                inner.appendChild(back);
                cardWrapper.appendChild(inner);
                container.appendChild(cardWrapper);
            });
        }

        function flipAllCards(toBack) {
            const inners = document.querySelectorAll('.card-inner');
            inners.forEach(inner => {
                if (toBack) {
                    inner.classList.add('is-flipped');
                } else {
                    inner.classList.remove('is-flipped');
                }
            });
        }

        function renderOptionsDisabled(message) {
            const container = document.getElementById('options-container');
            container.innerHTML = `<span class="text-slate-400 font-bold text-sm flex items-center gap-2"><i class="fa-solid fa-hourglass-start animate-spin"></i> ${message}</span>`;
        }

        function renderOptionsButtons(choices) {
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            choices.forEach(item => {
                const btn = document.createElement('button');
                btn.className = `choice-btn bg-white hover:bg-purple-50 active:bg-purple-100 text-slate-800 font-extrabold text-base sm:text-xl px-5 sm:px-8 py-3 rounded-2xl border-2 border-slate-200 shadow-md hover:border-purple-400 transition-all transform hover:-translate-y-0.5 active:translate-y-0 tracking-wide`;
                // Pure text options - NO EMOJI / IMAGE HINTS
                btn.innerHTML = `<span>${item.name}</span>`;
                btn.onclick = () => handleAnswer(item, btn);
                container.appendChild(btn);
            });
        }

        /* ==================== ANSWER & SCORING ==================== */

        function handleAnswer(selectedItem, btnElement) {
            // Disable all choice buttons temporarily to avoid multiple clicks
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selectedItem.name === missingItem.name) {
                // Correct answer
                sound.correct();
                btnElement.classList.remove('bg-white', 'border-slate-200');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-600', 'ring-4', 'ring-green-200');

                let gainedPoints = 0;
                if (!isSecondChance) {
                    gainedPoints = 10;
                    firstTrySuccessCount++;
                } else {
                    gainedPoints = 5;
                    secondTrySuccessCount++;
                }
                score += gainedPoints;
                document.getElementById('ui-score').textContent = score;

                // Show feedback banner
                showFloatingFeedback(`+${gainedPoints} 正確！`, 'text-green-500');

                // Transition to next round after short delay
                setTimeout(() => {
                    nextRound();
                }, 1200);

            } else {
                // Wrong answer
                sound.wrong();
                btnElement.classList.remove('bg-white');
                btnElement.classList.add('bg-red-500', 'text-white', 'border-red-600', 'animate-shake');

                if (!isSecondChance) {
                    // Give Second Chance ("補答")
                    isSecondChance = true;
                    sound.retry();
                    showFloatingFeedback(`答錯了！給予一次補答機會 (+5分)`, 'text-orange-500');

                    setTimeout(() => {
                        // Re-enable remaining buttons except the wrong one
                        allBtns.forEach(b => {
                            if (b !== btnElement) b.disabled = false;
                        });
                        btnElement.style.opacity = '0.4';
                        document.getElementById('ui-phase-text').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-orange-500"></i> 再試一次！選擇消失的詞語 (補答 +5分)`;
                    }, 1000);

                } else {
                    // Second Chance failed -> Skip to next round
                    showFloatingFeedback(`遺憾答錯！正確答案是：${missingItem.name}`, 'text-red-500');
                    
                    setTimeout(() => {
                        nextRound();
                    }, 1600);
                }
            }
        }

        function showFloatingFeedback(msg, colorClass) {
            const header = document.getElementById('options-header');
            header.className = `text-center font-extrabold text-base sm:text-lg mb-3 ${colorClass}`;
            header.textContent = msg;
        }

        function nextRound() {
            currentRound++;
            if (currentRound > 10) {
                endGame();
            } else {
                document.getElementById('options-header').className = "text-center font-extrabold text-slate-600 text-sm sm:text-base mb-3";
                document.getElementById('options-header').textContent = "❓ 哪一個圖案消失了？請選擇對應詞語：";
                loadRound(currentRound);
            }
        }

        function endGame() {
            sound.gameComplete();
            showScreen('screen-result');

            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-first-try').textContent = `${firstTrySuccessCount} 題`;
            document.getElementById('stat-second-try').textContent = `${secondTrySuccessCount} 題`;

            // Emoji rating
            const emojiEl = document.getElementById('result-emoji');
            if (score >= 90) emojiEl.textContent = '👑';
            else if (score >= 70) emojiEl.textContent = '🏆';
            else if (score >= 50) emojiEl.textContent = '🌟';
            else emojiEl.textContent = '💪';

            // Show name input if score qualifies or is valid
            const nameBox = document.getElementById('name-input-box');
            nameBox.style.display = 'block';
        }

        /* ==================== LEADERBOARD (LOCALSTORAGE) ==================== */

        function getLeaderboardData() {
            const data = localStorage.getItem('memory_game_leaderboard');
            return data ? JSON.parse(data) : [];
        }

        function saveLeaderboardData(data) {
            localStorage.setItem('memory_game_leaderboard', JSON.stringify(data));
        }

        function submitScore() {
            const nameInput = document.getElementById('player-name-input');
            const name = nameInput.value.trim() || '無名英雄';

            const records = getLeaderboardData();
            const dateStr = new Date().toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            records.push({
                name: name,
                score: score,
                date: dateStr
            });

            // Sort descending by score
            records.sort((a, b) => b.score - a.score);

            // Keep top 10
            const top10 = records.slice(0, 10);
            saveLeaderboardData(top10);

            // Hide input box to avoid multi submission
            document.getElementById('name-input-box').style.display = 'none';

            showLeaderboard();
        }

        function showLeaderboard() {
            showScreen('screen-leaderboard');
            const container = document.getElementById('leaderboard-list');
            const records = getLeaderboardData();

            if (records.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400 font-bold">
                        尚無紀錄，快來成為第一個榜首吧！
                    </div>
                `;
                return;
            }

            container.innerHTML = records.map((item, idx) => {
                let badgeColor = 'bg-slate-200 text-slate-700';
                let medal = `${idx + 1}`;
                
                if (idx === 0) { badgeColor = 'bg-amber-400 text-white'; medal = '🥇 1'; }
                else if (idx === 1) { badgeColor = 'bg-slate-300 text-slate-800'; medal = '🥈 2'; }
                else if (idx === 2) { badgeColor = 'bg-amber-600 text-white'; medal = '🥉 3'; }

                return `
                    <div class="flex items-center justify-between bg-white/80 p-3 rounded-xl border border-slate-200 shadow-sm">
                        <div class="flex items-center gap-3">
                            <span class="w-10 h-8 flex items-center justify-center font-black rounded-lg text-sm ${badgeColor}">
                                ${medal}
                            </span>
                            <span class="font-extrabold text-slate-800 text-base">${escapeHtml(item.name)}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-black text-purple-700 mr-2">${item.score} <span class="text-xs font-normal text-slate-500">分</span></span>
                            <span class="text-xs text-slate-400 block">${item.date}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function clearLeaderboard() {
            if (confirm("確定要清空龍虎榜紀錄嗎？")) {
                localStorage.removeItem('memory_game_leaderboard');
                showLeaderboard();
            }
        }

        /* ==================== HELPER UTILITIES ==================== */

        function showScreen(screenId) {
            ['screen-home', 'screen-game', 'screen-result', 'screen-leaderboard'].forEach(id => {
                const el = document.getElementById(id);
                if (id === screenId) {
                    el.classList.remove('hidden');
                    el.classList.add('flex');
                } else {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                }
            });
        }

        function showHome() {
            clearInterval(timerInterval);
            showScreen('screen-home');
        }

        function confirmRestart() {
            if (confirm("確定要重新開始遊戲嗎？當前進度將會遺失。")) {
                clearInterval(timerInterval);
                startGame();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
