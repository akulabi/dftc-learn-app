<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Phonics Playground - Learn to Spell & Speak</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Sniglet:wght@800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                        sniglet: ['Sniglet', 'cursive'],
                    },
                    colors: {
                        bubblePink: '#FF70A6',
                        bubbleOrange: '#FF9F1C',
                        bubbleYellow: '#FFD166',
                        bubbleGreen: '#06D6A0',
                        bubbleBlue: '#118AB2',
                        bubblePurple: '#B5179E',
                    },
                    boxShadow: {
                        'pop': '0 3px 0px rgba(0,0,0,0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            height: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #fff9c4 50%, #fce4ec 100%);
        }

        .key-btn {
            transition: all 0.1s ease-out;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .key-btn:active {
            transform: translateY(2px) scale(0.96) !important;
            box-shadow: 0 1px 0px rgba(0,0,0,0.2) !important;
        }

        .pop-star {
            position: absolute;
            pointer-events: none;
            animation: popAndFade 0.6s ease-out forwards;
        }
        @keyframes popAndFade {
            0% { transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; }
            50% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(180deg); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--dx) * 1.5), calc(-50% + var(--dy) * 1.5)) scale(0); opacity: 0; }
        }

        .mascot-pulse {
            animation: pulseWave 1.2s infinite ease-in-out;
        }
        @keyframes pulseWave {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08) rotate(4deg); }
        }

        .sound-wave {
            animation: soundWaveAnim 0.5s infinite alternate ease-in-out;
        }
        @keyframes soundWaveAnim {
            from { transform: scaleY(0.6); }
            to { transform: scaleY(1.3); }
        }

        .phoneme-active {
            transform: scale(1.1);
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .bounce-emoji {
            animation: emojiBounce 0.8s infinite alternate cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes emojiBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-6px) scale(1.1) rotate(4deg); }
        }
    </style>
</head>
<body class="h-full w-full flex flex-col justify-between p-2 sm:p-4 select-none relative box-border">

    <!-- Particle Layer -->
    <div id="particleCanvas" class="fixed inset-0 pointer-events-none z-50"></div>

    <!-- Header / Mascot -->

                <div id="speakBadge" class="hidden absolute -bottom-1 -right-1 bg-bubbleGreen text-white text-[10px] sm:text-xs px-1 py-0.5 rounded-full border border-white flex items-center gap-0.5 shadow">

                    <span class="w-1 h-1 bg-white rounded-full sound-wave" style="animation-delay:0.15s"></span>
                    <span class="w-1 h-1 bg-white rounded-full sound-wave" style="animation-delay:0.3s"></span>

            "RED": "🔴", "BLUE": "🔵", "GREEN": "🟢", "YELLOW": "🟡", "PURPLE": "🟣", "PINK": "🩷", "BLACK": "⚫", "WHITE": "⚪",
            "ORANGE": "🟠", "GOLD": "🪙", "SQUARE": "⏹️", "CIRCLE": "🟠"

        const SEMANTIC_CLUSTERS = [
            { keywords: ["CLOSE", "SHUT", "DOOR", "LOCK", "GATE"], emoji: "🚪" },
            { keywords: ["HAPPY", "SMILE", "JOY", "GLAD", "FUN"], emoji: "😀" },
            { keywords: ["SAD", "CRY", "TEARS", "UPSET"], emoji: "😢" },
            { keywords: ["HOT", "WARM", "HEAT", "SUNNY"], emoji: "☀️" },
            { keywords: ["COLD", "FREEZE", "ICE", "SNOW"], emoji: "❄️" },
            { keywords: ["LOVE", "LIKE", "CARE", "HEART"], emoji: "❤️" }
        ];

        function getEmojiMatch(word) {
            const cleanWord = word.trim().toUpperCase();
            if (!cleanWord) return null;

            if (PRIMARY_EMOJI_DICT[cleanWord]) return PRIMARY_EMOJI_DICT[cleanWord];

            let stem = cleanWord;
            if (stem.endsWith("ES")) stem = stem.slice(0, -2);
            else if (stem.endsWith("S") && stem.length > 3) stem = stem.slice(0, -1);
            else if (stem.endsWith("ING") && stem.length > 4) stem = stem.slice(0, -3);
            else if (stem.endsWith("ED") && stem.length > 3) stem = stem.slice(0, -2);

            if (PRIMARY_EMOJI_DICT[stem]) return PRIMARY_EMOJI_DICT[stem];

            for (const key in PRIMARY_EMOJI_DICT) {
                if (key.length >= 3 && (cleanWord.startsWith(key) || key.startsWith(cleanWord))) {
                    return PRIMARY_EMOJI_DICT[key];
                }
            }

            for (const cluster of SEMANTIC_CLUSTERS) {
                for (const kw of cluster.keywords) {
                    if (cleanWord.includes(kw) || kw.includes(cleanWord)) return cluster.emoji;
                }
            }

            return null;
        }

        let audioCtx = null;
        function playPopSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350 + Math.random() * 200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        function createBurst(e) {
            if (!e) return;
            const container = document.getElementById('particleCanvas');
            const rect = e.target.getBoundingClientRect();
            const x = e.clientX || (rect.left + rect.width / 2);
            const y = e.clientY || (rect.top + rect.height / 2);

            const colors = ['#FF70A6', '#FF9F1C', '#FFD166', '#06D6A0', '#118AB2', '#B5179E'];
            for (let i = 0; i < 6; i++) {
                const star = document.createElement('div');
                star.className = 'pop-star text-xl';
                star.innerHTML = ['★', '✦', '♥', '●'][Math.floor(Math.random() * 4)];
                star.style.color = colors[Math.floor(Math.random() * colors.length)];
                star.style.left = `${x}px`;
                star.style.top = `${y}px`;

                const angle = (Math.PI * 2 / 6) * i;
                const dist = 40 + Math.random() * 30;
                star.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
                star.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);

                container.appendChild(star);
                setTimeout(() => star.remove(), 600);
            }
        }

        // --- RULES-BASED PHONICS PARSER ENGINE ---
        const VOWELS = new Set(['A', 'E', 'I', 'O', 'U', 'Y']);

        function parseOnsetPhonetics(onset, nextChar) {
            const raw = onset.toLowerCase();
            const next = (nextChar || '').toLowerCase();

            if (!raw) return { onset: '', spoken: '' };

            // Silent Initial Consonants
            if (raw === 'kn') return { onset: 'kn', spoken: 'nar' };
            if (raw === 'wr') return { onset: 'wr', spoken: 'rar' };
            if (raw === 'gn') return { onset: 'gn', spoken: 'nar' };

            // Consonant Digraphs
            if (raw === 'sh') return { onset: 'sh', spoken: 'shar' };
            if (raw === 'ch') return { onset: 'ch', spoken: 'char' };
            if (raw === 'th') return { onset: 'th', spoken: 'thar' };
            if (raw === 'wh') return { onset: 'wh', spoken: 'war' };
            if (raw === 'ph') return { onset: 'ph', spoken: 'far' };

            // Soft vs Hard C & G
            if (raw === 'c') {
                if (['e', 'i', 'y'].includes(next)) return { onset: 'c', spoken: 'sar' };
                return { onset: 'c', spoken: 'kar' };
            }
            if (raw === 'g') {
                if (['e', 'i', 'y'].includes(next)) return { onset: 'g', spoken: 'jar' };
                return { onset: 'g', spoken: 'gar' };
            }

            if (raw.endsWith('ar')) return { onset: raw, spoken: raw };
            if (raw.endsWith('e')) return { onset: raw, spoken: raw.slice(0, -1) + 'ar' };
            return { onset: raw, spoken: raw + 'ar' };
        }

        function getIpaPhoneticAnalysis(word) {
            const uppercaseWord = word.trim().toUpperCase();
            if (!uppercaseWord) return [];

            if (uppercaseWord === 'MOTHER') {
                return [
                    { text: 'm', onset: 'm', rime: 'o', onsetArSpoken: 'mar', rimeSpoken: 'muh', combinedSpoken: 'moth' },
                    { text: 'ther', onset: 'th', rime: 'er', onsetArSpoken: 'thar', rimeSpoken: 'er', combinedSpoken: 'ther' }
                ];
            }
            if (uppercaseWord === 'FATHER') {
                return [
                    { text: 'fa', onset: 'f', rime: 'a', onsetArSpoken: 'far', rimeSpoken: 'ah', combinedSpoken: 'fa' },
                    { text: 'ther', onset: 'th', rime: 'er', onsetArSpoken: 'thar', rimeSpoken: 'er', combinedSpoken: 'ther' }
                ];
            }
            if (uppercaseWord === 'BROTHER') {
                return [
                    { text: 'bro', onset: 'br', rime: 'o', onsetArSpoken: 'brar', rimeSpoken: 'bruh', combinedSpoken: 'broth' },
                    { text: 'ther', onset: 'th', rime: 'er', onsetArSpoken: 'thar', rimeSpoken: 'er', combinedSpoken: 'ther' }
                ];
            }

            // 1. Single-Syllable -SE / -RSE / -LSE Endings (e.g., HOUSE -> h-ouse, HORSE -> h-orse)
            const seMatch = uppercaseWord.match(/^([^AEIOUY]+)([AEIOUY]+(?:R|L)?SE)$/i);
            if (seMatch) {
                const onset = seMatch[1].toLowerCase();
                const rime = seMatch[2].toLowerCase();
                const onsetData = parseOnsetPhonetics(onset, rime[0]);
                return [{
                    text: uppercaseWord.toLowerCase(),
                    onset: onset,
                    rime: rime,
                    onsetArSpoken: onsetData.spoken,
                    rimeSpoken: rime,
                    combinedSpoken: uppercaseWord.toLowerCase()
                }];
            }

            // 2. Productive Suffixes (JOYFUL -> joy-f-ul, GRACEFUL -> gr-ace-f-ul)
            const suffixMatch = uppercaseWord.match(/^(.+?)(FUL|LESS|NESS|MENT)$/i);
            if (suffixMatch) {
                const root = suffixMatch[1].toLowerCase();
                const suffix = suffixMatch[2].toLowerCase();

                let rootOnset = '', rootRime = root;
                const vIdx = root.search(/[aeiouy]/i);

                if (vIdx === 0) {
                    rootOnset = '';
                    rootRime = root;
                } else if (vIdx > 0) {
                    rootOnset = root.slice(0, vIdx);
                    rootRime = root.slice(vIdx);
                }

                const onsetDataRoot = parseOnsetPhonetics(rootOnset, rootRime ? rootRime[0] : '');

                let sufOnset = '', sufRime = suffix;
                const sufVIdx = suffix.search(/[aeiouy]/i);
                if (sufVIdx > 0) {
                    sufOnset = suffix.slice(0, sufVIdx);
                    sufRime = suffix.slice(sufVIdx);
                }
                const onsetDataSuf = parseOnsetPhonetics(sufOnset, sufRime ? sufRime[0] : '');

                return [
                    {
                        text: root,
                        onset: rootOnset,
                        rime: rootRime,
                        onsetArSpoken: onsetDataRoot.spoken,
                        rimeSpoken: rootRime,
                        combinedSpoken: root
                    },
                    {
                        text: suffix,
                        onset: sufOnset,
                        rime: sufRime,
                        onsetArSpoken: onsetDataSuf.spoken,
                        rimeSpoken: sufRime,
                        combinedSpoken: suffix
                    }
                ];
            }

            // 3. -URE Suffix + Medial Consonant Split (PICTURE -> p-ic-t-ure)
            const ureMatch = uppercaseWord.match(/^([^AEIOUY]+)([AEIOUY][^AEIOUY])([^AEIOUY])URE$/i);
            if (ureMatch) {
                const initOnset = ureMatch[1].toLowerCase();
                const initRime = ureMatch[2].toLowerCase();
                const medialC = ureMatch[3].toLowerCase();

                const onsetData1 = parseOnsetPhonetics(initOnset, initRime[0]);
                const onsetData2 = parseOnsetPhonetics(medialC, 'u');

                return [
                    {
                        text: initOnset + initRime,
                        onset: initOnset,
                        rime: initRime,
                        onsetArSpoken: onsetData1.spoken,
                        rimeSpoken: initRime,
                        combinedSpoken: initOnset + initRime
                    },
                    {
                        text: medialC + 'ure',
                        onset: medialC,
                        rime: 'ure',
                        onsetArSpoken: onsetData2.spoken,
                        rimeSpoken: 'ure',
                        combinedSpoken: medialC + 'ure'
                    }
                ];
            }

            // 4. Medial Consonant Blend Syllable Split (PROBLEM -> pr-o-bl-em, COMPLETE -> c-om-pl-ete, COMPRESS -> c-om-pr-ess)
            const blendSplitMatch = uppercaseWord.match(/^([^AEIOUY]+)([AEIOUY][^AEIOUY]?)((?:BL|CL|FL|GL|PL|SL|BR|CR|DR|FR|GR|PR|TR)[AEIOUY].*)$/i);
            if (blendSplitMatch) {
                const part1Onset = blendSplitMatch[1].toLowerCase();
                const part1Rime = blendSplitMatch[2].toLowerCase();
                const part2Raw = blendSplitMatch[3].toLowerCase();

                const onsetData1 = parseOnsetPhonetics(part1Onset, part1Rime[0]);

                let part2Onset = '', part2Rime = part2Raw;
                const vIdx2 = part2Raw.search(/[aeiouy]/i);
                if (vIdx2 > 0) {
                    part2Onset = part2Raw.slice(0, vIdx2);
                    part2Rime = part2Raw.slice(vIdx2);
                }
                const onsetData2 = parseOnsetPhonetics(part2Onset, part2Rime[0]);

                return [
                    {
                        text: part1Onset + part1Rime,
                        onset: part1Onset,
                        rime: part1Rime,
                        onsetArSpoken: onsetData1.spoken,
                        rimeSpoken: part1Rime,
                        combinedSpoken: part1Onset + part1Rime
                    },
                    {
                        text: part2Raw,
                        onset: part2Onset,
                        rime: part2Rime,
                        onsetArSpoken: onsetData2.spoken,
                        rimeSpoken: part2Rime,
                        combinedSpoken: part2Raw
                    }
                ];
            }

            // 5. Nasal Coda Bridge Split (BLANKET -> bl-an-k-et)
            const blanketMatch = uppercaseWord.match(/^([^AEIOUY]+)([AEIOUY][NKMS])([^AEIOUY])([AEIOUY].*)$/i);
            if (blanketMatch) {
                const initOnset = blanketMatch[1].toLowerCase();
                const initRime = blanketMatch[2].toLowerCase();
                const bridgeC = blanketMatch[3].toLowerCase();
                const tailRime = blanketMatch[4].toLowerCase();

                const onsetData1 = parseOnsetPhonetics(initOnset, initRime[0]);
                const onsetData2 = parseOnsetPhonetics(bridgeC, tailRime[0]);

                return [
                    {
                        text: initOnset + initRime,
                        onset: initOnset,
                        rime: initRime,
                        onsetArSpoken: onsetData1.spoken,
                        rimeSpoken: initRime,
                        combinedSpoken: initOnset + initRime
                    },
                    {
                        text: bridgeC + tailRime,
                        onset: bridgeC,
                        rime: tailRime,
                        onsetArSpoken: onsetData2.spoken,
                        rimeSpoken: tailRime,
                        combinedSpoken: bridgeC + tailRime
                    }
                ];
            }

            // 6. Generalized -LY Morphological Split (LOVELY -> l-ove-l-y)
            if (uppercaseWord.endsWith('LY') && uppercaseWord.length > 3) {
                const stem = uppercaseWord.slice(0, -2).toLowerCase();
                let stemOnset = '', stemRime = stem;
                const vIdx = stem.search(/[aeiouy]/i);
                if (vIdx > 0) {
                    stemOnset = stem.slice(0, vIdx);
                    stemRime = stem.slice(vIdx);
                }
                const onsetData1 = parseOnsetPhonetics(stemOnset, stemRime[0]);
                const onsetData2 = parseOnsetPhonetics('l', 'y');

                return [
                    {
                        text: stem,
                        onset: stemOnset,
                        rime: stemRime,
                        onsetArSpoken: onsetData1.spoken,
                        rimeSpoken: stemRime,
                        combinedSpoken: stem
                    },
                    {
                        text: 'ly',
                        onset: 'l',
                        rime: 'y',
                        onsetArSpoken: onsetData2.spoken,
                        rimeSpoken: 'ee',
                        combinedSpoken: 'ly'
                    }
                ];
            }

            // 7. Consonant-le Rule (APPLE -> ap-ple, PURPLE -> pur-ple)
            const cleMatch = uppercaseWord.match(/^(.+?)([^AEIOUY])LE$/i);
            if (cleMatch && cleMatch[1].length > 0) {
                const prefixWord = cleMatch[1];
                const cleConsonant = cleMatch[2].toLowerCase();

                let firstPart = prefixWord.toLowerCase();
                let firstOnset = '';
                let firstRime = firstPart;

                const firstVowelIdx = firstPart.search(/[aeiouy]/i);
                if (firstVowelIdx > 0) {
                    firstOnset = firstPart.slice(0, firstVowelIdx);
                    firstRime = firstPart.slice(firstVowelIdx);
                }

                const onsetData = parseOnsetPhonetics(firstOnset, firstRime[0]);

                const prefixSyllable = {
                    text: firstPart,
                    onset: firstOnset,
                    rime: firstRime,
                    onsetArSpoken: onsetData.spoken,
                    rimeSpoken: firstRime,
                    combinedSpoken: firstPart
                };

                let cleOnsetAr = cleConsonant + 'ar';
                if (cleConsonant === 'c' || cleConsonant === 'k') cleOnsetAr = 'kar';
                if (cleConsonant === 'g') cleOnsetAr = 'gar';
                if (cleConsonant === 'p') cleOnsetAr = 'par';

                const cleSyllable = {
                    text: cleConsonant + 'le',
                    onset: cleConsonant,
                    rime: 'le',
                    onsetArSpoken: cleOnsetAr,
                    rimeSpoken: cleConsonant + 'ull',
                    combinedSpoken: cleConsonant + 'le'
                };

                return [prefixSyllable, cleSyllable];
            }

            // 8. Medial Digraph Detector ('th', 'sh', 'ch', 'ph', 'wh')
            const medialDigraphMatch = uppercaseWord.match(/^([^AEIOUY]*[AEIOUY]+)(TH|SH|CH|PH|WH)([AEIOUY].*)$/i);
            if (medialDigraphMatch) {
                const part1 = medialDigraphMatch[1].toLowerCase();
                const digraph = medialDigraphMatch[2].toLowerCase();
                const part2 = medialDigraphMatch[3].toLowerCase();

                let onset1 = '', rime1 = part1;
                const vIdx = part1.search(/[aeiouy]/i);
                if (vIdx > 0) {
                    onset1 = part1.slice(0, vIdx);
                    rime1 = part1.slice(vIdx);
                }
                const onsetData1 = parseOnsetPhonetics(onset1, rime1[0]);

                const syl1 = {
                    text: part1,
                    onset: onset1,
                    rime: rime1,
                    onsetArSpoken: onsetData1.spoken,
                    rimeSpoken: rime1,
                    combinedSpoken: part1
                };

                const onsetData2 = parseOnsetPhonetics(digraph, part2[0]);
                const syl2 = {
                    text: digraph + part2,
                    onset: digraph,
                    rime: part2,
                    onsetArSpoken: onsetData2.spoken,
                    rimeSpoken: part2,
                    combinedSpoken: digraph + part2
                };

                return [syl1, syl2];
            }

            // 9. Trailing 'Y' Sound
            if (uppercaseWord.endsWith('Y') && uppercaseWord.length > 1) {
                const body = uppercaseWord.slice(0, -1);
                if (!/[AEIOU]/.test(body) || body.length <= 2) {
                    const onsetData = parseOnsetPhonetics(body, 'y');
                    return [{
                        text: uppercaseWord.toLowerCase(),
                        onset: body.toLowerCase(),
                        rime: 'y',
                        onsetArSpoken: onsetData.spoken,
                        rimeSpoken: 'eye',
                        combinedSpoken: uppercaseWord.toLowerCase()
                    }];
                }
            }

            // 10. Magic 'E' Pattern
            const magicEMatch = uppercaseWord.match(/^([^AEIOUY]+)([AEIOUY])([^AEIOUY]+)E$/i);
            if (magicEMatch) {
                const onset = magicEMatch[1];
                const vowel = magicEMatch[2];
                const coda = magicEMatch[3];
                const rime = vowel + coda + 'e';

                const onsetData = parseOnsetPhonetics(onset, vowel);

                return [{
                    text: uppercaseWord.toLowerCase(),
                    onset: onset.toLowerCase(),
                    rime: rime.toLowerCase(),
                    onsetArSpoken: onsetData.spoken,
                    rimeSpoken: rime.toLowerCase(),
                    combinedSpoken: uppercaseWord.toLowerCase()
                }];
            }

            // 11. Dynamic Syllable Splitter
            const syls = uppercaseWord.match(/[^AEIOUY]*[AEIOUY]+(?:[^AEIOUY]*$|[^AEIOUY](?=[^AEIOUY][AEIOUY])|(?=[^AEIOUY][AEIOUY]))?/gi) || [uppercaseWord];

            return syls.map(syl => {
                let firstVowelIdx = -1;
                for (let i = 0; i < syl.length; i++) {
                    if (VOWELS.has(syl[i])) {
                        if (syl[i] === 'Y' && i === 0 && syl.length > 1) continue;
                        firstVowelIdx = i;
                        break;
                    }
                }

                let onset = '', rime = '';
                if (firstVowelIdx === -1) {
                    onset = syl;
                    rime = '';
                } else {
                    onset = syl.slice(0, firstVowelIdx);
                    rime = syl.slice(firstVowelIdx);
                }

                const onsetData = parseOnsetPhonetics(onset, rime ? rime[0] : '');

                return {
                    text: syl.toLowerCase(),
                    onset: onset.toLowerCase(),
                    rime: rime.toLowerCase(),
                    onsetArSpoken: onsetData.spoken,
                    rimeSpoken: rime.toLowerCase(),
                    combinedSpoken: syl.toLowerCase()
                };
            });
        }

        function updateDisplay() {
            if (!currentText.trim()) {
                wordDisplay.innerHTML = `<span class="text-indigo-200/80 font-bold text-xl sm:text-3xl animate-pulse">Type to Spell!</span>`;
                statusLabel.textContent = "Tap & Spell!";
                emojiDisplay.classList.add('hidden');
                emojiDisplay.innerHTML = '';
                return;
            }

            const rawWords = currentText.split(' ');
            let html = '';
            let matchedEmojis = [];

            rawWords.forEach((wordStr, wIdx) => {
                if (!wordStr) {
                    html += `<div class="w-3 sm:w-6"></div>`;
                    return;
                }

                const syllables = getIpaPhoneticAnalysis(wordStr);
                const emoji = getEmojiMatch(wordStr);
                if (emoji) matchedEmojis.push(emoji);

                html += `<div id="word-block-${wIdx}" class="word-block inline-flex items-center p-0.5 rounded-xl transition-all duration-200">`;

                syllables.forEach((syl, sIdx) => {
                    html += `<div class="inline-flex items-center">`;

                    if (syl.onset) {
                        html += `
                            <span id="part-${wIdx}-${sIdx}-onset" class="part-card text-bubblePink font-black px-0.5 sm:px-1 py-0.5 rounded-lg transition-all duration-200">
                                ${syl.onset}
                            </span>
                        `;
                    }

                    if (syl.rime) {
                        html += `
                            <span id="part-${wIdx}-${sIdx}-rime" class="part-card text-bubbleBlue font-black px-0.5 sm:px-1 py-0.5 rounded-lg transition-all duration-200">
                                ${syl.rime}
                            </span>
                        `;
                    }

                    html += `</div>`;
                });

                html += `</div>`;
            });

            wordDisplay.innerHTML = html;

            if (matchedEmojis.length > 0) {
                emojiDisplay.innerHTML = matchedEmojis.map(e => `<span>${e}</span>`).join('');
                emojiDisplay.classList.remove('hidden');
            } else {
                emojiDisplay.classList.add('hidden');
                emojiDisplay.innerHTML = '';
            }
        }

        function pressKey(char, e) {
            playPopSound();
            createBurst(e);
            stopSpeech();

            if (currentText.length < 32) {
                currentText += char;
                updateDisplay();
                resetTypingTimer();
            }
        }

        function pressSpace(e) {
            playPopSound();
            createBurst(e);
            stopSpeech();

            if (currentText.length > 0 && !currentText.endsWith(' ') && currentText.length < 32) {
                currentText += ' ';
                updateDisplay();
                resetTypingTimer();
            }
        }

        function backspace(e) {
            playPopSound();
            createBurst(e);
            stopSpeech();

            currentText = currentText.slice(0, -1);
            updateDisplay();
            if (currentText.length > 0) {
                resetTypingTimer();
            } else {
                statusLabel.textContent = "Tap & Spell!";
                emojiDisplay.classList.add('hidden');
                emojiDisplay.innerHTML = '';
            }
        }

        function clearWord() {
            stopSpeech();
            currentText = "";
            updateDisplay();
            statusLabel.textContent = "Tap & Spell!";
            emojiDisplay.classList.add('hidden');
            emojiDisplay.innerHTML = '';
        }

        function resetTypingTimer() {
            statusLabel.textContent = "Keep typing...";
            if (typingTimer) clearTimeout(typingTimer);

            typingTimer = setTimeout(() => {
                if (currentText.trim().length > 0) {
                    executePhonicsSpeech();
                }
            }, PAUSE_THRESHOLD);
        }

        function executePhonicsSpeech() {
            if (!('speechSynthesis' in window) || !currentText.trim()) return;

            stopSpeech();
            const rawWords = currentText.split(' ').filter(w => w.trim().length > 0);

            mascot.classList.add('mascot-pulse');
            speakBadge.classList.remove('hidden');

            rawWords.forEach((wordStr, wIdx) => {
                const syllables = getIpaPhoneticAnalysis(wordStr);

                syllables.forEach((syl, sIdx) => {
                    const hasOnset = syl.onset && syl.onset.trim() !== '';

                    // Step 1: Onset + "ar" (ONLY executed if an initial onset consonant exists)
                    if (hasOnset && syl.onsetArSpoken) {
                        const initUtt = new SpeechSynthesisUtterance(syl.onsetArSpoken);
                        initUtt.rate = 0.85;
                        initUtt.pitch = 1.25;

                        initUtt.onstart = () => {
                            highlightElement(`part-${wIdx}-${sIdx}-onset`);
                            statusLabel.textContent = `${syl.onset.toUpperCase()} ("${syl.onsetArSpoken}")`;
                        };

                        window.speechSynthesis.speak(initUtt);
                    }

                    // Step 2: Vowel / Rime sound (Only spoken individually if there was an onset to prevent repeating for vowel-starting words)
                    if (hasOnset && syl.rime && syl.rimeSpoken) {
                        const rimeUtt = new SpeechSynthesisUtterance(syl.rimeSpoken);
                        rimeUtt.rate = 0.85;
                        rimeUtt.pitch = 1.25;

                        rimeUtt.onstart = () => {
                            highlightElement(`part-${wIdx}-${sIdx}-rime`);
                            statusLabel.textContent = `${syl.rime.toUpperCase()} ("${syl.rimeSpoken}")`;
                        };

                        window.speechSynthesis.speak(rimeUtt);
                    }

                    // Step 3: Combined Syllable / Word Sound (Directly executed for vowel-starting words without sound repetition)
                    const groupUtt = new SpeechSynthesisUtterance(syl.combinedSpoken);
                    groupUtt.rate = 0.8;
                    groupUtt.pitch = 1.2;

                    groupUtt.onstart = () => {
                        highlightSyllableGroup(wIdx, sIdx);
                        statusLabel.textContent = `${syl.text.toUpperCase()}`;
                    };

                    window.speechSynthesis.speak(groupUtt);
                });

                // Syllable/Word Complete Pronunciation
                const wordUtt = new SpeechSynthesisUtterance(wordStr.toLowerCase());
                wordUtt.rate = 0.75;
                wordUtt.pitch = 1.2;

                wordUtt.onstart = () => {
                    highlightWordBlock(wIdx);
                    statusLabel.textContent = `${wordStr.toUpperCase()}! 🎉`;
                };

                if (wIdx === rawWords.length - 1) {
                    wordUtt.onend = () => {
                        resetHighlights();
                        mascot.classList.remove('mascot-pulse');
                        speakBadge.classList.add('hidden');
                        statusLabel.textContent = "Great job!";
                    };
                }

                window.speechSynthesis.speak(wordUtt);
            });
        }

        function highlightSyllableGroup(wIdx, sIdx) {
            resetHighlights();
            const initEl = document.getElementById(`part-${wIdx}-${sIdx}-onset`);
            const rimeEl = document.getElementById(`part-${wIdx}-${sIdx}-rime`);
            if (initEl) initEl.classList.add('phoneme-active', 'bg-yellow-200');
            if (rimeEl) rimeEl.classList.add('phoneme-active', 'bg-yellow-200');
        }

        function highlightWordBlock(wIdx) {
            resetHighlights();
            const block = document.getElementById(`word-block-${wIdx}`);
            if (block) {
                block.querySelectorAll('.part-card').forEach(el => {
                    el.classList.add('phoneme-active', 'bg-yellow-200');
                });
            }
        }

        function repeatSpeech() {
            if (currentText.trim()) {
                executePhonicsSpeech();
            }
        }

        function highlightElement(id) {
            resetHighlights();
            const el = document.getElementById(id);
            if (el) {
                el.classList.add('phoneme-active', 'bg-yellow-200');
            }
        }

        function resetHighlights() {
            document.querySelectorAll('.part-card').forEach(el => {
                el.classList.remove('phoneme-active', 'bg-yellow-200');
            });
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            if (typingTimer) clearTimeout(typingTimer);
            mascot.classList.remove('mascot-pulse');
            speakBadge.classList.add('hidden');
            resetHighlights();
        }

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.altKey || e.metaKey) return;

            if (e.key === 'Backspace') {
                backspace(null);
            } else if (e.key === 'Escape') {
                clearWord();
            } else if (e.key === ' ') {
                e.preventDefault();
                pressSpace(null);
            } else if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {
                pressKey(e.key.toUpperCase(), null);
            }
        });

        updateDisplay();
    </script>
</body>
</html>
