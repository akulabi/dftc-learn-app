<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文筆順習字簿</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Hanzi Writer CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

    <!-- 字體與圖標 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #f7f3e8;
            background-image: radial-gradient(#e5dcc7 1px, transparent 1px);
            background-size: 20px 20px;
            color: #2c2416;
        }

        /* 隱藏原生滾動條以維護習字簿美觀 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type=range] {
            accent-color: #991b1b;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between select-none overflow-hidden p-0 m-0 border-box">

    <!-- 頂部：極簡單一文字輸入框 (固定高度，防壓迫) -->
    <header class="w-full py-3 px-6 flex justify-center z-50 shrink-0 bg-[#f7f3e8]">
        <div class="w-full max-w-xl">
            <input 
                type="text" 
                id="textInput" 
                oninput="onInputTextChange(this.value)"
                placeholder="請輸入文字..." 
                value="中文筆順練習"
                class="w-full px-5 py-2 rounded-full border-2 border-red-900/30 bg-[#faf7f0]/90 focus:bg-[#faf7f0] focus:border-red-800 text-stone-900 placeholder-stone-400 outline-none transition text-lg font-serif shadow-sm text-center tracking-widest"
            />
        </div>
    </header>

    <!-- 主要內容區 (直向滾動 每行 2 個字格習字簿) -->
    <main class="flex-1 w-full px-4 py-2 flex items-center justify-center overflow-hidden min-h-0 shrink">
        
        <!-- 淺黃宣紙外框視窗 (支援垂直滾動) -->
        <div 
            id="viewportBox" 
            class="relative bg-[#fbf8f1] border-4 border-amber-900/30 rounded-3xl p-4 shadow-2xl overflow-y-auto no-scrollbar scroll-smooth h-full max-h-full border-t-2 border-l-2 border-red-800/60 shadow-inner flex justify-center"
        >
            <!-- 每行固定 2 個字格 (2 Column Grid) -->
            <div 
                id="characterGrid" 
                class="grid grid-cols-2 gap-0 justify-items-center items-center max-w-[320px] border-r-2 border-b-2 border-red-800/60 h-fit"
            >
                <!-- 動態生成字格 (米字格 Canvas 背景 + HanziWriter SVG) -->
            </div>

        </div>
    </main>

    <!-- 底部極簡播放控制條 (固定底部，防擠壓) -->
    <footer class="w-full bg-[#ede5d3] border-t-2 border-amber-900/30 shadow-2xl px-6 py-3 z-50 shrink-0">
        <div class="max-w-3xl mx-auto flex items-center justify-between gap-4">
            
            <!-- 播放 / 暫停 -->
            <button id="btnGlobalPlay" onclick="togglePlayPause()" class="px-5 py-2 rounded-full bg-red-900 hover:bg-red-800 text-amber-50 font-medium text-sm shadow-md transition flex items-center gap-2 justify-center shrink-0">
                <i id="playIcon" class="fa-solid fa-play"></i>
                <span id="playText">播放</span>
            </button>

            <!-- 時間軸 Slider -->
            <div class="relative flex-1 flex items-center">
                <input type="range" id="globalTimeline" min="0" max="100" value="0" step="0.1" oninput="onTimelineScrub(this.value)" class="w-full h-2.5 bg-stone-300 rounded-lg appearance-none cursor-pointer">
            </div>

            <!-- 筆劃速度控制 -->
            <div class="flex items-center shrink-0">
                <select id="speedSelect" onchange="changeSpeed(this.value)" class="bg-stone-200/80 border border-stone-300 text-stone-800 text-xs rounded-lg px-3 py-2 outline-none font-mono font-medium shadow-sm">
                    <option value="0.5">0.5x</option>
                    <option value="1" selected>1.0x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2.0x</option>
                </select>
            </div>

        </div>
    </footer>

    <!-- 邏輯與動畫控制腳本 -->
    <script>
        let charactersData = [];
        const STROKE_COLOR = '#000000'; // 純黑墨跡
        const GRID_SIZE = 150;           // 每字格 150px * 150px
        
        let playbackSpeed = 1.0;
        let isPlaying = false;
        let activeCharIndex = 0;
        let isCancelled = false;
        let inputDebounceTimer = null;

        function isChineseChar(ch) {
            return /^[\u4e00-\u9fa5]$/.test(ch);
        }

        window.onload = function() {
            const initialText = document.getElementById('textInput').value;
            parseAndLoadParagraph(initialText);
        };

        function onInputTextChange(val) {
            clearTimeout(inputDebounceTimer);
            inputDebounceTimer = setTimeout(() => {
                parseAndLoadParagraph(val);
            }, 300);
        }

        /* 繪製傳統淺黃米字格 Canvas 背景 */
        function drawMizigeCanvas(canvas) {
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = GRID_SIZE * dpr;
            canvas.height = GRID_SIZE * dpr;
            ctx.scale(dpr, dpr);

            // 宣紙黃底
            ctx.fillStyle = '#faf7f0';
            ctx.fillRect(0, 0, GRID_SIZE, GRID_SIZE);

            // 筆畫邊框與虛線米字格
            ctx.strokeStyle = 'rgba(185, 28, 28, 0.35)';
            ctx.lineWidth = 1;

            // 對角虛線
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(GRID_SIZE, GRID_SIZE);
            ctx.moveTo(GRID_SIZE, 0);
            ctx.lineTo(0, GRID_SIZE);
            ctx.stroke();

            // 十字實線/細線
            ctx.strokeStyle = 'rgba(185, 28, 28, 0.5)';
            ctx.setLineDash([6, 3]);
            ctx.beginPath();
            ctx.moveTo(GRID_SIZE / 2, 0);
            ctx.lineTo(GRID_SIZE / 2, GRID_SIZE);
            ctx.moveTo(0, GRID_SIZE / 2);
            ctx.lineTo(GRID_SIZE, GRID_SIZE / 2);
            ctx.stroke();

            // 左與上邊界實線 (組成米字格網格)
            ctx.setLineDash([]);
            ctx.strokeStyle = 'rgba(185, 28, 28, 0.6)';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, GRID_SIZE, GRID_SIZE);
        }

        // 自訂字形資料載入器：優先使用 HK 筆順資料集，失敗時自動備援至 CDN
        function customCharDataLoader(char, onComplete, onError) {
            const encodedChar = encodeURIComponent(char);
            const hkUrl = `/hanzi-writer-data-hk/data/${encodedChar}.json`;
            const cdnUrl = `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encodedChar}.json`;

            fetch(hkUrl)
                .then(res => {
                    if (res.ok) return res.json();
                    throw new Error('HK data not found');
                })
                .then(data => onComplete(data))
                .catch(() => {
                    // HK 資料庫獲取失敗，降級使用標準 CDN
                    fetch(cdnUrl)
                        .then(res => {
                            if (res.ok) return res.json();
                            throw new Error('CDN data not found');
                        })
                        .then(data => onComplete(data))
                        .catch(err => onError(err));
                });
        }

        function createHanziWriterInstance(targetId, charStr) {
            const targetEl = document.getElementById(targetId);
            if (targetEl) targetEl.innerHTML = '';
            
            const baseSpeed = 1.0;
            const computedSpeed = baseSpeed * playbackSpeed;
            const computedDelay = 200 / playbackSpeed;

            return HanziWriter.create(targetId, charStr, {
                width: GRID_SIZE - 10,
                height: GRID_SIZE - 10,
                padding: 5,
                showOutline: true,
                strokeColor: STROKE_COLOR,
                outlineColor: '#dcd3c1',
                strokeAnimationSpeed: computedSpeed,
                delayBetweenStrokes: computedDelay,
                charDataLoader: customCharDataLoader
            });
        }

        function parseAndLoadParagraph(text) {
            stopPlayback();

            const gridContainer = document.getElementById('characterGrid');
            gridContainer.innerHTML = '';
            charactersData = [];

            if (!text) return;

            const chars = Array.from(text).filter(c => c.trim() !== '');
            if (chars.length === 0) return;

            chars.forEach((ch, index) => {
                const isHanzi = isChineseChar(ch);

                // 單個字格卡片 (150px * 150px)
                const cardDiv = document.createElement('div');
                cardDiv.className = `relative flex items-center justify-center m-0 p-0 cursor-pointer select-none box-border shrink-0`;
                cardDiv.style.width = `${GRID_SIZE}px`;
                cardDiv.style.height = `${GRID_SIZE}px`;
                cardDiv.id = `charCard-${index}`;
                cardDiv.onclick = () => onCharCardClick(index);

                // 1. 底層 Canvas 米字格
                const bgCanvas = document.createElement('canvas');
                bgCanvas.className = 'absolute inset-0 pointer-events-none';
                bgCanvas.style.width = `${GRID_SIZE}px`;
                bgCanvas.style.height = `${GRID_SIZE}px`;
                drawMizigeCanvas(bgCanvas);
                cardDiv.appendChild(bgCanvas);

                // 2. 上層 HanziWriter SVG 容器
                const writerDiv = document.createElement('div');
                writerDiv.id = `target-${index}`;
                writerDiv.className = `relative z-10 w-full h-full flex items-center justify-center`;
                cardDiv.appendChild(writerDiv);

                gridContainer.appendChild(cardDiv);

                const item = {
                    char: ch,
                    isChinese: isHanzi,
                    writer: null,
                    targetId: `target-${index}`
                };
                charactersData.push(item);

                if (isHanzi) {
                    try {
                        item.writer = createHanziWriterInstance(item.targetId, ch);
                    } catch (err) {
                        console.error(err);
                    }
                } else {
                    writerDiv.innerHTML = `<span class="text-6xl text-black font-serif leading-none">${ch}</span>`;
                }
            });

            updateGlobalTimelineUI(0);
            if (charactersData.length > 0) focusCharacter(0);
        }

        // 點擊字格：跳轉至該字、居中並播放
        function onCharCardClick(index) {
            pausePlayback();
            focusCharacter(index);
            
            const item = charactersData[index];
            if (item && item.isChinese && item.writer) {
                item.writer.animateCharacter();
            }
        }

        // 當前字自動平滑垂直滾動至中間視角
        function focusCharacter(index) {
            if (index < 0 || index >= charactersData.length) return;
            activeCharIndex = index;

            charactersData.forEach((_, i) => {
                const card = document.getElementById(`charCard-${i}`);
                if (card) {
                    if (i === index) {
                        card.classList.add('ring-4', 'ring-red-800', 'ring-inset', 'z-20');
                        card.scrollIntoView({
                            behavior: 'smooth',
                            block: 'center',
                            inline: 'nearest'
                        });
                    } else {
                        card.classList.remove('ring-4', 'ring-red-800', 'ring-inset', 'z-20');
                    }
                }
            });

            updateGlobalTimelineUI(index);
        }

        function togglePlayPause() {
            if (isPlaying) {
                pausePlayback();
            } else {
                startPlayback();
            }
        }

        async function startPlayback() {
            if (charactersData.length === 0) return;
            isPlaying = true;
            isCancelled = false;
            updatePlayButtonUI();

            if (activeCharIndex >= charactersData.length - 1) {
                activeCharIndex = 0;
            }

            for (let i = activeCharIndex; i < charactersData.length; i++) {
                if (!isPlaying || isCancelled) break;

                activeCharIndex = i;
                focusCharacter(i);

                const item = charactersData[i];
                if (item.isChinese && item.writer) {
                    await animateWriterPromise(item.writer);
                } else {
                    await new Promise(r => setTimeout(r, 300 / playbackSpeed));
                }
            }

            if (!isCancelled && activeCharIndex >= charactersData.length - 1) {
                isPlaying = false;
                updatePlayButtonUI();
            }
        }

        function animateWriterPromise(writer) {
            return new Promise((resolve) => {
                if (isCancelled || !isPlaying) {
                    resolve();
                    return;
                }
                writer.animateCharacter({
                    onComplete: () => resolve()
                });
            });
        }

        function pausePlayback() {
            isPlaying = false;
            isCancelled = true;
            updatePlayButtonUI();
        }

        function stopPlayback() {
            isPlaying = false;
            isCancelled = true;
            activeCharIndex = 0;
            updatePlayButtonUI();
        }

        function onTimelineScrub(val) {
            if (charactersData.length === 0) return;
            const targetIndex = Math.min(
                Math.floor((val / 100) * charactersData.length),
                charactersData.length - 1
            );

            activeCharIndex = targetIndex;
            focusCharacter(targetIndex);

            charactersData.forEach((item, idx) => {
                if (item.writer) {
                    if (idx < targetIndex) {
                        item.writer.showCharacter();
                    } else if (idx > targetIndex) {
                        item.writer.hideCharacter();
                    }
                }
            });

            updateGlobalTimelineUI(targetIndex, false);
        }

        function updateGlobalTimelineUI(index, updateSlider = true) {
            if (charactersData.length === 0) return;

            if (updateSlider) {
                document.getElementById('globalTimeline').value = ((index) / (charactersData.length - 1 || 1)) * 100;
            }
        }

        function updatePlayButtonUI() {
            const playIcon = document.getElementById('playIcon');
            const playText = document.getElementById('playText');

            if (isPlaying) {
                playIcon.className = 'fa-solid fa-pause';
                playText.innerText = '暫停';
            } else {
                playIcon.className = 'fa-solid fa-play';
                playText.innerText = '播放';
            }
        }

        function changeSpeed(val) {
            playbackSpeed = parseFloat(val);
            
            // 動態更新 HanziWriter 實體參數，不中斷目前動畫
            const computedSpeed = 1.0 * playbackSpeed;
            const computedDelay = 200 / playbackSpeed;

            charactersData.forEach((item) => {
                if (item.isChinese && item.writer) {
                    item.writer.updateOptions({
                        strokeAnimationSpeed: computedSpeed,
                        delayBetweenStrokes: computedDelay
                    });
                }
            });
        }
    </script>
</body>
</html>
