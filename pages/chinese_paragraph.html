<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中文筆順習字簿</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HanziWriter CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        /* 自訂米紙容器滾動條 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(184, 115, 51, 0.05);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(184, 115, 51, 0.25);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(184, 115, 51, 0.4);
        }
        
        /* 平滑滾動 */
        .scroll-smooth-vertical {
            scroll-behavior: smooth;
        }

        /* 防止行動端動態下拉橡皮筋效果 */
        body {
            overscroll-behavior-y: none;
        }
    </style>
</head>
<body class="bg-[#f4efe6] h-[100dvh] w-screen flex flex-col font-sans text-stone-800 antialiased overflow-hidden select-none">

    <!-- 頂部輸入列 (固定高度) -->
    <header class="shrink-0 pt-4 pb-2 px-4 flex justify-center z-20">
        <div class="w-full max-w-[340px] relative">
            <input 
                type="text" 
                id="textInput" 
                value="中文筆順練習" 
                placeholder="請輸入文字..."
                class="w-full text-center text-lg font-serif bg-[#faf6ee] border-2 border-[#b87333]/30 rounded-full px-5 py-2 text-stone-800 focus:outline-none focus:border-[#b87333] shadow-sm tracking-widest transition-all"
            />
        </div>
    </header>

    <!-- 主視圖區域：可滾動的宣紙字格網格 -->
    <main class="flex-1 min-h-0 w-full flex justify-center px-4 overflow-hidden relative">
        <div 
            id="viewportBox" 
            class="w-full max-w-[340px] h-full overflow-y-auto custom-scrollbar scroll-smooth-vertical pb-28 pt-2"
        >
            <!-- 宣紙卡片背景 -->
            <div class="bg-[#faf6ee] border-2 border-[#b87333]/40 rounded-2xl p-4 shadow-md relative min-h-full">
                <!-- 雙欄排列網格容器 -->
                <div id="characterGrid" class="grid grid-cols-2 gap-3 justify-items-center w-full">
                    <!-- 動態渲染每個漢字的米字格 -->
                </div>
            </div>
        </div>
    </main>

    <!-- 底部固定浮動播放控制條 -->
    <footer class="fixed bottom-0 left-0 right-0 bg-[#ebdcc9]/95 backdrop-blur-md border-t border-[#b87333]/30 px-4 py-3 z-50 flex justify-center shadow-lg">
        <div class="w-full max-w-[340px] flex items-center justify-between gap-3">
            
            <!-- 播放 / 暫停 按鈕 -->
            <button 
                id="playPauseBtn" 
                class="w-10 h-10 shrink-0 flex items-center justify-center bg-[#b87333] text-white rounded-full shadow hover:bg-[#a06228] active:scale-95 transition-all focus:outline-none"
                title="播放 / 暫停"
            >
                <svg id="playIcon" class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="pauseIcon" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <!-- 時間軸極簡進度調控條 -->
            <div class="flex-1 flex items-center px-1">
                <input 
                    type="range" 
                    id="timelineSlider" 
                    min="0" 
                    max="100" 
                    value="0" 
                    step="0.1"
                    class="w-full h-2 bg-[#d8c3a5] rounded-lg appearance-none cursor-pointer accent-[#b87333] focus:outline-none"
                />
            </div>

            <!-- 速度切換選單 -->
            <div class="shrink-0 relative">
                <select 
                    id="speedSelect" 
                    class="bg-[#faf6ee] text-xs font-semibold text-stone-700 border border-[#b87333]/40 rounded-lg px-2 py-2 focus:outline-none focus:border-[#b87333] cursor-pointer shadow-sm"
                >
                    <option value="0.5">0.5x</option>
                    <option value="1.0" selected>1.0x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2.0">2.0x</option>
                </select>
            </div>

        </div>
    </footer>

    <script>
        // 全局狀態管理
        let currentText = "中文筆順練習";
        let writers = [];
        let activeCharIndex = 0;
        let isPlaying = false;
        let speedMultiplier = 1.0;
        const GRID_SIZE = 130; // 單個字格的尺寸 (px)

        // 自訂數據加載器：優先讀取香港本地數據庫，失敗時自動退回 CDN
        function customCharDataLoader(char, onComplete, onError) {
            const hkPath = `/hanzi-writer-data-hk/data/${char}.json`;
            fetch(hkPath)
                .then(response => {
                    if (!response.ok) throw new Error('HK Data file not found');
                    return response.json();
                })
                .then(data => onComplete(data))
                .catch(err => {
                    const cdnUrl = `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${char}.json`;
                    fetch(cdnUrl)
                        .then(res => {
                            if (!res.ok) throw new Error('CDN Data fetch failed');
                            return res.json();
                        })
                        .then(data => onComplete(data))
                        .catch(e => onError(e));
                });
        }

        // 使用 HTML5 Canvas 動態繪製經典紅線米字格
        function drawRiceGrid(canvas) {
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const size = GRID_SIZE;

            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            ctx.scale(dpr, dpr);

            // 米紙背景色填充
            ctx.fillStyle = '#faf6ee';
            ctx.fillRect(0, 0, size, size);

            // 外邊框
            ctx.strokeStyle = '#d4bda5';
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, size - 2, size - 2);

            // 內輔助線（紅虛線米字格）
            ctx.strokeStyle = '#e8c4c4';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);

            // 中軸與對角線
            ctx.beginPath();
            ctx.moveTo(0, size / 2); ctx.lineTo(size, size / 2);
            ctx.moveTo(size / 2, 0); ctx.lineTo(size / 2, size);
            ctx.moveTo(0, 0); ctx.lineTo(size, size);
            ctx.moveTo(size, 0); ctx.lineTo(0, size);
            ctx.stroke();
        }

        // 清理所有舊的 HanziWriter 實體（確保記憶體與 DOM 完全卸載）
        function clearWriters() {
            writers.forEach(w => {
                if (w && typeof w.destroy === 'function') {
                    try { w.destroy(); } catch (e) {}
                }
            });
            writers = [];
        }

        // 重新構建整段文字的筆順習字簿網格
        function initGrid() {
            stopAnimation();
            clearWriters();

            const gridContainer = document.getElementById('characterGrid');
            gridContainer.innerHTML = '';
            activeCharIndex = 0;
            document.getElementById('timelineSlider').value = 0;

            const chars = Array.from(currentText).filter(c => c.trim() !== '');

            chars.forEach((char, index) => {
                // 卡片包裝容器
                const itemEl = document.createElement('div');
                itemEl.id = `char-item-${index}`;
                itemEl.className = `relative cursor-pointer transition-all rounded-xl p-1 flex flex-col items-center justify-center border-2 ${index === 0 ? 'border-[#b87333] shadow-md bg-amber-50/50' : 'border-transparent hover:border-[#b87333]/30'}`;
                itemEl.style.width = `${GRID_SIZE + 10}px`;
                itemEl.style.height = `${GRID_SIZE + 10}px`;
                
                // Canvas 背景層 (米字格)
                const canvas = document.createElement('canvas');
                canvas.className = "rounded-lg shadow-inner";
                drawRiceGrid(canvas);
                itemEl.appendChild(canvas);

                // HanziWriter 浮動覆蓋層
                const writerDiv = document.createElement('div');
                writerDiv.className = "absolute inset-0 flex items-center justify-center";
                itemEl.appendChild(writerDiv);

                gridContainer.appendChild(itemEl);

                // 單字點擊互動
                itemEl.addEventListener('click', () => {
                    focusCharacter(index);
                    playSingleCharacter(index);
                });

                // 實例化 HanziWriter
                const writer = HanziWriter.create(writerDiv, char, {
                    width: GRID_SIZE - 10,
                    height: GRID_SIZE - 10,
                    padding: 5,
                    strokeColor: '#000000',
                    radicalColor: null,
                    showOutline: true,
                    outlineColor: '#e0d5c1',
                    strokeAnimationSpeed: 1.0 * speedMultiplier,
                    delayBetweenStrokes: 150 / speedMultiplier,
                    charDataLoader: customCharDataLoader
                });

                writers.push(writer);
            });

            if (chars.length > 0) {
                focusCharacter(0);
            }
        }

        // 高亮目標字格並實現垂直平滑置中捲動
        function focusCharacter(index) {
            if (index < 0 || index >= writers.length) return;
            
            document.querySelectorAll('#characterGrid > div').forEach((el, i) => {
                if (i === index) {
                    el.classList.add('border-[#b87333]', 'shadow-md', 'bg-amber-50/50');
                    el.classList.remove('border-transparent');
                } else {
                    el.classList.remove('border-[#b87333]', 'shadow-md', 'bg-amber-50/50');
                    el.classList.add('border-transparent');
                }
            });

            activeCharIndex = index;

            const activeEl = document.getElementById(`char-item-${index}`);
            if (activeEl) {
                activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 播放單個漢字筆順
        function playSingleCharacter(index) {
            stopAnimation();
            isPlaying = true;
            updatePlayPauseIcon();
            
            writers[index].animateCharacter({
                onComplete: () => {
                    isPlaying = false;
                    updatePlayPauseIcon();
                }
            });
        }

        // 全段落連續播放動畫循環 (自動移至下一個字並置中)
        function startGlobalPlayback() {
            if (writers.length === 0) return;
            isPlaying = true;
            updatePlayPauseIcon();

            function playNext(index) {
                if (!isPlaying) return;
                if (index >= writers.length) {
                    isPlaying = false;
                    updatePlayPauseIcon();
                    return;
                }

                focusCharacter(index);
                writers[index].animateCharacter({
                    onComplete: () => {
                        if (isPlaying) {
                            playNext(index + 1);
                        }
                    }
                });
            }

            playNext(activeCharIndex);
        }

        // 停止當前動畫
        function stopAnimation() {
            isPlaying = false;
            updatePlayPauseIcon();
            writers.forEach(w => w.cancelAnimation());
        }

        // 切換 UI 播放與暫停圖示
        function updatePlayPauseIcon() {
            const playIcon = document.getElementById('playIcon');
            const pauseIcon = document.getElementById('pauseIcon');
            if (isPlaying) {
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        }

        // 即時無縫切換播放倍速
        function applySpeedChange(newSpeed) {
            speedMultiplier = parseFloat(newSpeed);
            writers.forEach(writer => {
                writer.updateOptions({
                    strokeAnimationSpeed: 1.0 * speedMultiplier,
                    delayBetweenStrokes: 150 / speedMultiplier
                });
            });
        }

        // 輸入框文字即時同步反應 (直接觸發更新)
        document.getElementById('textInput').addEventListener('input', (e) => {
            currentText = e.target.value;
            initGrid();
        });

        // 控制按鈕與下拉選單監聽器
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            if (isPlaying) {
                stopAnimation();
            } else {
                if (activeCharIndex >= writers.length - 1) {
                    activeCharIndex = 0;
                }
                startGlobalPlayback();
            }
        });

        document.getElementById('speedSelect').addEventListener('change', (e) => {
            applySpeedChange(e.target.value);
        });

        // 頁面加載時初始化
        window.addEventListener('DOMContentLoaded', () => {
            initGrid();
        });
    </script>
</body>
</html>
