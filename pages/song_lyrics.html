<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sing & Read - Kids Lyric Reader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            quicksand: ['Quicksand', 'sans-serif'],
          },
          colors: {
            brand: {
              yellow: '#FFD166',
              pink: '#FF6B6B',
              teal: '#4ECDC4',
              blue: '#118AB2',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }

    /* Unread words: large, soft light-grey */
    .lyric-word {
      display: inline-block;
      color: #94A3B8; /* Light slate grey */
      transition: color 0.08s ease, background-color 0.08s ease, transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 4px 8px;
      margin: 2px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
    }

    .lyric-word:hover {
      background-color: #334155;
      color: #ffffff;
    }

    /* Punctuation styling */
    .lyric-punct {
      display: inline-block;
      color: #64748B;
      padding: 0 1px;
      margin: 0;
      user-select: none;
    }

    /* Active Spoken Word: Glowing Bright Gold/Yellow & Scaled */
    .lyric-word.active-word {
      color: #0f172a !important;
      background-color: #FFD166 !important;
      box-shadow: 0 0 24px rgba(255, 209, 102, 0.95);
      transform: scale(1.25);
      font-weight: 700;
      z-index: 20;
    }

    .lyric-viewport {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body class="bg-slate-900 font-quicksand min-h-screen text-slate-100 flex flex-col justify-between select-none">

  <!-- Header -->
  <header class="bg-slate-950 p-4 shadow-md border-b border-slate-800">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('library')">
        <div class="bg-brand-pink text-white w-10 h-10 rounded-2xl flex items-center justify-center text-xl shadow">
          <i class="fa-solid fa-music"></i>
        </div>
        <h1 class="font-fredoka text-2xl font-bold tracking-wide text-white">
          Sing & Read
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="switchView('search')" id="nav-search-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-fredoka font-semibold px-4 py-2 rounded-2xl transition flex items-center gap-2 text-sm border border-slate-700">
          <i class="fa-solid fa-magnifying-glass text-brand-teal"></i>
          <span>Search</span>
        </button>
        <button onclick="switchView('library')" id="nav-library-btn" class="bg-brand-yellow text-slate-900 hover:bg-yellow-300 font-fredoka font-semibold px-4 py-2 rounded-2xl transition flex items-center gap-2 text-sm shadow">
          <i class="fa-solid fa-book-open"></i>
          <span>Saved (<span id="saved-count">0</span>)</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">

    <!-- VIEW 1: SEARCH VIEW -->
    <section id="view-search" class="hidden flex-col gap-4 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
      <form onsubmit="handleSearch(event)" class="flex gap-3">
        <div class="relative flex-1">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search song title or artist..." 
            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-slate-900 text-white border border-slate-700 focus:border-brand-teal focus:outline-none font-medium"
          />
          <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
        </div>
        <button 
          type="button" 
          onclick="handleSearch(event)"
          class="bg-brand-teal hover:bg-teal-400 text-slate-900 font-fredoka font-bold px-6 py-3 rounded-2xl transition flex items-center gap-2">
          <span>Find</span>
        </button>
      </form>

      <div id="search-loading" class="hidden text-center py-8">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-teal"></i>
      </div>

      <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-1"></div>
    </section>

    <!-- VIEW 2: SAVED LIBRARY VIEW (A-Z) -->
    <section id="view-library" class="flex flex-col gap-4 bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
      <div id="library-empty" class="text-center py-12">
        <div class="text-5xl mb-3">🎵</div>
        <h3 class="font-fredoka text-lg text-slate-300">No saved songs</h3>
        <button onclick="switchView('search')" class="mt-4 bg-brand-pink text-white font-fredoka px-6 py-2.5 rounded-2xl shadow hover:bg-pink-600 transition text-sm">
          Search Songs
        </button>
      </div>

      <div id="library-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
    </section>

    <!-- VIEW 3: LYRIC PLAYER VIEW -->
    <section id="view-player" class="hidden flex-col gap-3 bg-slate-800 p-4 sm:p-6 rounded-3xl border border-slate-700 shadow-2xl">
      
      <!-- Song Info -->
      <div class="flex items-center justify-between pb-2 border-b border-slate-700">
        <div class="truncate pr-2">
          <h2 id="player-title" class="font-fredoka text-2xl font-bold text-brand-yellow truncate">Song Title</h2>
          <p id="player-artist" class="text-xs font-semibold text-slate-400 truncate">Artist</p>
        </div>
        <button onclick="switchView('library')" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl transition flex-shrink-0">
          <i class="fa-solid fa-arrow-left mr-1"></i> Back
        </button>
      </div>

      <!-- Player Controls -->
      <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-700 flex flex-wrap items-center justify-between gap-3">
        
        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
          <button id="btn-play" onclick="togglePlay()" class="w-11 h-11 bg-brand-pink hover:bg-pink-600 text-white rounded-2xl shadow flex items-center justify-center text-xl transition transform active:scale-95">
            <i class="fa-solid fa-play ml-0.5" id="play-icon"></i>
          </button>
          <button onclick="stopSpeech()" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-2xl flex items-center justify-center transition active:scale-95">
            <i class="fa-solid fa-square text-xs"></i>
          </button>
          <button onclick="restartSpeech()" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-2xl flex items-center justify-center transition active:scale-95">
            <i class="fa-solid fa-rotate-left text-xs"></i>
          </button>
        </div>

        <!-- Speed & Voice controls -->
        <div class="flex items-center gap-3">
          <!-- Speed Controller (Default 0.7x) -->
          <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
            <span class="text-xs font-bold text-slate-400">Speed:</span>
            <input 
              type="range" 
              id="speed-rate" 
              min="0.1" 
              max="1.5" 
              step="0.05" 
              value="0.7" 
              oninput="onSpeedChange()"
              class="w-20 accent-brand-pink cursor-pointer"
            >
            <span id="speed-val" class="font-fredoka text-xs text-brand-yellow font-bold w-9 text-right">0.7x</span>
          </div>

          <!-- Voice Selection -->
          <select id="voice-select" onchange="onVoiceChange()" class="bg-slate-800 text-xs font-bold text-slate-300 border border-slate-700 px-3 py-2 rounded-xl focus:outline-none max-w-[160px] truncate cursor-pointer">
            <option value="">Voice: Auto</option>
          </select>
        </div>
      </div>

      <!-- Lyrics Canvas Viewport -->
      <div class="relative mt-1">
        <!-- Target Center Line -->
        <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 border-b border-dashed border-brand-yellow/30 pointer-events-none z-10"></div>

        <div 
          id="lyrics-viewport" 
          class="lyric-viewport h-[360px] sm:h-[420px] overflow-y-auto bg-slate-950 rounded-2xl p-6 border border-slate-800 relative text-center"
        >
          <div id="lyrics-content" class="py-[160px] leading-relaxed font-fredoka text-3xl sm:text-4xl tracking-wide select-none">
            <!-- Words rendered here -->
          </div>
        </div>
      </div>

    </section>

  </main>

  <!-- Network Error Dialog Modal -->
  <div id="error-modal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl animate-fade-in">
      <div class="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
        <i class="fa-solid fa-wifi"></i>
      </div>
      <h3 class="font-fredoka text-xl font-bold text-white mb-2">Connection Problem</h3>
      <p id="error-modal-msg" class="text-sm text-slate-300 font-medium mb-6">Unable to connect to the lyrics service. Please check your internet connection.</p>
      
      <div class="flex gap-3">
        <button id="modal-retry-btn" class="flex-1 bg-brand-teal hover:bg-teal-400 text-slate-900 font-fredoka font-bold py-2.5 rounded-2xl transition">
          Retry
        </button>
        <button onclick="closeErrorModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 font-fredoka font-bold py-2.5 rounded-2xl transition">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'lrclib_kids_saved_songs';

    let savedSongs = [];
    let currentSong = null;
    let wordTokens = [];
    let linePhrases = [];
    let currentTokenIdx = -1;
    let isPlaying = false;
    let hasSyncedLrc = false;

    // Retry state handler
    let pendingRetryAction = null;

    // Scroll & Timer controls
    let isProgrammaticScrolling = false;
    let isManualScrolling = false;
    let userScrollTimer = null;
    let lineSpeechTimer = null;
    let wordProgressTimers = [];

    // Speech Engine State
    const synth = window.speechSynthesis;
    let selectedVoice = null;
    let isChineseText = false;
    let currentUtterance = null;

    window.addEventListener('DOMContentLoaded', () => {
      loadSavedSongs();
      initVoices();

      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = () => initVoices();
      }

      const viewport = document.getElementById('lyrics-viewport');
      viewport.addEventListener('scroll', onViewportScroll, { passive: true });

      ['wheel', 'touchstart', 'touchmove', 'mousedown'].forEach(eventType => {
        viewport.addEventListener(eventType, () => {
          isManualScrolling = true;
        }, { passive: true });
      });

      switchView('library');
    });

    function initVoices() {
      const voices = synth.getVoices();
      if (voices && voices.length > 0) {
        populateFilteredVoices();
      }
    }

    function switchView(viewName) {
      stopSpeech();

      document.getElementById('view-search').classList.add('hidden');
      document.getElementById('view-library').classList.add('hidden');
      document.getElementById('view-player').classList.add('hidden');

      if (viewName === 'search') {
        document.getElementById('view-search').classList.remove('hidden');
        document.getElementById('search-input').focus();
      } else if (viewName === 'library') {
        renderLibrary();
        document.getElementById('view-library').classList.remove('hidden');
      } else if (viewName === 'player') {
        document.getElementById('view-player').classList.remove('hidden');
      }
    }

    /* Error Handling Modal */
    function showErrorModal(message, retryCallback) {
      document.getElementById('error-modal-msg').innerText = message || 'Unable to connect to the lyrics service.';
      pendingRetryAction = retryCallback;
      
      const retryBtn = document.getElementById('modal-retry-btn');
      retryBtn.onclick = () => {
        closeErrorModal();
        if (pendingRetryAction) {
          const action = pendingRetryAction;
          pendingRetryAction = null;
          action(); // Directly re-trigger the fetch attempt
        }
      };

      document.getElementById('error-modal').classList.remove('hidden');
    }

    function closeErrorModal() {
      document.getElementById('error-modal').classList.add('hidden');
      pendingRetryAction = null;
    }

    /* Local Storage Management */
    function sortSavedSongs() {
      savedSongs.sort((a, b) => (a.trackName || '').localeCompare(b.trackName || '', undefined, { sensitivity: 'base' }));
    }

    function loadSavedSongs() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        savedSongs = data ? JSON.parse(data) : [];
        sortSavedSongs();
      } catch (e) {
        savedSongs = [];
      }
      updateSavedCount();
    }

    function saveSongsToStorage() {
      try {
        sortSavedSongs();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedSongs));
        updateSavedCount();
      } catch (e) {}
    }

    function updateSavedCount() {
      document.getElementById('saved-count').innerText = savedSongs.length;
    }

    function deleteSong(id, event) {
      if (event) event.stopPropagation();
      savedSongs = savedSongs.filter(s => s.id !== id);
      saveSongsToStorage();
      renderLibrary();
    }

    /* LRCLIB Search with Network Error Handling */
    async function handleSearch(event) {
      if (event) event.preventDefault();
      const inputEl = document.getElementById('search-input');
      const query = inputEl.value.trim();
      if (!query) return;

      const resultsContainer = document.getElementById('search-results');
      const loadingEl = document.getElementById('search-loading');

      resultsContainer.innerHTML = '';
      loadingEl.classList.remove('hidden');

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) {
          if (response.status === 404) {
            loadingEl.classList.add('hidden');
            resultsContainer.innerHTML = '<div class="col-span-full text-center py-6 text-slate-400 font-medium">No songs found</div>';
            return;
          }
          throw new Error('Network response failed with status ' + response.status);
        }

        const data = await response.json();
        loadingEl.classList.add('hidden');

        if (!data || !Array.isArray(data) || data.length === 0) {
          resultsContainer.innerHTML = '<div class="col-span-full text-center py-6 text-slate-400 font-medium">No songs found</div>';
          return;
        }

        renderSearchResults(data);
      } catch (err) {
        loadingEl.classList.add('hidden');
        // Trigger modal only on actual network / timeout / connection failures
        showErrorModal('Unable to fetch songs from LRCLIB. Please check your internet connection.', () => handleSearch(event));
      }
    }

    function renderSearchResults(results) {
      const container = document.getElementById('search-results');
      container.innerHTML = '';

      const validItems = results.filter(item => item.syncedLyrics || item.plainLyrics);
      if (validItems.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-6 text-slate-400 font-medium">No lyrics available for these songs</div>';
        return;
      }

      validItems.forEach(item => {
        const isSaved = savedSongs.some(s => s.id === item.id);

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-700 p-3.5 rounded-2xl flex justify-between items-center";
        card.innerHTML = `
          <div class="pr-2 truncate">
            <h4 class="font-fredoka font-bold text-brand-yellow text-base truncate">${escapeHtml(item.trackName)}</h4>
            <p class="text-xs text-slate-400 truncate">${escapeHtml(item.artistName)}</p>
          </div>
          <button 
            type="button"
            onclick="selectAndSaveSong(${item.id}, '${escapeJsString(item.trackName)}', '${escapeJsString(item.artistName)}')" 
            class="${isSaved ? 'bg-emerald-600' : 'bg-brand-pink hover:bg-pink-600'} text-white font-fredoka text-xs px-3.5 py-1.5 rounded-xl transition flex-shrink-0">
            ${isSaved ? 'Saved' : 'Save'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function selectAndSaveSong(id, trackName, artistName) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const response = await fetch(`https://lrclib.net/api/get/${id}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) {
          if (response.status === 404) {
            alert('Lyrics not found for this song.');
            return;
          }
          throw new Error('Fetch details failed');
        }

        const data = await response.json();
        const rawLyrics = data.syncedLyrics || data.plainLyrics || '';
        if (!rawLyrics.trim()) {
          alert('Lyrics not available for this song.');
          return;
        }

        const songObj = {
          id: data.id,
          trackName: data.trackName || trackName,
          artistName: data.artistName || artistName,
          lyrics: rawLyrics,
          isSynced: !!data.syncedLyrics
        };

        const existingIdx = savedSongs.findIndex(s => s.id === songObj.id);
        if (existingIdx >= 0) savedSongs[existingIdx] = songObj;
        else savedSongs.push(songObj);

        saveSongsToStorage();
        openSongPlayer(songObj);
      } catch (err) {
        showErrorModal('Could not load song lyrics. Please check connection and try again.', () => selectAndSaveSong(id, trackName, artistName));
      }
    }

    function renderSearchResults(results) {
      const container = document.getElementById('search-results');
      container.innerHTML = '';

      results.forEach(item => {
        if (!item.syncedLyrics && !item.plainLyrics) return;
        const isSaved = savedSongs.some(s => s.id === item.id);

        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-700 p-3.5 rounded-2xl flex justify-between items-center";
        card.innerHTML = `
          <div class="pr-2 truncate">
            <h4 class="font-fredoka font-bold text-brand-yellow text-base truncate">${escapeHtml(item.trackName)}</h4>
            <p class="text-xs text-slate-400 truncate">${escapeHtml(item.artistName)}</p>
          </div>
          <button 
            type="button"
            onclick="selectAndSaveSong(${item.id}, '${escapeJsString(item.trackName)}', '${escapeJsString(item.artistName)}')" 
            class="${isSaved ? 'bg-emerald-600' : 'bg-brand-pink hover:bg-pink-600'} text-white font-fredoka text-xs px-3.5 py-1.5 rounded-xl transition flex-shrink-0">
            ${isSaved ? 'Saved' : 'Save'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    async function selectAndSaveSong(id, trackName, artistName) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const response = await fetch(`https://lrclib.net/api/get/${id}`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error('Fetch details failed');

        const data = await response.json();
        const rawLyrics = data.syncedLyrics || data.plainLyrics || '';
        if (!rawLyrics.trim()) return;

        const songObj = {
          id: data.id,
          trackName: data.trackName || trackName,
          artistName: data.artistName || artistName,
          lyrics: rawLyrics,
          isSynced: !!data.syncedLyrics
        };

        const existingIdx = savedSongs.findIndex(s => s.id === songObj.id);
        if (existingIdx >= 0) savedSongs[existingIdx] = songObj;
        else savedSongs.push(songObj);

        saveSongsToStorage();
        openSongPlayer(songObj);
      } catch (err) {
        showErrorModal('Could not load song lyrics. Please try again.', () => selectAndSaveSong(id, trackName, artistName));
      }
    }

    function renderLibrary() {
      const grid = document.getElementById('library-grid');
      const emptyState = document.getElementById('library-empty');

      grid.innerHTML = '';
      sortSavedSongs();

      if (savedSongs.length === 0) {
        emptyState.classList.remove('hidden');
        grid.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      grid.classList.remove('hidden');

      savedSongs.forEach(song => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-700 hover:border-brand-teal p-4 rounded-2xl transition cursor-pointer flex justify-between items-center group";
        card.onclick = () => openSongPlayer(song);

        card.innerHTML = `
          <div class="truncate pr-2">
            <h3 class="font-fredoka font-bold text-brand-yellow text-base group-hover:text-yellow-200 truncate">${escapeHtml(song.trackName)}</h3>
            <p class="text-xs text-slate-400 truncate">${escapeHtml(song.artistName)}</p>
          </div>
          <button type="button" onclick="deleteSong(${song.id}, event)" class="text-slate-500 hover:text-rose-400 p-1.5">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        grid.appendChild(card);
      });
    }

    /* Parsing Lyrics & Word Tokenization */
    function openSongPlayer(song) {
      currentSong = song;
      document.getElementById('player-title').innerText = song.trackName;
      document.getElementById('player-artist').innerText = song.artistName;

      isChineseText = /[\u4e00-\u9fa5\u3400-\u4dbf]/.test(song.lyrics);

      parseAndTokenizeLyrics(song.lyrics);
      populateFilteredVoices();
      switchView('player');
    }

    function parseAndTokenizeLyrics(rawLyrics) {
      const contentEl = document.getElementById('lyrics-content');
      contentEl.innerHTML = '';
      wordTokens = [];
      linePhrases = [];
      currentTokenIdx = -1;
      hasSyncedLrc = false;

      const lines = rawLyrics.split('\n');
      const timecodeRegex = /^\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/;
      const punctRegex = /[.,?!;:—–\-()\[\]{}"'“”‘’/\\。，！？、：；]/;

      lines.forEach((line) => {
        let lrcTimeSec = null;
        let lineText = line.trim();

        const matchLrc = timecodeRegex.exec(lineText);
        if (matchLrc) {
          hasSyncedLrc = true;
          const mins = parseInt(matchLrc[1], 10);
          const secs = parseInt(matchLrc[2], 10);
          const ms = parseInt(matchLrc[3].padEnd(3, '0'), 10);
          lrcTimeSec = mins * 60 + secs + ms / 1000;
          lineText = matchLrc[4].trim();
        }

        if (!lineText) return;

        const lineIdx = linePhrases.length;
        const lineDiv = document.createElement('div');
        lineDiv.className = "my-3 flex flex-wrap justify-center items-center gap-1";

        let regex;
        if (isChineseText) {
          regex = /([\u4e00-\u9fa5\u3400-\u4dbf]|[\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*|[^\s\u4e00-\u9fa5\u3400-\u4dbfa-zA-Z0-9]+|\s+)/gu;
        } else {
          regex = /([\p{L}\p{N}]+(?:['’][\p{L}\p{N}]+)*|[^\p{L}\p{N}\s]+|\s+)/gu;
        }

        let match;
        let lineSpeakText = "";
        const lineTokens = [];

        while ((match = regex.exec(lineText)) !== null) {
          const str = match[0];

          if (/^\s+$/.test(str)) {
            const spaceSpan = document.createElement('span');
            spaceSpan.innerHTML = '&nbsp;';
            lineDiv.appendChild(spaceSpan);
            if (lineSpeakText.length > 0 && !lineSpeakText.endsWith(" ")) {
              lineSpeakText += " ";
            }
          } else if (punctRegex.test(str) && !/[\p{L}\p{N}\u4e00-\u9fa5]/u.test(str)) {
            const pSpan = document.createElement('span');
            pSpan.className = 'lyric-punct';
            pSpan.innerText = str;
            lineDiv.appendChild(pSpan);
          } else {
            const cleanWord = str.replace(/[.,?!;:—–\-()\[\]{}"“”/\\。，！？、：；]/g, '').trim();

            if (cleanWord.length > 0) {
              const span = document.createElement('span');
              span.className = 'lyric-word';
              span.innerText = str;

              const tokenObj = {
                displayText: str,
                speakText: cleanWord,
                spanEl: span,
                index: wordTokens.length,
                lineIdx: lineIdx,
                lrcTimeSec: lrcTimeSec
              };

              span.onclick = (e) => {
                e.stopPropagation();
                jumpToWordIndex(tokenObj.index, true);
              };

              wordTokens.push(tokenObj);
              lineTokens.push(tokenObj);
              lineDiv.appendChild(span);

              lineSpeakText += cleanWord + (isChineseText ? "" : " ");
            }
          }
        }

        if (lineTokens.length > 0) {
          linePhrases.push({
            lineIdx: lineIdx,
            fullSpeakText: lineSpeakText.trim(),
            tokens: lineTokens,
            lrcTimeSec: lrcTimeSec
          });
          contentEl.appendChild(lineDiv);
        }
      });

      document.getElementById('lyrics-viewport').scrollTop = 0;
    }

    /* Cantonese (zh-HK) & Voice Filtering */
    function findBestCantoneseVoice(voices) {
      if (!voices || voices.length === 0) return null;
      return voices.find(v => {
        const lang = (v.lang || '').toLowerCase();
        const name = (v.name || '').toLowerCase();
        return lang === 'zh-hk' || lang === 'yue-hk' || lang.startsWith('yue') || name.includes('cantonese') || name.includes('hong kong');
      }) || voices.find(v => (v.lang || '').toLowerCase().startsWith('zh')) || null;
    }

    function populateFilteredVoices() {
      const voiceSelect = document.getElementById('voice-select');
      const voices = synth.getVoices() || [];
      voiceSelect.innerHTML = '<option value="">Voice: Auto</option>';

      const supportedPrefixes = ['en', 'zh', 'yue', 'ja', 'ko'];
      const filteredVoices = voices.filter(voice => {
        const lang = (voice.lang || '').toLowerCase();
        return supportedPrefixes.some(prefix => lang.startsWith(prefix));
      });

      let autoSelected = isChineseText ? findBestCantoneseVoice(voices) : filteredVoices[0];

      filteredVoices.forEach((voice) => {
        const globalIdx = voices.indexOf(voice);
        const option = document.createElement('option');
        option.value = globalIdx;
        option.textContent = `${voice.name} (${voice.lang})`;

        if (autoSelected && voice === autoSelected) {
          option.selected = true;
        }
        voiceSelect.appendChild(option);
      });

      selectedVoice = autoSelected;
    }

    function onVoiceChange() {
      const voiceSelect = document.getElementById('voice-select');
      const voices = synth.getVoices() || [];
      selectedVoice = voiceSelect.value !== "" ? voices[parseInt(voiceSelect.value)] : (isChineseText ? findBestCantoneseVoice(voices) : null);

      if (isPlaying) {
        stopSpeechEngine();
        jumpToWordIndex(currentTokenIdx >= 0 ? currentTokenIdx : 0, true);
      }
    }

    function onSpeedChange() {
      const rateVal = parseFloat(document.getElementById('speed-rate').value).toFixed(2);
      document.getElementById('speed-val').innerText = `${parseFloat(rateVal)}x`;

      if (isPlaying) {
        stopSpeechEngine();
        jumpToWordIndex(currentTokenIdx >= 0 ? currentTokenIdx : 0, true);
      }
    }

    /* Speech Engine Controls */
    function togglePlay() {
      if (isPlaying) {
        pauseSpeech();
      } else {
        jumpToWordIndex(currentTokenIdx >= 0 ? currentTokenIdx : 0, true);
      }
    }

    function clearTimers() {
      clearTimeout(lineSpeechTimer);
      lineSpeechTimer = null;
      wordProgressTimers.forEach(t => clearTimeout(t));
      wordProgressTimers = [];
    }

    function stopSpeechEngine() {
      clearTimers();
      if (synth.speaking || synth.pending) {
        synth.cancel();
      }
    }

    function pauseSpeech() {
      stopSpeechEngine();
      isPlaying = false;
      updatePlayButtonUI(false);
    }

    function stopSpeech() {
      stopSpeechEngine();
      isPlaying = false;
      clearHighlights();
      currentTokenIdx = -1;
      updatePlayButtonUI(false);
    }

    function restartSpeech() {
      jumpToWordIndex(0, true);
    }

    function updatePlayButtonUI(playing) {
      const btn = document.getElementById('btn-play');
      const icon = document.getElementById('play-icon');

      if (playing) {
        icon.className = 'fa-solid fa-pause';
        btn.classList.replace('bg-brand-pink', 'bg-brand-teal');
      } else {
        icon.className = 'fa-solid fa-play ml-0.5';
        btn.classList.replace('bg-brand-teal', 'bg-brand-pink');
      }
    }

    function jumpToWordIndex(startIndex, startSpeechImmediately = true) {
      stopSpeechEngine();

      if (wordTokens.length === 0) return;
      if (startIndex < 0) startIndex = 0;
      if (startIndex >= wordTokens.length) startIndex = wordTokens.length - 1;

      const token = wordTokens[startIndex];
      currentTokenIdx = startIndex;

      highlightWordAndAutoCenter(startIndex);

      if (startSpeechImmediately) {
        speakLineFromToken(startIndex);
      }
    }

    function speakLineFromToken(startTokenIdx) {
      // Clean up active utterance or scheduled triggers to prevent overlapping speech
      stopSpeechEngine();

      if (startTokenIdx >= wordTokens.length) {
        stopSpeech();
        return;
      }

      isPlaying = true;
      updatePlayButtonUI(true);

      const startToken = wordTokens[startTokenIdx];
      const linePhrase = linePhrases[startToken.lineIdx];

      const tokensToSpeak = linePhrase.tokens.filter(t => t.index >= startTokenIdx);
      const speakPhraseText = tokensToSpeak.map(t => t.speakText).join(isChineseText ? "" : " ");

      const speedRate = parseFloat(document.getElementById('speed-rate').value) || 0.7;

      currentUtterance = new SpeechSynthesisUtterance(speakPhraseText);
      currentUtterance.rate = speedRate;

      if (isChineseText) {
        currentUtterance.lang = 'zh-HK';
      }

      const voices = synth.getVoices() || [];
      let targetVoice = selectedVoice || (isChineseText ? findBestCantoneseVoice(voices) : null);
      if (targetVoice) {
        currentUtterance.voice = targetVoice;
      }

      // PRE-CALIBRATED TIMING ALGORITHM (Scaled for slow & fast speech rates)
      // At lower speeds (e.g. 0.5x, 0.7x), increase lead time proportionally
      const ANTICIPATORY_BIAS_MS = Math.round(120 / speedRate);
      let charOffset = 0;
      let accumTimeMs = 0;
      // Character time duration scales inversely with speech rate
      const baseMsPerChar = (isChineseText ? 280 : 100) / speedRate;

      tokensToSpeak.forEach((tok, idx) => {
        tok.charStart = charOffset;
        tok.charEnd = charOffset + tok.speakText.length;
        charOffset += tok.speakText.length + (isChineseText ? 0 : 1);

        const wordDuration = Math.max(180 / speedRate, tok.speakText.length * baseMsPerChar);

        if (idx > 0) {
          const triggerDelay = Math.max(0, accumTimeMs - ANTICIPATORY_BIAS_MS);
          const t = setTimeout(() => {
            if (isPlaying && currentTokenIdx < tok.index) {
              currentTokenIdx = tok.index;
              highlightWordAndAutoCenter(tok.index);
            }
          }, triggerDelay);
          wordProgressTimers.push(t);
        }
        accumTimeMs += wordDuration;
      });

      currentTokenIdx = startTokenIdx;
      highlightWordAndAutoCenter(startTokenIdx);

      currentUtterance.onstart = () => {
        if (!isPlaying) return;
        currentTokenIdx = startTokenIdx;
        highlightWordAndAutoCenter(startTokenIdx);
      };

      currentUtterance.onboundary = (e) => {
        if (!isPlaying) return;

        if (e.name === 'word' || e.charIndex !== undefined) {
          const charIndex = e.charIndex;
          const matchedToken = tokensToSpeak.find(t => (charIndex + 1) >= t.charStart && charIndex < t.charEnd);

          if (matchedToken && matchedToken.index >= currentTokenIdx) {
            currentTokenIdx = matchedToken.index;
            highlightWordAndAutoCenter(matchedToken.index);
          }
        }
      };

      currentUtterance.onend = () => {
        if (!isPlaying) return;

        const nextLineIdx = startToken.lineIdx + 1;
        const nextLine = linePhrases[nextLineIdx];

        if (!nextLine || nextLine.tokens.length === 0) {
          stopSpeech();
          return;
        }

        let delayMs = Math.max(120, Math.min(1200, 250 / speedRate));

        if (hasSyncedLrc && nextLine.lrcTimeSec !== null && linePhrase.lrcTimeSec !== null) {
          const rawDeltaSec = nextLine.lrcTimeSec - linePhrase.lrcTimeSec;
          if (rawDeltaSec > 0) {
            delayMs = Math.min(1200, Math.max(delayMs, (rawDeltaSec * 1000) / speedRate));
          }
        }

        lineSpeechTimer = setTimeout(() => {
          speakLineFromToken(nextLine.tokens[0].index);
        }, delayMs);
      };

      currentUtterance.onerror = () => {
        if (!isPlaying) return;
        lineSpeechTimer = setTimeout(() => {
          if (startTokenIdx + 1 < wordTokens.length) {
            speakLineFromToken(startTokenIdx + 1);
          } else {
            stopSpeech();
          }
        }, 120);
      };

      synth.speak(currentUtterance);
    }

    function clearHighlights() {
      wordTokens.forEach(t => {
        if (t.spanEl) t.spanEl.classList.remove('active-word');
      });
    }

    /* Precise Vertical Center Auto-scrolling */
    function highlightWordAndAutoCenter(index) {
      clearHighlights();

      const token = wordTokens[index];
      if (!token || !token.spanEl) return;

      token.spanEl.classList.add('active-word');

      if (!isManualScrolling) {
        isProgrammaticScrolling = true;

        const viewport = document.getElementById('lyrics-viewport');
        const span = token.spanEl;

        const targetScrollTop = span.offsetTop - (viewport.offsetHeight / 2) + (span.offsetHeight / 2);

        viewport.scrollTo({
          top: Math.max(0, targetScrollTop),
          behavior: 'smooth'
        });

        setTimeout(() => {
          isProgrammaticScrolling = false;
        }, 350);
      }
    }

    /* Manual Scroll Listener & Speech Resumption */
    function onViewportScroll() {
      if (isProgrammaticScrolling) return;
      if (!isManualScrolling) return;

      if (isPlaying) pauseSpeech();

      clearTimeout(userScrollTimer);
      userScrollTimer = setTimeout(() => {
        isManualScrolling = false;
        resumeFromCenterWord();
      }, 500);
    }

    function resumeFromCenterWord() {
      if (wordTokens.length === 0) return;

      const viewport = document.getElementById('lyrics-viewport');
      const viewportRect = viewport.getBoundingClientRect();
      const centerY = viewportRect.top + viewportRect.height / 2;

      let closestToken = null;
      let minDistance = Infinity;

      wordTokens.forEach(token => {
        if (!token.spanEl) return;
        const rect = token.spanEl.getBoundingClientRect();
        const tokenCenterY = rect.top + rect.height / 2;
        const distance = Math.abs(centerY - tokenCenterY);

        if (distance < minDistance) {
          minDistance = distance;
          closestToken = token;
        }
      });

      if (closestToken) {
        jumpToWordIndex(closestToken.index, true);
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }

    function escapeJsString(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
  </script>
