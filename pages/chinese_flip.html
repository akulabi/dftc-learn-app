<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>詞語翻卡對對碰 - Bilingual Memory Flip Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sky: {
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                        },
                        amber: {
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Fredoka', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            background: linear-gradient(135deg, #a5f3fc 0%, #fef08a 50%, #fbcfe8 100%);
        }

        /* Floating background elements */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 999px;
            filter: blur(1px);
            animation: floatCloud 20s linear infinite;
            pointer-events: none;
        }

        @keyframes floatCloud {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(100vw); }
        }

        /* 3D Card Flip Styles */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.12), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            border: 4px solid #ffffff;
        }

        .card-back {
            background: #ffffff;
            border: 4px solid #facc15;
            transform: rotateY(180deg);
        }

        /* Card Match & Disappear Animation */
        @keyframes matchedPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); box-shadow: 0 0 30px #facc15; }
            100% { transform: rotateY(180deg) scale(0); opacity: 0; }
        }

        .card.matched .card-inner {
            animation: matchedPulse 0.6s forwards;
        }

        /* Custom Scrollbar for Leaderboard */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="h-screen h-[100dvh] max-h-[100dvh] w-screen overflow-hidden flex flex-col justify-between p-2 relative select-none">

    <!-- Floating Decor Clouds -->
    <div class="cloud w-28 h-10 top-4 -left-32" style="animation-duration: 25s;"></div>
    <div class="cloud w-40 h-12 top-16 -left-48" style="animation-duration: 32s; animation-delay: 5s;"></div>
    <div class="cloud w-32 h-10 bottom-12 -left-36" style="animation-duration: 22s; animation-delay: 10s;"></div>

    <!-- Header / App Bar -->
    <header class="w-full max-w-2xl mx-auto flex items-center justify-between shrink-0 mb-1 z-10">
        <div class="flex items-center gap-2 bg-white/85 backdrop-blur-md px-3 py-1 rounded-full shadow-md border-2 border-amber-300">
            <span class="text-xl animate-bounce">🐱</span>
            <h1 id="appTitle" class="text-base sm:text-lg font-black text-amber-600 tracking-wide">詞語對對碰</h1>
        </div>

        <div class="flex items-center gap-1.5">
            <!-- Home / Exit Button -->
            <button id="homeBtn" onclick="confirmGoHome()" class="hidden px-3 py-1 bg-rose-100 hover:bg-rose-200 text-rose-700 font-black rounded-full transition active:scale-95 border-2 border-rose-300 flex items-center gap-1 shadow-sm text-xs sm:text-sm" title="返回首頁">
                <i class="fa-solid fa-house"></i>
                <span id="homeBtnText">首頁</span>
            </button>
            <button id="speechBtn" onclick="toggleSpeech()" class="w-9 h-9 sm:w-10 sm:h-10 bg-amber-100 hover:bg-amber-200 text-amber-700 rounded-full transition active:scale-95 border-2 border-amber-300 flex items-center justify-center shadow-sm" title="語音">
                <i class="fa-solid fa-volume-high text-sm sm:text-base" id="speechIcon"></i>
            </button>
            <button onclick="openLeaderboard()" class="w-9 h-9 sm:w-10 sm:h-10 bg-purple-100 hover:bg-purple-200 text-purple-700 rounded-full transition active:scale-95 border-2 border-purple-300 flex items-center justify-center shadow-sm" title="龍虎榜">
                <i class="fa-solid fa-trophy text-sm sm:text-base"></i>
            </button>
        </div>
    </header>

    <!-- Game Stats Bar -->
    <div class="w-full max-w-2xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl p-1.5 sm:p-2 shadow-md border-2 border-sky-300 flex items-center justify-between gap-2 shrink-0 mb-1 z-10">
        <!-- Level -->
        <div class="flex items-center gap-1 bg-amber-100 px-2 py-0.5 sm:py-1 rounded-xl border border-amber-300">
            <span class="text-sm">🚩</span>
            <div id="levelDisplay" class="text-xs sm:text-sm font-black text-amber-800">第 1 關</div>
        </div>

        <!-- Timer Gauge -->
        <div class="flex-1 px-1">
            <div class="flex justify-between items-center mb-0.5">
                <span class="text-[11px] sm:text-xs font-bold text-slate-600">⏱️ <span id="timerText" class="font-black text-rose-600">30s</span></span>
            </div>
            <div class="w-full bg-slate-200 h-2.5 sm:h-3 rounded-full overflow-hidden p-0.5 border border-slate-300">
                <div id="timerBar" class="bg-gradient-to-r from-emerald-400 to-rose-500 h-full rounded-full transition-all duration-300 w-full"></div>
            </div>
        </div>

        <!-- Score -->
        <div class="flex items-center gap-1 bg-sky-100 px-2 py-0.5 sm:py-1 rounded-xl border border-sky-300">
            <span class="text-sm">⭐</span>
            <div id="scoreDisplay" class="text-xs sm:text-sm font-black text-sky-800">0</div>
        </div>
    </div>

    <!-- Main Game Play Area (No Scroll Dynamic Layout) -->
    <main class="w-full max-w-2xl mx-auto flex-1 flex flex-col items-center justify-center relative min-h-0 z-10 my-auto">
        <!-- Memory Preview Notice with Animated Countdown -->
        <div id="previewNotice" class="hidden absolute top-1 z-20 bg-amber-400/95 text-slate-900 font-black px-4 py-1 rounded-full shadow-lg border-2 border-white animate-pulse text-xs flex items-center gap-1.5">
            <span id="previewLabel">👀 記住卡牌：</span>
            <span id="previewCountdown" class="text-rose-700 text-xs sm:text-sm font-extrabold underline">5 秒!</span>
        </div>

        <!-- Dynamic Card Grid Container -->
        <div id="cardGrid" class="w-full h-full p-1 transition-all duration-300 grid gap-1.5 sm:gap-2.5 items-stretch justify-center">
            <!-- Dynamic cards generated here -->
        </div>

        <!-- Start Game Screen Overlay -->
        <div id="startOverlay" class="absolute inset-0 bg-white/95 backdrop-blur-md rounded-3xl z-30 flex flex-col items-center justify-center p-4 text-center shadow-2xl border-4 border-sky-300">
            <div class="text-5xl sm:text-6xl mb-2 animate-bounce">🧩</div>
            <h2 id="startTitle" class="text-2xl sm:text-3xl font-black text-sky-600 mb-1">詞語翻卡對對碰</h2>
            <p id="startSubtitle" class="text-xs sm:text-sm text-slate-500 font-bold mb-4">翻開卡牌 ‧ 詞語配圖片 ‧ 記憶力大挑戰！</p>

            <!-- Language Mode Selector Toggle -->
            <div class="flex items-center justify-center gap-2 bg-slate-100 p-1.5 rounded-2xl border-2 border-slate-200 mb-5">
                <button id="langCantoneseBtn" onclick="setLanguage('zh-HK')" class="px-3.5 py-1.5 rounded-xl font-extrabold text-xs sm:text-sm transition-all shadow-sm bg-amber-400 text-slate-900 border border-amber-500 flex items-center gap-1">
                    <span>🇭🇰</span> 廣東話
                </button>
                <button id="langEnglishBtn" onclick="setLanguage('en-US')" class="px-3.5 py-1.5 rounded-xl font-extrabold text-xs sm:text-sm transition-all text-slate-600 hover:text-slate-900 flex items-center gap-1">
                    <span>🇬🇧</span> English
                </button>
            </div>

            <button onclick="startGame()" class="px-7 py-3 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-900 text-base sm:text-lg font-black rounded-2xl shadow-lg transform transition active:scale-95 border-b-4 border-amber-700 flex items-center gap-2">
                <i class="fa-solid fa-play text-lg"></i> <span id="startBtnText">開始遊戲</span>
            </button>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-2xl mx-auto flex justify-center items-center shrink-0 py-0.5 z-10">
        <button id="restartBtn" onclick="restartGame()" class="hidden px-3 py-1 bg-white/80 hover:bg-white text-slate-700 rounded-xl font-bold transition active:scale-95 border border-slate-300 text-xs shadow-sm flex items-center gap-1">
            <i class="fa-solid fa-rotate-right text-xs"></i> <span id="restartBtnText">重新開始</span>
        </button>
    </footer>

    <!-- Home Confirmation Modal -->
    <div id="homeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-3xl max-w-xs w-full p-5 shadow-2xl border-4 border-rose-300 text-center">
            <div class="text-4xl mb-2">🏠</div>
            <h3 id="homeModalTitle" class="text-lg font-black text-slate-800 mb-2">確定返回首頁？</h3>
            <p id="homeModalSub" class="text-xs text-slate-500 font-bold mb-4">當前關卡和分數會清除哦！</p>
            <div class="flex gap-2">
                <button id="homeModalConfirm" onclick="goHome()" class="flex-1 py-2 bg-rose-500 hover:bg-rose-600 text-white font-black rounded-xl shadow transition active:scale-95 text-xs">
                    確定返回
                </button>
                <button id="homeModalCancel" onclick="closeModal('homeModal')" class="flex-1 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition text-xs">
                    繼續遊戲
                </button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border-4 border-purple-300 flex flex-col max-h-[80vh]">
            <div class="flex justify-between items-center mb-3">

                    <i class="fa-solid fa-trophy text-amber-400"></i>
                    <span id="lbTitle">龍虎榜</span>
                </div>
                <button onclick="closeLeaderboard()" class="w-8 h-8 bg-slate-100 text-slate-500 rounded-full font-bold hover:bg-slate-200 transition text-sm">✕</button>
            </div>

            <!-- Leaderboard List -->
            <div id="leaderboardList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- Dynamically Populated -->
            </div>

            <div class="mt-3 pt-2 border-t flex justify-end">
                <button id="lbCloseBtn" onclick="closeLeaderboard()" class="px-5 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs hover:bg-purple-700 transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3 hidden">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border-4 border-amber-300 text-center">
            <div class="text-5xl mb-1">🎉</div>
            <h2 id="goTitle" class="text-xl font-black text-amber-600 mb-1">時間到！</h2>

            <div class="bg-amber-50 rounded-xl p-3 mb-4 border border-amber-200 flex justify-around items-center">
                <div>
                    <div id="goScoreLabel" class="text-xs text-amber-700 font-bold">總分</div>
                    <div id="finalScore" class="text-2xl font-black text-amber-600">0</div>
                </div>
                <div class="h-8 w-px bg-amber-200"></div>
                <div>
                    <div id="goLevelLabel" class="text-xs text-amber-700 font-bold">關卡</div>
                    <div id="finalLevel" class="text-2xl font-black text-amber-600">1</div>
                </div>
            </div>

            <div class="mb-4 text-left">
                <input type="text" id="playerName" maxlength="10" placeholder="名字 (例如: 小明)" class="w-full px-3 py-2 rounded-xl border-2 border-slate-300 focus:border-amber-400 focus:outline-none font-bold text-slate-800 text-center text-sm">
            </div>

            <div class="flex gap-2">

                    💾 儲存成績
                </button>
                <button id="playAgainBtn" onclick="restartGame(); closeModal('gameOverModal');" class="py-2.5 px-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition text-xs">
                    再玩一次
                </button>
            </div>
        </div>
    </div>

            { wordZh: '跑步', wordEn: 'Running', emoji: '🏃' }, { wordZh: '游泳', wordEn: 'Swimming', emoji: '🏊' }, { wordZh: '跳舞', wordEn: 'Dancing', emoji: '💃' }, { wordZh: '唱歌', wordEn: 'Singing', emoji: '🎤' },
            { wordZh: '鋼琴', wordEn: 'Piano', emoji: '🎹' }, { wordZh: '吉他', wordEn: 'Guitar', emoji: '🎸' }, { wordZh: '小提琴', wordEn: 'Violin', emoji: '🎻' }, { wordZh: '眼睛', wordEn: 'Eyes', emoji: '👀' },

        ];

        /* ==========================================================================
           2. LANGUAGE & LOCALIZATION CONFIG
           ========================================================================== */
        let currentLang = 'zh-HK'; // 'zh-HK' or 'en-US'

        const UI_TEXT = {
            'zh-HK': {
                title: '詞語對對碰',
                subtitle: '翻開卡牌 ‧ 詞語配圖片 ‧ 記憶力大挑戰！',

        function setLanguage(lang) {
            currentLang = lang;
            const isZh = lang === 'zh-HK';

            document.getElementById('langCantoneseBtn').className = `px-3.5 py-1.5 rounded-xl font-extrabold text-xs sm:text-sm transition-all flex items-center gap-1 ${
                isZh ? 'bg-amber-400 text-slate-900 shadow-sm border border-amber-500' : 'text-slate-600 hover:text-slate-900'
            }`;

            document.getElementById('langEnglishBtn').className = `px-3.5 py-1.5 rounded-xl font-extrabold text-xs sm:text-sm transition-all flex items-center gap-1 ${
                !isZh ? 'bg-amber-400 text-slate-900 shadow-sm border border-amber-500' : 'text-slate-600 hover:text-slate-900'
            }`;

            updateLocalizedUI();
        }

        function updateLocalizedUI() {
            const t = UI_TEXT[currentLang];
            document.getElementById('appTitle').innerText = t.title;
            document.getElementById('startTitle').innerText = t.title;
            document.getElementById('startSubtitle').innerText = t.subtitle;
            document.getElementById('startBtnText').innerText = t.startBtn;
            document.getElementById('homeBtnText').innerText = t.homeBtn;
            document.getElementById('restartBtnText').innerText = t.restartBtn;
            document.getElementById('previewLabel').innerText = t.previewLabel;
            document.getElementById('homeModalTitle').innerText = t.homeModalTitle;
            document.getElementById('homeModalSub').innerText = t.homeModalSub;
            document.getElementById('homeModalConfirm').innerText = t.confirm;
            document.getElementById('homeModalCancel').innerText = t.cancel;
            document.getElementById('lbTitle').innerText = t.lbTitle;
            document.getElementById('lbCloseBtn').innerText = t.close;
            document.getElementById('goTitle').innerText = t.goTitle;
            document.getElementById('goScoreLabel').innerText = t.scoreLabel;
            document.getElementById('goLevelLabel').innerText = t.levelLabel;
            document.getElementById('playerName').placeholder = t.placeholderName;
            document.getElementById('saveScoreBtn').innerText = t.saveScore;
            document.getElementById('playAgainBtn').innerText = t.playAgain;
            updateDashboard();
        }

        /* ==========================================================================
           3. AUDIO SYNTHESIS & SOUND EFFECTS
           ========================================================================== */
        let speechEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'clear') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + idx * 0.05);
                    g.gain.setValueAtTime(0.15, now + idx * 0.05);
                    g.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    o.start(now + idx * 0.05);
                    o.stop(now + 0.5);
                });
            }
        }

        function speakWord(text) {
            if (!speechEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang;
            utterance.rate = 0.95;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            const icon = document.getElementById('speechIcon');
            const btn = document.getElementById('speechBtn');
            const t = UI_TEXT[currentLang];
            if (speechEnabled) {
                icon.className = 'fa-solid fa-volume-high text-base';
                btn.classList.replace('bg-slate-200', 'bg-amber-100');
                speakWord(t.speechOn);
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-base';
                btn.classList.replace('bg-amber-100', 'bg-slate-200');
            }
        }

        /* ==========================================================================
           4. GAME STATE & MECHANICS
           ========================================================================== */
        let gameActive = false;
        let score = 0;
        let currentLevel = 1;
        let cardCount = 8;
        let timeLeft = 30;
        let timerInterval = null;
        let isPreviewing = false;

        let cardsData = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let isLockBoard = false;

        window.addEventListener('DOMContentLoaded', () => {
            renderLeaderboard();
            updateLocalizedUI();
        });

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('restartBtn').classList.remove('hidden');
            document.getElementById('homeBtn').classList.remove('hidden');
            score = 0;
            currentLevel = 1;
            cardCount = 8;
            timeLeft = 30;
            updateDashboard();
            startLevel();
            startTimer();
            gameActive = true;
        }

        function confirmGoHome() {
            document.getElementById('homeModal').classList.remove('hidden');
        }

        function goHome() {
            closeModal('homeModal');
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('startOverlay').classList.remove('hidden');
            document.getElementById('restartBtn').classList.add('hidden');
            document.getElementById('homeBtn').classList.add('hidden');
            document.getElementById('previewNotice').classList.add('hidden');
            document.getElementById('cardGrid').innerHTML = '';
        }

        function restartGame() {
            clearInterval(timerInterval);
            document.getElementById('gameOverModal').classList.add('hidden');
            startGame();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive || isPreviewing) return;

                timeLeft--;
                updateDashboard();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateDashboard() {
            const t = UI_TEXT[currentLang];
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('levelDisplay').innerText = `${t.levelPrefix}${currentLevel}${t.levelSuffix}`;
            document.getElementById('timerText').innerText = `${timeLeft}s`;

            const percentage = Math.max(0, Math.min(100, (timeLeft / 30) * 100));
            const timerBar = document.getElementById('timerBar');
            timerBar.style.width = `${percentage}%`;

            if (timeLeft <= 8) {
                timerBar.className = "bg-rose-500 h-full rounded-full transition-all duration-300 w-full animate-pulse";
            } else {
                timerBar.className = "bg-gradient-to-r from-emerald-400 to-amber-500 h-full rounded-full transition-all duration-300 w-full";
            }
        }

        function startLevel() {
            matchedPairs = 0;
            flippedCards = [];
            isLockBoard = true;
            isPreviewing = true;

            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            // Dynamic grid layout fitting screen height seamlessly
            if (cardCount <= 8) {
                grid.className = "w-full h-full grid grid-cols-2 sm:grid-cols-4 grid-rows-4 sm:grid-rows-2 gap-1.5 sm:gap-2.5 max-w-xl mx-auto items-stretch justify-items-stretch";
            } else if (cardCount <= 12) {
                grid.className = "w-full h-full grid grid-cols-3 sm:grid-cols-4 grid-rows-4 sm:grid-rows-3 gap-1.5 sm:gap-2 max-w-2xl mx-auto items-stretch justify-items-stretch";
            } else {
                grid.className = "w-full h-full grid grid-cols-4 grid-rows-4 gap-1 sm:gap-1.5 max-w-2xl mx-auto items-stretch justify-items-stretch";
            }

            const numPairs = cardCount / 2;
            const selectedPairs = getRandomSample(WORD_BANK, numPairs);

            cardsData = [];
            selectedPairs.forEach((item, index) => {
                const wordText = currentLang === 'zh-HK' ? item.wordZh : item.wordEn;
                cardsData.push({ id: `pair-${index}-word`, pairId: index, type: 'word', content: wordText, speechText: wordText });
                cardsData.push({ id: `pair-${index}-pic`, pairId: index, type: 'picture', content: item.emoji, speechText: wordText });
            });

            shuffleArray(cardsData);

            cardsData.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective-1000 w-full h-full cursor-pointer min-h-0';
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <span class="text-2xl sm:text-3xl">❓</span>
                        </div>
                        <div class="card-back">
                            <span class="${card.type === 'word' ? 'text-base sm:text-2xl font-black text-slate-800 tracking-wider text-center px-1' : 'text-3xl sm:text-5xl'}">
                                ${card.content}
                            </span>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(cardEl, card));
                grid.appendChild(cardEl);
            });

            const notice = document.getElementById('previewNotice');
            const previewCountdownEl = document.getElementById('previewCountdown');
            const t = UI_TEXT[currentLang];
            
            let previewSecondsLeft = 5;
            previewCountdownEl.innerText = `${previewSecondsLeft} ${t.secSuffix}`;
            notice.classList.remove('hidden');

            const allCardEls = document.querySelectorAll('.card');
            allCardEls.forEach(c => c.classList.add('flipped'));

            // 5-second memory preview timer interval
            const previewTimer = setInterval(() => {
                previewSecondsLeft--;
                if (previewSecondsLeft > 0) {
                    previewCountdownEl.innerText = `${previewSecondsLeft} ${t.secSuffix}`;
                } else {
                    clearInterval(previewTimer);
                }
            }, 1000);

            setTimeout(() => {
                clearInterval(previewTimer);
                allCardEls.forEach(c => c.classList.remove('flipped'));
                notice.classList.add('hidden');
                
                // Only unlock board if game is still active
                if (gameActive) {
                    isLockBoard = false;
                }
                isPreviewing = false;
            }, 5000);
        }

        function handleCardClick(cardEl, card) {
            // Strict check: Freeze card clicks if game is inactive or locked
            if (!gameActive || isLockBoard || isPreviewing) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            cardEl.classList.add('flipped');
            playSound('flip');
            speakWord(card.speechText);

            flippedCards.push({ element: cardEl, data: card });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            const [card1, card2] = flippedCards;

            const isMatch = (card1.data.pairId === card2.data.pairId) && (card1.data.type !== card2.data.type);

            if (isMatch) {
                playSound('match');
                score += 100 + Math.min(timeLeft * 2, 50);
                updateDashboard();

                setTimeout(() => {
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');

                    matchedPairs++;
                    flippedCards = [];
                    isLockBoard = false;

                    if (matchedPairs === cardCount / 2) {
                        handleLevelClear();
                    }
                }, 350);

            } else {
                playSound('wrong');
                setTimeout(() => {
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    flippedCards = [];
                    isLockBoard = false;
                }, 900);
            }
        }

        function handleLevelClear() {
            playSound('clear');
            triggerConfetti();

            timeLeft += 10;
            score += 300;
            currentLevel++;
            cardCount = Math.min(cardCount + 4, 16);

            updateDashboard();

            setTimeout(() => {
                startLevel();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            isLockBoard = true;
            clearInterval(timerInterval);

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalLevel').innerText = currentLevel;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        /* ==========================================================================
           5. LEADERBOARD SYSTEM (龍虎榜)
           ========================================================================== */
        const LEADERBOARD_KEY = 'hk_kids_memory_game_leaderboard';

        function getScores() {
            const data = localStorage.getItem(LEADERBOARD_KEY);
            return data ? JSON.parse(data) : [
                { name: '小聰明', score: 1200, level: 3, date: '2026-10-15' },
                { name: '美美', score: 850, level: 2, date: '2026-10-18' },
                { name: '樂樂', score: 500, level: 1, date: '2026-10-20' }
            ];
        }

        function submitScore() {
            const t = UI_TEXT[currentLang];
            const nameInput = document.getElementById('playerName').value.trim() || t.defaultPlayer;
            const scores = getScores();

            scores.push({
                name: nameInput,
                score: score,
                level: currentLevel,
                date: new Date().toISOString().split('T')[0]
            });

            scores.sort((a, b) => b.score - a.score);
            const top5 = scores.slice(0, 5);

            localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(top5));

            closeModal('gameOverModal');
            openLeaderboard();
        }

        function renderLeaderboard() {
            const scores = getScores();
            const listEl = document.getElementById('leaderboardList');
            const t = UI_TEXT[currentLang];
            listEl.innerHTML = '';

            const medalEmojis = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];

            scores.forEach((entry, idx) => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-xl ${
                    idx === 0 ? 'bg-amber-100 border-2 border-amber-300' : 'bg-slate-50 border border-slate-200'
                }`;

                item.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="text-xl">${medalEmojis[idx] || '⭐'}</span>
                        <div>
                            <div class="font-black text-slate-800 text-sm">${entry.name}</div>
                            <div class="text-[10px] text-slate-500 font-bold">${t.levelPrefix}${entry.level}${t.levelSuffix}</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-base font-black text-amber-600">${entry.score}</div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function openLeaderboard() {
            renderLeaderboard();
            document.getElementById('leaderboardModal').classList.remove('hidden');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').classList.add('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function getRandomSample(arr, size) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, size);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
