    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
            user-select: none;

            touch-action: manipulation;
            background: linear-gradient(135deg, #a5f3fc 0%, #fef08a 50%, #fbcfe8 100%);

        /* Floating background elements */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.65);
            border-radius: 999px;
            filter: blur(1px);
            animation: floatCloud 20s linear infinite;
            pointer-events: none;
        }

        @keyframes floatCloud {
            0% { transform: translateX(-150px); }
            100% { transform: translateX(100vw); }
        }

        /* 3D Card Flip Styles */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.12), 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-front {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            border: 4px solid #ffffff;
        }

        .card-back {
            background: #ffffff;
            border: 4px solid #facc15;
            transform: rotateY(180deg);
        }

        /* Card Match & Disappear Animation */
        @keyframes matchedPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.15); box-shadow: 0 0 30px #facc15; }
            100% { transform: rotateY(180deg) scale(0); opacity: 0; }
        }

        .card.matched .card-inner {
            animation: matchedPulse 0.6s forwards;
        }

        /* Custom Scrollbar for Leaderboard */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        ];

        /* ==========================================================================
           2. AUDIO SYNTHESIS & SOUND EFFECTS
           ========================================================================== */
        let speechEnabled = true;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'match') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.08);
                osc.frequency.setValueAtTime(783.99, now + 0.16);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'clear') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, now + idx * 0.05);
                    g.gain.setValueAtTime(0.15, now + idx * 0.05);
                    g.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    o.start(now + idx * 0.05);
                    o.stop(now + 0.5);
                });
            }
        }

        function speakCantonese(text) {
            if (!speechEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 0.95;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            const icon = document.getElementById('speechIcon');
            const btn = document.getElementById('speechBtn');
            if (speechEnabled) {
                icon.className = 'fa-solid fa-volume-high text-base';
                btn.classList.replace('bg-slate-200', 'bg-amber-100');
                speakCantonese('語音已開啟');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-base';
                btn.classList.replace('bg-amber-100', 'bg-slate-200');
            }
        }

        /* ==========================================================================
           3. GAME STATE & MECHANICS
           ========================================================================== */
        let gameActive = false;
        let score = 0;
        let currentLevel = 1;
        let cardCount = 8;
        let timeLeft = 30;
        let timerInterval = null;
        let isPreviewing = false;

        let cardsData = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let isLockBoard = false;

        window.addEventListener('DOMContentLoaded', () => {
            renderLeaderboard();
        });

        function startGame() {
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('restartBtn').classList.remove('hidden');
            document.getElementById('homeBtn').classList.remove('hidden');
            score = 0;
            currentLevel = 1;
            cardCount = 8;
            timeLeft = 30;
            updateDashboard();
            startLevel();
            startTimer();
            gameActive = true;
        }

        function confirmGoHome() {
            document.getElementById('homeModal').classList.remove('hidden');
        }

        function goHome() {
            closeModal('homeModal');
            gameActive = false;
            clearInterval(timerInterval);
            document.getElementById('startOverlay').classList.remove('hidden');
            document.getElementById('restartBtn').classList.add('hidden');
            document.getElementById('homeBtn').classList.add('hidden');
            document.getElementById('previewNotice').classList.add('hidden');
            document.getElementById('cardGrid').innerHTML = '';
        }

        function restartGame() {
            clearInterval(timerInterval);
            document.getElementById('gameOverModal').classList.add('hidden');
            startGame();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive || isPreviewing) return;

                timeLeft--;
                updateDashboard();

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateDashboard() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('levelDisplay').innerText = `第 ${currentLevel} 關`;
            document.getElementById('timerText').innerText = `${timeLeft}s`;

            const percentage = Math.max(0, Math.min(100, (timeLeft / 30) * 100));
            const timerBar = document.getElementById('timerBar');
            timerBar.style.width = `${percentage}%`;

            if (timeLeft <= 8) {
                timerBar.className = "bg-rose-500 h-full rounded-full transition-all duration-300 w-full animate-pulse";
            } else {
                timerBar.className = "bg-gradient-to-r from-emerald-400 to-amber-500 h-full rounded-full transition-all duration-300 w-full";
            }
        }

        function startLevel() {
            matchedPairs = 0;
            flippedCards = [];
            isLockBoard = true;
            isPreviewing = true;

            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            // Dynamic grid layout fitting screen height seamlessly
            if (cardCount <= 8) {
                grid.className = "w-full h-full grid grid-cols-2 sm:grid-cols-4 grid-rows-4 sm:grid-rows-2 gap-1.5 sm:gap-2.5 max-w-xl mx-auto items-stretch justify-items-stretch";
            } else if (cardCount <= 12) {
                grid.className = "w-full h-full grid grid-cols-3 sm:grid-cols-4 grid-rows-4 sm:grid-rows-3 gap-1.5 sm:gap-2 max-w-2xl mx-auto items-stretch justify-items-stretch";
            } else {
                grid.className = "w-full h-full grid grid-cols-4 grid-rows-4 gap-1 sm:gap-1.5 max-w-2xl mx-auto items-stretch justify-items-stretch";
            }

            const numPairs = cardCount / 2;
            const selectedPairs = getRandomSample(WORD_BANK, numPairs);

            cardsData = [];
            selectedPairs.forEach((item, index) => {
                cardsData.push({ id: `pair-${index}-word`, pairId: index, type: 'word', content: item.word, speechText: item.word });
                cardsData.push({ id: `pair-${index}-pic`, pairId: index, type: 'picture', content: item.emoji, speechText: item.word });
            });

            shuffleArray(cardsData);

            cardsData.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card perspective-1000 w-full h-full cursor-pointer min-h-0';
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <span class="text-2xl sm:text-3xl">❓</span>
                        </div>
                        <div class="card-back">
                            <span class="${card.type === 'word' ? 'text-lg sm:text-2xl font-black text-slate-800 tracking-wider' : 'text-3xl sm:text-5xl'}">
                                ${card.content}
                            </span>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(cardEl, card));
                grid.appendChild(cardEl);
            });

            const notice = document.getElementById('previewNotice');
            const previewCountdownEl = document.getElementById('previewCountdown');
            
            let previewSecondsLeft = 3;
            previewCountdownEl.innerText = `${previewSecondsLeft} 秒!`;
            notice.classList.remove('hidden');

            const allCardEls = document.querySelectorAll('.card');
            allCardEls.forEach(c => c.classList.add('flipped'));

            // 3-second memory preview timer interval
            const previewTimer = setInterval(() => {
                previewSecondsLeft--;
                if (previewSecondsLeft > 0) {
                    previewCountdownEl.innerText = `${previewSecondsLeft} 秒!`;
                } else {
                    clearInterval(previewTimer);
                }
            }, 1000);

            setTimeout(() => {
                clearInterval(previewTimer);
                allCardEls.forEach(c => c.classList.remove('flipped'));
                notice.classList.add('hidden');
                isLockBoard = false;
                isPreviewing = false;
            }, 3000);
        }

        function handleCardClick(cardEl, card) {
            if (isLockBoard || isPreviewing) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            cardEl.classList.add('flipped');
            playSound('flip');
            speakCantonese(card.speechText);

            flippedCards.push({ element: cardEl, data: card });

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            const [card1, card2] = flippedCards;

            const isMatch = (card1.data.pairId === card2.data.pairId) && (card1.data.type !== card2.data.type);

            if (isMatch) {
                playSound('match');
                score += 100 + Math.min(timeLeft * 2, 50);
                updateDashboard();

                setTimeout(() => {
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');

                    matchedPairs++;
                    flippedCards = [];
                    isLockBoard = false;

                    if (matchedPairs === cardCount / 2) {
                        handleLevelClear();
                    }
                }, 350);

            } else {
                playSound('wrong');
                setTimeout(() => {
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    flippedCards = [];
                    isLockBoard = false;
                }, 900);
            }
        }

        function handleLevelClear() {
            playSound('clear');
            triggerConfetti();

            timeLeft += 10;
            score += 300;
            currentLevel++;
            cardCount = Math.min(cardCount + 4, 16);

            updateDashboard();

            setTimeout(() => {
                startLevel();
            }, 1000);
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);

            document.getElementById('finalScore').innerText = score;
            document.getElementById('finalLevel').innerText = currentLevel;
            document.getElementById('gameOverModal').classList.remove('hidden');
        }

        /* ==========================================================================
           4. LEADERBOARD SYSTEM (龍虎榜)
           ========================================================================== */
        const LEADERBOARD_KEY = 'hk_kids_memory_game_leaderboard';

        function getScores() {
            const data = localStorage.getItem(LEADERBOARD_KEY);
            return data ? JSON.parse(data) : [
                { name: '小聰明', score: 1200, level: 3, date: '2026-10-15' },
                { name: '美美', score: 850, level: 2, date: '2026-10-18' },
                { name: '樂樂', score: 500, level: 1, date: '2026-10-20' }
            ];
        }

        function submitScore() {
            const nameInput = document.getElementById('playerName').value.trim() || '小探險家';
            const scores = getScores();

            scores.push({
                name: nameInput,
                score: score,
                level: currentLevel,
                date: new Date().toISOString().split('T')[0]
            });

            scores.sort((a, b) => b.score - a.score);
            const top5 = scores.slice(0, 5);

            localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(top5));

            closeModal('gameOverModal');
            openLeaderboard();
        }

        function renderLeaderboard() {
            const scores = getScores();
            const listEl = document.getElementById('leaderboardList');
            listEl.innerHTML = '';

            const medalEmojis = ['🥇', '🥈', '🥉', '4️⃣', '5️⃣'];

            scores.forEach((entry, idx) => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2.5 rounded-xl ${
                    idx === 0 ? 'bg-amber-100 border-2 border-amber-300' : 'bg-slate-50 border border-slate-200'
                }`;

                item.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <span class="text-xl">${medalEmojis[idx] || '⭐'}</span>
                        <div>
                            <div class="font-black text-slate-800 text-sm">${entry.name}</div>
                            <div class="text-[10px] text-slate-500 font-bold">第 ${entry.level} 關</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-base font-black text-amber-600">${entry.score} 分</div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function openLeaderboard() {
            renderLeaderboard();
            document.getElementById('leaderboardModal').classList.remove('hidden');
        }

        function closeLeaderboard() {
            document.getElementById('leaderboardModal').classList.add('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function getRandomSample(arr, size) {
            const shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, size);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 60,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }
        }
    </script>
</body>
</html>
