<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>照片拼圖大師 Photo Puzzle Master</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    
    * {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-[100dvh] w-screen overflow-hidden flex flex-col justify-between select-none">

  <!-- ==================== SCREEN 1: SELECTION SCREEN ==================== -->
  <div id="selection-screen" class="h-[100dvh] w-full flex flex-col justify-between p-3 sm:p-5 max-w-4xl mx-auto overflow-y-auto">
    <!-- Header -->
    <header class="text-center py-1.5 shrink-0">
      <div id="selected-diff-badge" class="inline-flex items-center gap-1.5 bg-indigo-50 border border-indigo-100 px-3 py-0.5 rounded-full text-indigo-600 text-xs font-bold mb-1">
        🧩 簡單 (9格)
      </div>
      <h1 class="text-xl sm:text-2xl font-extrabold text-slate-800 tracking-tight">照片拼圖大師</h1>
      <p class="text-xs text-slate-500 mt-0.5">選擇預設圖片或上傳本地相片開始挑戰</p>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 min-h-0 flex flex-col md:flex-row gap-3 py-1 my-auto">
      
      <!-- Left Column: Controls & Presets -->
      <div class="w-full md:w-1/2 flex flex-col justify-between gap-2.5 bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-md">
        
        <!-- Local Upload Area -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
            📁 本地相片
          </label>
          <input type="file" id="image-input" accept="image/*" class="hidden">
          <button id="btn-trigger-upload" class="w-full py-2.5 px-3 bg-indigo-50 border-2 border-dashed border-indigo-200 hover:border-indigo-400 hover:bg-indigo-100/60 rounded-xl flex items-center justify-center gap-2 text-indigo-700 text-xs font-bold transition-all active:scale-[0.99]">
            ☁️ 上傳自訂相片
          </button>
        </div>

        <!-- Difficulty Selection -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
            ⚙️ 選擇難易度
          </label>
          <div class="grid grid-cols-3 gap-1.5" id="difficulty-selector">
            <button data-grid="3" class="diff-btn py-1.5 px-2 bg-indigo-600 text-white rounded-xl text-xs font-bold border border-indigo-600 shadow-sm transition-all flex flex-col items-center">
              <span>簡單</span>
              <span class="text-[10px] font-normal opacity-90">9格</span>
            </button>
            <button data-grid="4" class="diff-btn py-1.5 px-2 bg-slate-50 text-slate-700 hover:bg-slate-100 rounded-xl text-xs font-bold border border-slate-200 transition-all flex flex-col items-center">
              <span>普通</span>
              <span class="text-[10px] text-slate-400 font-normal">16格</span>
            </button>
            <button data-grid="5" class="diff-btn py-1.5 px-2 bg-slate-50 text-slate-700 hover:bg-slate-100 rounded-xl text-xs font-bold border border-slate-200 transition-all flex flex-col items-center">
              <span>困難</span>
              <span class="text-[10px] text-slate-400 font-normal">25格</span>
            </button>
          </div>
        </div>

        <!-- Preset Selection -->
        <div class="flex-1 min-h-0 flex flex-col justify-center">
          <label class="block text-xs font-bold text-slate-700 mb-1.5 flex items-center gap-1.5">
            🖼️ 精選圖庫
          </label>
          <div id="presets-grid" class="grid grid-cols-5 gap-2 overflow-y-auto max-h-[140px] md:max-h-none p-0.5">
            <!-- Preset items injected dynamically -->
          </div>
        </div>

        <!-- Start Game Action (Disabled when no photo selected) -->
        <button id="btn-start-game" disabled class="w-full py-3 bg-slate-300 text-slate-500 font-bold text-sm rounded-xl shadow-none flex items-center justify-center gap-2 transition-all cursor-not-allowed">
          <span>開始拼圖遊戲</span> ▶
        </button>
      </div>

      <!-- Right Column: Selected Image Preview (Hidden when no image selected) -->
      <div id="preview-panel-container" class="hidden w-full md:w-1/2 bg-white rounded-2xl p-3 border border-slate-200/80 shadow-md flex flex-col items-center justify-center min-h-0 max-h-[220px] md:max-h-full">
        <span class="text-[11px] font-semibold text-slate-500 mb-1.5 flex items-center gap-1 shrink-0">
          👁️ 圖片預覽 <span class="text-[10px] text-slate-400 font-normal">(點擊可放大)</span>
        </span>
        <div id="preview-img-container" class="w-full flex-1 min-h-0 bg-slate-100 rounded-xl border border-slate-200 overflow-hidden flex items-center justify-center p-1.5 cursor-pointer hover:opacity-90 transition-opacity">
          <img id="selected-preview-img" src="" alt="圖片預覽" class="max-h-full max-w-full object-contain rounded-lg shadow-sm">
        </div>
      </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-[10px] text-slate-400 shrink-0 py-1">
      照片拼圖大師 &copy; 繁體中文版
    </footer>
  </div>


  <!-- ==================== SCREEN 2: GAME SCREEN ==================== -->
  <div id="game-screen" class="hidden h-[100dvh] w-full flex flex-col justify-between p-1 sm:p-2 max-w-4xl mx-auto overflow-hidden">
    
    <!-- Top Bar Ribbon (Ultra-compact) -->
    <header class="bg-white rounded-lg border border-slate-200 shadow-sm px-2 py-1 flex items-center justify-between shrink-0 gap-1.5 text-xs">
      <div class="flex items-center gap-1">
        <button id="btn-back-to-select" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-[11px] font-bold flex items-center gap-1 transition-colors">
          ◀ 換圖
        </button>
        <button id="btn-restart" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-[11px] font-semibold flex items-center gap-1 transition-colors">
          🔄 重設
        </button>
      </div>

      <!-- Compact Stats Bar -->
      <div class="flex items-center gap-2 text-[11px] font-semibold">
        <div class="flex items-center gap-0.5 text-slate-600">
          ⏱️ <span id="timer-display" class="font-mono font-bold text-slate-800">00:00</span>
        </div>
        <div class="flex items-center gap-0.5 text-slate-600">
          👣 <span id="moves-display" class="font-bold text-slate-800">0</span>步
        </div>
        <div class="flex items-center gap-0.5 text-slate-600">
          🔒 <span id="lock-display" class="font-bold text-emerald-600">0</span>/<span id="total-lock-display">9</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-1">
        <button id="btn-sound" class="px-1.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md text-[11px] transition-colors" title="音效設定">
          <span id="sound-icon">🔊</span>
        </button>
        <button id="btn-show-ref" class="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-md text-[11px] font-bold flex items-center gap-1 transition-colors">
          🖼️ 原圖
        </button>
      </div>
    </header>

    <!-- Center Canvas Puzzle Playfield (Maximized Workspace) -->
    <main class="flex-1 min-h-0 flex items-center justify-center py-0.5 relative">
      <div id="canvas-wrapper" class="relative w-full h-full bg-white rounded-xl p-1 shadow-sm border border-slate-200/80 flex items-center justify-center overflow-hidden">
        <!-- Interactive HTML5 Canvas Engine -->
        <canvas id="puzzle-canvas" class="block rounded-lg touch-none cursor-pointer"></canvas>
      </div>
    </main>

    <!-- Bottom Ultra-thin Hint Bar -->
    <footer class="text-center shrink-0 py-0.5">
      <span class="text-[10px] text-slate-400 flex items-center justify-center gap-1">
        💡 點擊或拖曳拼圖交換位置，放置正確位置自動鎖定
      </span>
    </footer>
  </div>


  <!-- ==================== MODALS & OVERLAYS ==================== -->

  <!-- REFERENCE IMAGE MODAL OVERLAY -->
  <div id="reference-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div class="bg-white rounded-2xl p-3 sm:p-4 max-w-xs sm:max-w-sm w-full border border-slate-200 shadow-2xl relative flex flex-col items-center max-h-[85dvh]">
      <button id="btn-close-ref" class="absolute top-2.5 right-2.5 text-slate-400 hover:text-slate-600 p-1 rounded-lg bg-slate-100 text-xs font-bold">
        ✕
      </button>
      <h3 class="text-slate-800 font-bold text-xs sm:text-sm mb-2 flex items-center gap-1.5">
        🖼️ 完整參考原圖 <span class="text-[10px] text-slate-400 font-normal">(點擊可放大)</span>
      </h3>
      <div id="ref-modal-img-container" class="w-full flex-1 min-h-0 flex justify-center items-center overflow-hidden rounded-xl bg-slate-50 border border-slate-200 p-1 cursor-pointer hover:opacity-90 transition-opacity">
        <img id="reference-img-preview" src="" alt="參考原圖" class="max-h-[60dvh] object-contain rounded-lg">
      </div>
    </div>
  </div>

  <!-- FULLSCREEN LIGHTBOX PREVIEW OVERLAY -->
  <div id="lightbox-modal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md z-[100] flex flex-col items-center justify-between p-3 sm:p-6 transition-opacity">
    <div class="w-full max-w-4xl flex justify-between items-center text-white shrink-0 py-1">
      <span class="text-xs sm:text-sm font-semibold flex items-center gap-1.5 opacity-90">
        🔍 高清大圖預覽
      </span>
      <button id="btn-close-lightbox" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors text-sm font-bold">
        ✕
      </button>
    </div>

    <div id="lightbox-bg-close" class="flex-1 w-full max-w-5xl flex items-center justify-center min-h-0 py-2 cursor-zoom-out">
      <img id="lightbox-img" src="" alt="大圖放大預覽" class="max-h-[82dvh] max-w-full object-contain rounded-xl shadow-2xl border border-white/10 select-none">
    </div>

    <div class="text-[11px] text-white/60 shrink-0">
      <span>點擊背景或右上角按鈕關閉預覽</span>
    </div>
  </div>

  <!-- VICTORY OVERLAY MODAL -->
  <div id="victory-modal" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-md z-50 flex items-center justify-center p-3">
    <div class="bg-white rounded-3xl p-4 sm:p-5 max-w-sm w-full border border-slate-200 shadow-2xl flex flex-col items-center text-center relative max-h-[90dvh]">
      
      <!-- Trophy Icon -->
      <div class="w-12 h-12 bg-amber-100 border border-amber-200 rounded-full flex items-center justify-center text-amber-500 text-xl shadow-inner mb-1.5 shrink-0">
        🏆
      </div>

      <h2 class="text-xl font-extrabold text-slate-800">挑戰成功！</h2>

      <!-- Completed Full Image Display -->
      <div id="win-img-container" class="w-full flex-1 min-h-0 bg-slate-100 rounded-xl border border-slate-200 overflow-hidden my-2 p-1 flex items-center justify-center cursor-pointer hover:opacity-90 transition-opacity">
        <img id="win-full-image" src="" alt="完成照片" class="max-h-[30dvh] object-contain rounded-lg shadow-sm">
      </div>

      <!-- Stats Summary -->
      <div class="w-full grid grid-cols-2 gap-2 mb-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs shrink-0">
        <div class="flex flex-col items-center">
          <span class="text-[10px] text-slate-400 font-semibold tracking-wider">花費時間</span>
          <span id="win-time" class="text-sm font-extrabold text-slate-700 font-mono">00:00</span>
        </div>
        <div class="flex flex-col items-center border-l border-slate-200">
          <span class="text-[10px] text-slate-400 font-semibold tracking-wider">移動步數</span>
          <span id="win-moves" class="text-sm font-extrabold text-slate-700">0 步</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="w-full flex gap-2 shrink-0">
        <button id="btn-play-again" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-100 transition-all active:scale-95">
          🔄 再玩一次
        </button>
        <button id="btn-choose-another" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all active:scale-95">
          🖼️ 選擇新照片
        </button>
      </div>

    </div>
  </div>


  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // Fallback SVG Generator in case remote images fail or offline
    const createFallbackSvg = (title, bg1, bg2) => {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
        <defs>
          <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="${bg1}" />
            <stop offset="100%" stop-color="${bg2}" />
          </linearGradient>
        </defs>
        <rect width="800" height="600" fill="url(#g)" />
        <circle cx="400" cy="270" r="140" fill="white" opacity="0.15"/>
        <text x="400" y="440" font-family="sans-serif" font-size="44" font-weight="bold" fill="white" text-anchor="middle">${title}</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    };

    // PRESET IMAGES
    const PRESET_IMAGES = [
      { id: 'preset-1', name: '大自然', url: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80', fallback: createFallbackSvg('大自然', '#059669', '#10b981') },
      { id: 'preset-2', name: '可愛貓咪', url: 'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80', fallback: createFallbackSvg('可愛貓咪', '#d97706', '#f59e0b') },
      { id: 'preset-3', name: '抽象藝術', url: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?auto=format&fit=crop&w=800&q=80', fallback: createFallbackSvg('抽象藝術', '#7c3aed', '#8b5cf6') },
      { id: 'preset-4', name: '都市夜景', url: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?auto=format&fit=crop&w=800&q=80', fallback: createFallbackSvg('都市夜景', '#1e293b', '#3b82f6') },
      { id: 'preset-5', name: '名畫繪畫', url: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?auto=format&fit=crop&w=800&q=80', fallback: createFallbackSvg('名畫繪畫', '#b91c1c', '#ef4444') }
    ];

    // GLOBAL STATE
    let selectedImageSrc = null;
    let puzzleImage = new Image();
    let soundEnabled = true;

    // Grid Parameters (Default 3x3 = 9 pieces)
    let GRID_SIZE = 3;
    let TOTAL_PIECES = 9;
    let GRID_GAP = 6;           // Physical spacing between puzzle cells
    let BOARD_PADDING = 20;     // Outer margin space on canvas so side tabs are never trimmed
    let pieceWidth = 0;
    let pieceHeight = 0;
    let canvasWidth = 0;
    let canvasHeight = 0;
    let tabSize = 0;

    // Piece data
    let pieces = [];
    let boardState = [];
    let lockedSlots = [];
    let edges = { horizontal: [], vertical: [] };

    // Game tracker
    let selectedIndex = null;
    let movesCount = 0;
    let timerInterval = null;
    let secondsElapsed = 0;
    let gameActive = false;

    // DOM Elements
    const selectionScreen = document.getElementById('selection-screen');
    const gameScreen = document.getElementById('game-screen');
    const presetsGrid = document.getElementById('presets-grid');
    const previewPanelContainer = document.getElementById('preview-panel-container');
    const selectedPreviewImg = document.getElementById('selected-preview-img');
    const btnStartGame = document.getElementById('btn-start-game');
    const imageInput = document.getElementById('image-input');
    const btnTriggerUpload = document.getElementById('btn-trigger-upload');
    const selectedDiffBadge = document.getElementById('selected-diff-badge');
    const difficultyButtons = document.querySelectorAll('.diff-btn');

    const puzzleCanvas = document.getElementById('puzzle-canvas');
    const ctx = puzzleCanvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper');

    const timerDisplay = document.getElementById('timer-display');
    const movesDisplay = document.getElementById('moves-display');
    const lockDisplay = document.getElementById('lock-display');
    const totalLockDisplay = document.getElementById('total-lock-display');
    const btnBackToSelect = document.getElementById('btn-back-to-select');
    const btnRestart = document.getElementById('btn-restart');
    const btnShowRef = document.getElementById('btn-show-ref');
    const referenceModal = document.getElementById('reference-modal');
    const referenceImgPreview = document.getElementById('reference-img-preview');
    const btnCloseRef = document.getElementById('btn-close-ref');

    const soundIcon = document.getElementById('sound-icon');
    const btnSound = document.getElementById('btn-sound');
    const victoryModal = document.getElementById('victory-modal');
    const winTime = document.getElementById('win-time');
    const winMoves = document.getElementById('win-moves');
    const btnPlayAgain = document.getElementById('btn-play-again');
    const btnChooseAnother = document.getElementById('btn-choose-another');
    const winFullImage = document.getElementById('win-full-image');
    const previewImgContainer = document.getElementById('preview-img-container');
    const refModalImgContainer = document.getElementById('ref-modal-img-container');
    const winImgContainer = document.getElementById('win-img-container');

    const lightboxModal = document.getElementById('lightbox-modal');
    const lightboxImg = document.getElementById('lightbox-img');
    const btnCloseLightbox = document.getElementById('btn-close-lightbox');
    const lightboxBgClose = document.getElementById('lightbox-bg-close');

    // WEB AUDIO API SOUND SYNTHESIS
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'select') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'swap') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'lock') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'win') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, idx) => {
            const noteOsc = audioCtx.createOscillator();
            const noteGain = audioCtx.createGain();
            noteOsc.connect(noteGain);
            noteGain.connect(audioCtx.destination);
            noteOsc.type = 'triangle';
            noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
            noteGain.gain.setValueAtTime(0.25, now + idx * 0.1);
            noteGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
            noteOsc.start(now + idx * 0.1);
            noteOsc.stop(now + idx * 0.1 + 0.25);
          });
        }
      } catch (err) {}
    }

    // LIGHTBOX CONTROLS
    function openLightbox(imgSrc) {
      if (!imgSrc) return;
      lightboxImg.src = imgSrc;
      lightboxModal.classList.remove('hidden');
      playSound('select');
    }

    function closeLightbox() {
      lightboxModal.classList.add('hidden');
    }

    // INITIALIZE PRESETS
    function initPresets() {
      presetsGrid.innerHTML = '';
      PRESET_IMAGES.forEach((preset) => {
        const item = document.createElement('div');
        item.className = 'preset-item relative aspect-square rounded-xl overflow-hidden cursor-pointer border-2 border-slate-200 hover:border-indigo-300 transition-all duration-200 shadow-sm';
        item.dataset.url = preset.url;
        item.innerHTML = `
          <img src="${preset.url}" alt="${preset.name}" class="w-full h-full object-cover" onerror="this.src='${preset.fallback}'">
          <div class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-slate-900/80 to-transparent p-1 text-center">
            <span class="text-[9px] font-bold text-white block truncate">${preset.name}</span>
          </div>
        `;

        item.addEventListener('click', () => {
          playSound('select');
          selectedImageSrc = preset.url;
          updateSelectedPreview();
          document.querySelectorAll('.preset-item').forEach(el => {
            el.className = 'preset-item relative aspect-square rounded-xl overflow-hidden cursor-pointer border-2 border-slate-200 hover:border-indigo-300 transition-all duration-200 shadow-sm';
          });
          item.className = 'preset-item relative aspect-square rounded-xl overflow-hidden cursor-pointer border-2 border-indigo-600 scale-[1.03] ring-2 ring-indigo-300 transition-all duration-200 shadow-sm';
        });

        presetsGrid.appendChild(item);
      });
    }

    // UPDATE PREVIEW AND TOGGLE START BUTTON
    function updateSelectedPreview() {
      if (selectedImageSrc) {
        selectedPreviewImg.src = selectedImageSrc;
        referenceImgPreview.src = selectedImageSrc;
        winFullImage.src = selectedImageSrc;

        // Show preview panel
        previewPanelContainer.classList.remove('hidden');

        // Enable Start Game Button
        btnStartGame.disabled = false;
        btnStartGame.className = 'w-full py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-sm rounded-xl shadow-md shadow-indigo-200 flex items-center justify-center gap-2 transition-all active:scale-95 cursor-pointer';
      } else {
        previewPanelContainer.classList.add('hidden');
        btnStartGame.disabled = true;
        btnStartGame.className = 'w-full py-3 bg-slate-300 text-slate-500 font-bold text-sm rounded-xl shadow-none flex items-center justify-center gap-2 transition-all cursor-not-allowed';
      }
    }

    // LOCAL PHOTO UPLOAD HANDLER
    btnTriggerUpload.addEventListener('click', () => {
      playSound('select');
      imageInput.click();
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          selectedImageSrc = event.target.result;
          updateSelectedPreview();
          document.querySelectorAll('.preset-item').forEach(el => {
            el.className = 'preset-item relative aspect-square rounded-xl overflow-hidden cursor-pointer border-2 border-slate-200 hover:border-indigo-300 transition-all duration-200 shadow-sm';
          });
          playSound('select');
        };
        reader.readAsDataURL(file);
      }
    });

    // DIFFICULTY SELECTION LOGIC (3x3 = 9格, 4x4 = 16格, 5x5 = 25格)
    difficultyButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        playSound('select');
        const grid = parseInt(btn.getAttribute('data-grid'));
        GRID_SIZE = grid;
        TOTAL_PIECES = grid * grid;

        difficultyButtons.forEach(b => {
          const isCurrent = b === btn;
          b.className = isCurrent 
            ? 'diff-btn py-1.5 px-2 bg-indigo-600 text-white rounded-xl text-xs font-bold border border-indigo-600 shadow-sm transition-all flex flex-col items-center'
            : 'diff-btn py-1.5 px-2 bg-slate-50 text-slate-700 hover:bg-slate-100 rounded-xl text-xs font-bold border border-slate-200 transition-all flex flex-col items-center';
          
          const labelSpan = b.querySelectorAll('span')[1];
          if (labelSpan) {
            labelSpan.className = isCurrent ? 'text-[10px] font-normal opacity-90' : 'text-[10px] text-slate-400 font-normal';
          }
        });

        const diffLabels = { 3: '簡單 (9格)', 4: '普通 (16格)', 5: '困難 (25格)' };
        selectedDiffBadge.innerHTML = `🧩 ${diffLabels[grid]}`;
        totalLockDisplay.textContent = TOTAL_PIECES;
      });
    });

    // GENERATE JIGSAW TAB & SOCKET EDGES DEFINITION
    function generateJigsawEdges() {
      edges.horizontal = [];
      edges.vertical = [];

      // Horizontal internal edges between (c) and (c+1)
      for (let r = 0; r < GRID_SIZE; r++) {
        edges.horizontal[r] = [];
        for (let c = 0; c < GRID_SIZE - 1; c++) {
          edges.horizontal[r][c] = Math.random() < 0.5 ? 1 : -1;
        }
      }

      // Vertical internal edges between (r) and (r+1)
      for (let r = 0; r < GRID_SIZE - 1; r++) {
        edges.vertical[r] = [];
        for (let c = 0; c < GRID_SIZE; c++) {
          edges.vertical[r][c] = Math.random() < 0.5 ? 1 : -1;
        }
      }
    }

    // DRAW COMPLEMENTARY JIGSAW PATH FOR A SPECIFIC PIECE IDENTITY
    function drawPiecePathByIdentity(ctxPath, piece, w, h, tSize) {
      const { row: r, col: c } = piece;

      const topTab = r > 0 ? -edges.vertical[r - 1][c] : 0;
      const rightTab = c < GRID_SIZE - 1 ? edges.horizontal[r][c] : 0;
      const bottomTab = r < GRID_SIZE - 1 ? edges.vertical[r][c] : 0;
      const leftTab = c > 0 ? -edges.horizontal[r][c - 1] : 0;

      ctxPath.beginPath();
      ctxPath.moveTo(0, 0);

      // 1. Top Edge
      if (topTab === 0) {
        ctxPath.lineTo(w, 0);
      } else {
        const dir = -topTab;
        ctxPath.lineTo(w * 0.35, 0);
        ctxPath.bezierCurveTo(w * 0.35, dir * tSize, w * 0.44, dir * tSize * 1.35, w * 0.5, dir * tSize * 1.35);
        ctxPath.bezierCurveTo(w * 0.56, dir * tSize * 1.35, w * 0.65, dir * tSize, w * 0.65, 0);
        ctxPath.lineTo(w, 0);
      }

      // 2. Right Edge
      if (rightTab === 0) {
        ctxPath.lineTo(w, h);
      } else {
        const dir = rightTab;
        ctxPath.lineTo(w, h * 0.35);
        ctxPath.bezierCurveTo(w + dir * tSize, h * 0.35, w + dir * tSize * 1.35, h * 0.44, w + dir * tSize * 1.35, h * 0.5);
        ctxPath.bezierCurveTo(w + dir * tSize * 1.35, h * 0.56, w + dir * tSize, h * 0.65, w, h * 0.65);
        ctxPath.lineTo(w, h);
      }

      // 3. Bottom Edge
      if (bottomTab === 0) {
        ctxPath.lineTo(0, h);
      } else {
        const dir = bottomTab;
        ctxPath.lineTo(w * 0.65, h);
        ctxPath.bezierCurveTo(w * 0.65, h + dir * tSize, w * 0.56, h + dir * tSize * 1.35, w * 0.5, h + dir * tSize * 1.35);
        ctxPath.bezierCurveTo(w * 0.44, h + dir * tSize * 1.35, w * 0.35, h + dir * tSize, w * 0.35, h);
        ctxPath.lineTo(0, h);
      }

      // 4. Left Edge
      if (leftTab === 0) {
        ctxPath.lineTo(0, 0);
      } else {
        const dir = -leftTab;
        ctxPath.lineTo(0, h * 0.65);
        ctxPath.bezierCurveTo(dir * tSize, h * 0.65, dir * tSize * 1.35, h * 0.56, dir * tSize * 1.35, h * 0.5);
        ctxPath.bezierCurveTo(dir * tSize * 1.35, h * 0.44, dir * tSize, h * 0.35, 0, h * 0.35);
        ctxPath.lineTo(0, 0);
      }

      ctxPath.closePath();
    }

    // HELPER TO GET PIECE CANVAS COORDINATES WITH BOARD PADDING AND GAP SPACING
    function getSlotPosition(r, c) {
      const x = BOARD_PADDING + c * pieceWidth + c * GRID_GAP;
      const y = BOARD_PADDING + r * pieceHeight + r * GRID_GAP;
      return { x, y };
    }

    // SETUP PUZZLE BOARD & CANVASES
    function setupPuzzle() {
      const wrapperW = canvasWrapper.clientWidth - 8;
      const wrapperH = canvasWrapper.clientHeight - 8;
      
      const maxW = Math.max(wrapperW, 200);
      const maxH = Math.max(wrapperH, 200);
      
      const imgAspect = puzzleImage.width / puzzleImage.height;
      if (maxW / maxH > imgAspect) {
        canvasHeight = maxH;
        canvasWidth = maxH * imgAspect;
      } else {
        canvasWidth = maxW;
        canvasHeight = maxW / imgAspect;
      }

      puzzleCanvas.width = canvasWidth;
      puzzleCanvas.height = canvasHeight;

      // BOARD_PADDING prevents side/outer tabs from being trimmed off canvas
      const innerW = canvasWidth - BOARD_PADDING * 2;
      const innerH = canvasHeight - BOARD_PADDING * 2;

      const availableW = innerW - (GRID_SIZE - 1) * GRID_GAP;
      const availableH = innerH - (GRID_SIZE - 1) * GRID_GAP;

      pieceWidth = availableW / GRID_SIZE;
      pieceHeight = availableH / GRID_SIZE;
      tabSize = Math.min(pieceWidth, pieceHeight) * 0.22;

      generateJigsawEdges();

      pieces = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const id = r * GRID_SIZE + c;
          const pieceObj = { id, row: r, col: c };

          const pCanvas = document.createElement('canvas');
          const margin = tabSize * 1.6;
          pCanvas.width = pieceWidth + margin * 2;
          pCanvas.height = pieceHeight + margin * 2;
          const pCtx = pCanvas.getContext('2d');

          pCtx.translate(margin, margin);
          drawPiecePathByIdentity(pCtx, pieceObj, pieceWidth, pieceHeight, tabSize);
          pCtx.clip();

          const scaleX = puzzleImage.width / availableW;
          const scaleY = puzzleImage.height / availableH;

          const srcX = c * pieceWidth * scaleX - margin * scaleX;
          const srcY = r * pieceHeight * scaleY - margin * scaleY;
          const srcW = (pieceWidth + margin * 2) * scaleX;
          const srcH = (pieceHeight + margin * 2) * scaleY;

          pCtx.drawImage(
            puzzleImage,
            srcX, srcY, srcW, srcH,
            -margin, -margin, pieceWidth + margin * 2, pieceHeight + margin * 2
          );

          pCtx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          pCtx.lineWidth = 2;
          pCtx.stroke();

          pieces.push({
            id: id,
            row: r,
            col: c,
            canvas: pCanvas,
            margin: margin
          });
        }
      }

      shufflePuzzle();
    }

    function shufflePuzzle() {
      let shuffled = [...Array(TOTAL_PIECES).keys()];
      let isSolved = true;

      while (isSolved) {
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        isSolved = shuffled.every((val, index) => val === index);
      }

      boardState = shuffled;
      lockedSlots = new Array(TOTAL_PIECES).fill(false);
      checkLocks();
      renderBoard();
    }

    function checkLocks() {
      let lockCount = 0;
      for (let slot = 0; slot < TOTAL_PIECES; slot++) {
        const pieceId = boardState[slot];
        if (pieceId === slot) {
          lockedSlots[slot] = true;
          lockCount++;
        } else {
          lockedSlots[slot] = false;
        }
      }
      lockDisplay.textContent = lockCount;
      return lockCount;
    }

    // RENDER CANVAS WITH PIECE SPACING AND DYNAMIC MOVING TABS
    function renderBoard() {
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      // Render grid cell background slots
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const { x, y } = getSlotPosition(r, c);
          const slotIndex = r * GRID_SIZE + c;

          ctx.fillStyle = (r + c) % 2 === 0 ? '#f8fafc' : '#e2e8f0';
          ctx.fillRect(x, y, pieceWidth, pieceHeight);

          if (lockedSlots[slotIndex]) {
            const pieceId = boardState[slotIndex];
            const piece = pieces[pieceId];
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = 'rgba(16, 185, 129, 0.12)';
            drawPiecePathByIdentity(ctx, piece, pieceWidth, pieceHeight, tabSize);
            ctx.fill();
            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();
          }
        }
      }

      // Render Puzzle Pieces dynamically moving with their tabs & image pixels
      for (let slot = 0; slot < TOTAL_PIECES; slot++) {
        const pieceId = boardState[slot];
        if (pieceId === null) continue;

        const piece = pieces[pieceId];
        const r = Math.floor(slot / GRID_SIZE);
        const c = slot % GRID_SIZE;
        const { x: slotX, y: slotY } = getSlotPosition(r, c);
        const drawX = slotX - piece.margin;
        const drawY = slotY - piece.margin;

        if (selectedIndex === slot) {
          ctx.save();
          ctx.translate(slotX, slotY);
          ctx.fillStyle = 'rgba(99, 102, 241, 0.3)';
          drawPiecePathByIdentity(ctx, piece, pieceWidth, pieceHeight, tabSize);
          ctx.fill();
          ctx.strokeStyle = '#6366f1';
          ctx.lineWidth = 3.5;
          ctx.stroke();
          ctx.restore();
        }

        ctx.drawImage(piece.canvas, drawX, drawY);

        if (lockedSlots[slot]) {
          const badgeX = slotX + pieceWidth - 10;
          const badgeY = slotY + 10;
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.arc(badgeX, badgeY, 4.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function getSlotFromCoords(clientX, clientY) {
      const rect = puzzleCanvas.getBoundingClientRect();
      const scaleX = canvasWidth / rect.width;
      const scaleY = canvasHeight / rect.height;

      const touchX = (clientX - rect.left) * scaleX;
      const touchY = (clientY - rect.top) * scaleY;

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const { x, y } = getSlotPosition(r, c);
          if (touchX >= x - GRID_GAP / 2 && touchX <= x + pieceWidth + GRID_GAP / 2 &&
              touchY >= y - GRID_GAP / 2 && touchY <= y + pieceHeight + GRID_GAP / 2) {
            return r * GRID_SIZE + c;
          }
        }
      }

      return null;
    }

    function swapSlots(slotA, slotB) {
      if (slotA === slotB || slotA === null || slotB === null) return;
      if (lockedSlots[slotA] && lockedSlots[slotB]) return;

      const temp = boardState[slotA];
      boardState[slotA] = boardState[slotB];
      boardState[slotB] = temp;

      movesCount++;
      movesDisplay.textContent = movesCount;

      const prevLocks = lockedSlots.filter(Boolean).length;
      const newLocks = checkLocks();

      if (newLocks > prevLocks) {
        playSound('lock');
      } else {
        playSound('swap');
      }

      renderBoard();

      if (newLocks === TOTAL_PIECES) {
        triggerVictory();
      }
    }

    // CLICK & POINTER EVENTS
    puzzleCanvas.addEventListener('click', (e) => {
      if (!gameActive) return;
      const clickedSlot = getSlotFromCoords(e.clientX, e.clientY);
      if (clickedSlot === null) return;

      if (selectedIndex === null) {
        if (lockedSlots[clickedSlot]) return;
        selectedIndex = clickedSlot;
        playSound('select');
        renderBoard();
      } else {
        const targetSlot = clickedSlot;
        const sourceSlot = selectedIndex;
        selectedIndex = null;
        swapSlots(sourceSlot, targetSlot);
      }
    });

    let isDragging = false;
    let dragStartSlot = null;

    puzzleCanvas.addEventListener('pointerdown', (e) => {
      if (!gameActive) return;
      const slot = getSlotFromCoords(e.clientX, e.clientY);
      if (slot !== null && !lockedSlots[slot]) {
        isDragging = true;
        dragStartSlot = slot;
      }
    });

    puzzleCanvas.addEventListener('pointerup', (e) => {
      if (!gameActive || !isDragging) return;
      const dragEndSlot = getSlotFromCoords(e.clientX, e.clientY);
      if (dragEndSlot !== null && dragEndSlot !== dragStartSlot) {
        selectedIndex = null;
        swapSlots(dragStartSlot, dragEndSlot);
      }
      isDragging = false;
      dragStartSlot = null;
    });

    // TIMER
    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      timerDisplay.textContent = '00:00';
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        timerDisplay.textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // VICTORY
    function triggerVictory() {
      gameActive = false;
      stopTimer();
      playSound('win');

      winTime.textContent = timerDisplay.textContent;
      winMoves.textContent = `${movesCount} 步`;

      // Full picture reveal on canvas inside inner board region
      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      const innerW = canvasWidth - BOARD_PADDING * 2;
      const innerH = canvasHeight - BOARD_PADDING * 2;
      ctx.drawImage(puzzleImage, BOARD_PADDING, BOARD_PADDING, innerW, innerH);

      confetti({
        particleCount: 90,
        spread: 70,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        victoryModal.classList.remove('hidden');
      }, 500);
    }

    // START GAME
    btnStartGame.addEventListener('click', () => {
      if (!selectedImageSrc) return;

      btnStartGame.disabled = true;
      btnStartGame.innerHTML = `載入圖片中...`;
      totalLockDisplay.textContent = TOTAL_PIECES;

      puzzleImage = new Image();
      puzzleImage.crossOrigin = 'anonymous';
      puzzleImage.src = selectedImageSrc;

      puzzleImage.onload = () => {
        btnStartGame.disabled = false;
        btnStartGame.innerHTML = `<span>開始拼圖遊戲</span> ▶`;

        selectionScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');

        movesCount = 0;
        movesDisplay.textContent = '0';
        selectedIndex = null;
        gameActive = true;

        setupPuzzle();
        startTimer();
      };

      puzzleImage.onerror = () => {
        btnStartGame.disabled = false;
        btnStartGame.innerHTML = `<span>開始拼圖遊戲</span> ▶`;
        alert('載入圖片失敗，請嘗試選擇其他圖片！');
      };
    });

    // NAVIGATION
    btnBackToSelect.addEventListener('click', () => {
      stopTimer();
      gameActive = false;
      gameScreen.classList.add('hidden');
      selectionScreen.classList.remove('hidden');
    });

    btnRestart.addEventListener('click', () => {
      movesCount = 0;
      movesDisplay.textContent = '0';
      selectedIndex = null;
      shufflePuzzle();
      startTimer();
    });

    btnShowRef.addEventListener('click', () => {
      playSound('select');
      referenceModal.classList.remove('hidden');
    });

    btnCloseRef.addEventListener('click', () => {
      referenceModal.classList.add('hidden');
    });

    btnPlayAgain.addEventListener('click', () => {
      victoryModal.classList.add('hidden');
      btnRestart.click();
      gameActive = true;
    });

    btnChooseAnother.addEventListener('click', () => {
      victoryModal.classList.add('hidden');
      btnBackToSelect.click();
    });

    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
    });

    // Lightbox Handlers
    previewImgContainer.addEventListener('click', () => openLightbox(selectedImageSrc));
    winImgContainer.addEventListener('click', () => openLightbox(selectedImageSrc));
    refModalImgContainer.addEventListener('click', () => {
      referenceModal.classList.add('hidden');
      openLightbox(selectedImageSrc);
    });
    selectedPreviewImg.addEventListener('click', () => openLightbox(selectedImageSrc));

    btnCloseLightbox.addEventListener('click', closeLightbox);
    lightboxBgClose.addEventListener('click', (e) => {
      if (e.target === lightboxBgClose) closeLightbox();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeLightbox();
        referenceModal.classList.add('hidden');
      }
    });

    window.addEventListener('resize', () => {
      if (gameActive && puzzleImage.complete) {
        setupPuzzle();
      }
    });

    window.onload = () => {
      initPresets();
      updateSelectedPreview();
    };
  </script>
</body>
