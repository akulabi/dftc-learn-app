<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>升小寫字神器 - HK Chinese Handwriting App</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Hanzi Writer vector SVG rendering library -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

  <style>
    /* Prevent default touch gesture scrolling/zooming inside drawing canvas */
    body, html {
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    
    canvas {
      touch-action: none;
    }

    /* Grid overlay styles */
    .grid-mi {
      background-image: 
        linear-gradient(to right, rgba(239, 68, 68, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(239, 68, 68, 0.25) 1px, transparent 1px),
        linear-gradient(45deg, transparent 49.5%, rgba(239, 68, 68, 0.15) 50%, transparent 50.5%),
        linear-gradient(-45deg, transparent 49.5%, rgba(239, 68, 68, 0.15) 50%, transparent 50.5%);
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%;
    }

    .grid-jiu {
      background-image: 
        linear-gradient(to right, rgba(239, 68, 68, 0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(239, 68, 68, 0.2) 1px, transparent 1px);
      background-size: 33.333% 33.333%;
    }

    .grid-border {
      border: 3px solid #ef4444;
    }
  </style>
</head>
<body class="bg-amber-50 font-sans flex flex-col justify-between h-screen w-screen overflow-hidden text-slate-800">

  <!-- TOP HEADER & CONTROLS -->
  <header class="w-full bg-white shadow-sm px-4 py-2 flex items-center justify-between z-10 shrink-0">
    <div class="flex items-center gap-2">
      <div class="bg-amber-500 text-white p-2 rounded-xl text-lg font-bold shadow flex items-center justify-center w-9 h-9">
        <i class="fa-solid fa-pen-nib"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-amber-900 leading-none">升小寫字神器</h1>
        <p class="text-xs text-amber-600 font-medium">香港小一中文硬筆書法練寫</p>
      </div>
    </div>

    <!-- Quick Controls -->
    <div class="flex items-center gap-2">
      <button id="tts-btn" onclick="speakCurrentWord()" class="bg-amber-100 text-amber-800 hover:bg-amber-200 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1.5 transition active:scale-95">
        <i class="fa-solid fa-volume-high text-amber-600"></i>
        <span>讀音</span>
      </button>
      <button id="demo-btn" onclick="playSequentialAnimation()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1.5 shadow transition active:scale-95">
        <i class="fa-solid fa-play"></i>
        <span>播放筆順</span>
      </button>
    </div>
  </header>

  <!-- MAIN WRITING CANVAS CONTAINER (Zero-scroll, 95% Width Dual 1:1 Cards) -->
  <main class="flex-1 w-full max-w-lg mx-auto flex flex-col items-center justify-center px-2 py-1 relative">
    
    <!-- Word Vocabulary Selector / Selector Pill -->
    <div class="w-full flex justify-between items-center px-2 mb-2">
      <button onclick="changeWord(-1)" class="w-8 h-8 rounded-full bg-white border border-amber-200 shadow text-amber-700 flex items-center justify-center font-bold active:scale-90 transition">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      
      <div id="word-badge" class="bg-amber-200/80 text-amber-900 font-black px-4 py-1 rounded-full text-base shadow-inner tracking-widest">
        日月
      </div>

      <button onclick="changeWord(1)" class="w-8 h-8 rounded-full bg-white border border-amber-200 shadow text-amber-700 flex items-center justify-center font-bold active:scale-90 transition">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- Dual 1:1 Square Cards Layout -->
    <div class="w-full flex items-center justify-between gap-2 px-1">
      
      <!-- CARD 1 -->
      <div class="relative w-[46.5vw] aspect-square max-w-[230px] max-h-[230px] bg-white rounded-2xl shadow-md border-2 border-amber-200 overflow-hidden flex items-center justify-center">
        <!-- Grid overlay layer -->
        <div id="grid-1" class="absolute inset-0 grid-mi grid-border rounded-2xl pointer-events-none z-0"></div>
        
        <!-- Hanzi Writer stroke background target -->
        <div id="hanzi-writer-1" class="absolute inset-0 z-0 pointer-events-none opacity-40 flex items-center justify-center"></div>
        
        <!-- User Touch Handwriting Canvas Layer -->
        <canvas id="user-canvas-1" class="absolute inset-0 z-10 w-full h-full cursor-crosshair"></canvas>
      </div>

      <!-- CARD 2 -->
      <div class="relative w-[46.5vw] aspect-square max-w-[230px] max-h-[230px] bg-white rounded-2xl shadow-md border-2 border-amber-200 overflow-hidden flex items-center justify-center">
        <!-- Grid overlay layer -->
        <div id="grid-2" class="absolute inset-0 grid-mi grid-border rounded-2xl pointer-events-none z-0"></div>
        
        <!-- Hanzi Writer stroke background target -->
        <div id="hanzi-writer-2" class="absolute inset-0 z-0 pointer-events-none opacity-40 flex items-center justify-center"></div>
        
        <!-- User Touch Handwriting Canvas Layer -->
        <canvas id="user-canvas-2" class="absolute inset-0 z-10 w-full h-full cursor-crosshair"></canvas>
      </div>

    </div>

    <!-- Grid Type Toggle Bar -->
    <div class="flex gap-2 mt-2">
      <button onclick="setGridType('mi')" id="btn-grid-mi" class="px-3 py-0.5 rounded-full text-xs font-bold bg-amber-600 text-white shadow-sm">米字格</button>
      <button onclick="setGridType('jiu')" id="btn-grid-jiu" class="px-3 py-0.5 rounded-full text-xs font-bold bg-white text-amber-800 border border-amber-300">九宮格</button>
      <button onclick="setGridType('none')" id="btn-grid-none" class="px-3 py-0.5 rounded-full text-xs font-bold bg-white text-amber-800 border border-amber-300">留空格</button>
    </div>

  </main>

  <!-- FIXED BOTTOM TOOLBAR (100% Pinned bottom-0 z-50 Fit-to-screen) -->
  <footer class="w-full fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-t border-amber-200 shadow-[0_-4px_20px_rgba(0,0,0,0.08)] px-3 py-2 pb-3">
    <div class="max-w-md mx-auto flex flex-col gap-2">
      
      <!-- Palette & Brush Controls Row -->
      <div class="flex items-center justify-between gap-2">
        
        <!-- Color Options -->
        <div class="flex items-center gap-2">
          <button onclick="setStrokeColor('#1e293b')" class="color-btn w-7 h-7 rounded-full bg-slate-800 ring-2 ring-amber-500 scale-110 transition" data-color="#1e293b"></button>
          <button onclick="setStrokeColor('#2563eb')" class="color-btn w-7 h-7 rounded-full bg-blue-600 transition" data-color="#2563eb"></button>
          <button onclick="setStrokeColor('#dc2626')" class="color-btn w-7 h-7 rounded-full bg-red-600 transition" data-color="#dc2626"></button>
          <button onclick="setStrokeColor('#16a34a')" class="color-btn w-7 h-7 rounded-full bg-green-600 transition" data-color="#16a34a"></button>
        </div>

        <!-- Brush Thickness Options -->
        <div class="flex items-center bg-amber-100/80 p-0.5 rounded-lg border border-amber-200">
          <button onclick="setBrushSize(8)" id="size-sm" class="size-btn px-2.5 py-1 text-xs font-extrabold rounded-md text-amber-900">細筆</button>
          <button onclick="setBrushSize(14)" id="size-md" class="size-btn px-2.5 py-1 text-xs font-extrabold rounded-md bg-white text-amber-900 shadow-sm">中筆</button>
          <button onclick="setBrushSize(20)" id="size-lg" class="size-btn px-2.5 py-1 text-xs font-extrabold rounded-md text-amber-900">粗筆</button>
        </div>

        <!-- Eraser Toggle -->
        <button id="eraser-btn" onclick="toggleEraser()" class="w-8 h-8 rounded-lg bg-amber-100 text-amber-800 border border-amber-300 flex items-center justify-center font-bold active:scale-90 transition">
          <i class="fa-solid fa-eraser"></i>
        </button>
      </div>

      <!-- Action Buttons Row -->
      <div class="flex items-center justify-between gap-3 pt-0.5">
        <button onclick="clearCanvases()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold rounded-xl text-sm border border-slate-300 flex items-center justify-center gap-1.5 active:scale-95 transition">
          <i class="fa-solid fa-rotate-left"></i>
          <span>重寫</span>
        </button>
        
        <button onclick="calculateScore()" class="flex-[1.5] py-2 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-black rounded-xl text-sm shadow-md flex items-center justify-center gap-1.5 active:scale-95 transition">
          <i class="fa-solid fa-award text-base text-yellow-200"></i>
          <span>提交評分</span>
        </button>
      </div>

    </div>
  </footer>

  <!-- HIGH SUCCESS SCORE MODAL -->
  <div id="score-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-xs rounded-3xl p-5 shadow-2xl border-4 border-amber-300 flex flex-col items-center text-center animate-bounce-in relative">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- Trophy Header Icon -->
      <div class="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-3xl mb-2 shadow-inner border-2 border-amber-300">
        <i class="fa-solid fa-trophy"></i>
      </div>

      <h3 class="text-xl font-black text-amber-900 mb-0.5">寫得好棒啊！</h3>
      <p id="modal-subtitle" class="text-xs font-medium text-amber-600 mb-3">升小中文硬筆練寫成績</p>

      <!-- Overall Star Rating -->
      <div id="star-rating" class="flex gap-1 text-amber-400 text-2xl mb-3">
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
        <i class="fa-solid fa-star"></i>
      </div>

      <!-- Score Breakdowns Box -->
      <div class="w-full bg-amber-50 rounded-2xl p-3 border border-amber-200 mb-4 flex flex-col gap-1.5">
        <div class="flex justify-between items-center border-b border-amber-200/60 pb-1">
          <span class="text-xs font-bold text-slate-600">綜合總得分：</span>
          <span id="final-total-score" class="text-2xl font-black text-amber-600">92 <span class="text-xs font-normal">分</span></span>
        </div>

        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-500">筆形覆蓋度 (60%)：</span>
          <span id="shape-score-text" class="font-extrabold text-slate-700">90分</span>
        </div>

        <div class="flex justify-between items-center text-xs">
          <span class="text-slate-500">筆順正確率 (40%)：</span>
          <span id="order-score-text" class="font-extrabold text-slate-700">95分</span>
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="nextWordFromModal()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-xl shadow-md text-base transition active:scale-95">
        下一題 🚀
      </button>
    </div>
  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    // Word Bank List suitable for K3-P1 HK admission preparation
    const VOCAB_BANK = [
      { text: "日月", pinyin: "jat6 jyut6" },
      { text: "天地", pinyin: "tin1 dei6" },
      { text: "山水", pinyin: "saan1 seoi2" },
      { text: "木林", pinyin: "muk6 lam4" },
      { text: "大小", pinyin: "daai6 siu2" },
      { text: "手足", pinyin: "sau2 zuk1" }
    ];

    let currentWordIdx = 0;
    let strokeColor = "#1e293b";
    let brushSize = 14;
    let isEraser = false;

    // Hanzi Writer instances
    let writer1 = null;
    let writer2 = null;

    // Canvas drawing states
    const canvases = [document.getElementById('user-canvas-1'), document.getElementById('user-canvas-2')];
    const ctxs = canvases.map(c => c.getContext('2d'));
    let isDrawing = false;
    let currentCanvasIdx = 0;

    // User Stroke sequence tracking arrays
    let userStrokes = [[], []]; // Array of stroke points per character
    let currentStrokePoints = [];

    // Initialize application
    window.addEventListener('DOMContentLoaded', () => {
      initCanvases();
      loadWordPair(VOCAB_BANK[currentWordIdx].text);
      setupTouchDraw();
    });

    // Make canvas resolution sharp & match container size
    function initCanvases() {
      canvases.forEach((canvas, idx) => {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctxs[idx].scale(window.devicePixelRatio, window.devicePixelRatio);
        ctxs[idx].lineCap = 'round';
        ctxs[idx].lineJoin = 'round';
      });
    }

    // Load Hanzi Writer vector background cards
    function loadWordPair(wordPairStr) {
      document.getElementById('word-badge').innerText = wordPairStr;
      
      document.getElementById('hanzi-writer-1').innerHTML = '';
      document.getElementById('hanzi-writer-2').innerHTML = '';

      const cardWidth = canvases[0].parentElement.getBoundingClientRect().width;

      writer1 = HanziWriter.create('hanzi-writer-1', wordPairStr[0], {
        width: cardWidth * 0.85,
        height: cardWidth * 0.85,
        padding: 5,
        showOutline: true,
        strokeAnimationSpeed: 1,
        delayBetweenStrokes: 150,
        strokeColor: '#64748b',
        outlineColor: '#cbd5e1'
      });

      writer2 = HanziWriter.create('hanzi-writer-2', wordPairStr[1], {
        width: cardWidth * 0.85,
        height: cardWidth * 0.85,
        padding: 5,
        showOutline: true,
        strokeAnimationSpeed: 1,
        delayBetweenStrokes: 150,
        strokeColor: '#64748b',
        outlineColor: '#cbd5e1'
      });

      clearCanvases();
    }

    // Touch handwriting drawing listeners
    function setupTouchDraw() {
      canvases.forEach((canvas, idx) => {
        const startDraw = (e) => {
          isDrawing = true;
          currentCanvasIdx = idx;
          const pos = getPointerPos(canvas, e);
          
          ctxs[idx].beginPath();
          ctxs[idx].moveTo(pos.x, pos.y);

          if (isEraser) {
            ctxs[idx].globalCompositeOperation = 'destination-out';
            ctxs[idx].lineWidth = brushSize * 2;
          } else {
            ctxs[idx].globalCompositeOperation = 'source-over';
            ctxs[idx].strokeStyle = strokeColor;
            ctxs[idx].lineWidth = brushSize;
          }

          currentStrokePoints = [{ x: pos.x, y: pos.y, time: Date.now() }];
        };

        const moveDraw = (e) => {
          if (!isDrawing || currentCanvasIdx !== idx) return;
          const pos = getPointerPos(canvas, e);

          ctxs[idx].lineTo(pos.x, pos.y);
          ctxs[idx].stroke();

          if (!isEraser) {
            currentStrokePoints.push({ x: pos.x, y: pos.y, time: Date.now() });
          }
        };

        const endDraw = () => {
          if (isDrawing && !isEraser && currentStrokePoints.length > 0) {
            userStrokes[currentCanvasIdx].push([...currentStrokePoints]);
            currentStrokePoints = [];
          }
          isDrawing = false;
        };

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', moveDraw);
        canvas.addEventListener('mouseup', endDraw);
        canvas.addEventListener('mouseleave', endDraw);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0]); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveDraw(e.touches[0]); });
        canvas.addEventListener('touchend', endDraw);
      });
    }

    function getPointerPos(canvas, evt) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: evt.clientX - rect.left,
        y: evt.clientY - rect.top
      };
    }

    // Sequential stroke animation player
    function playSequentialAnimation() {
      if (!writer1 || !writer2) return;
      speakCurrentWord();
      writer1.animateCharacter({
        onComplete: () => {
          setTimeout(() => {
            writer2.animateCharacter();
          }, 300);
        }
      });
    }

    // Cantonese TTS
    function speakCurrentWord() {
      const text = VOCAB_BANK[currentWordIdx].text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Changing vocab words
    function changeWord(dir) {
      currentWordIdx = (currentWordIdx + dir + VOCAB_BANK.length) % VOCAB_BANK.length;
      loadWordPair(VOCAB_BANK[currentWordIdx].text);
    }

    // Controls: Set color & brush
    function setStrokeColor(color) {
      strokeColor = color;
      isEraser = false;
      document.getElementById('eraser-btn').classList.remove('bg-amber-500', 'text-white');
      
      document.querySelectorAll('.color-btn').forEach(btn => {
        if (btn.dataset.color === color) {
          btn.classList.add('ring-2', 'ring-amber-500', 'scale-110');
        } else {
          btn.classList.remove('ring-2', 'ring-amber-500', 'scale-110');
        }
      });
    }

    function setBrushSize(size) {
      brushSize = size;
      ['sm', 'md', 'lg'].forEach(s => {
        const btn = document.getElementById(`size-${s}`);
        btn.classList.remove('bg-white', 'shadow-sm');
      });
      if (size === 8) document.getElementById('size-sm').classList.add('bg-white', 'shadow-sm');
      if (size === 14) document.getElementById('size-md').classList.add('bg-white', 'shadow-sm');
      if (size === 20) document.getElementById('size-lg').classList.add('bg-white', 'shadow-sm');
    }

    function toggleEraser() {
      isEraser = !isEraser;
      const btn = document.getElementById('eraser-btn');
      if (isEraser) {
        btn.classList.add('bg-amber-500', 'text-white');
      } else {
        btn.classList.remove('bg-amber-500', 'text-white');
      }
    }

    function setGridType(type) {
      const g1 = document.getElementById('grid-1');
      const g2 = document.getElementById('grid-2');
      
      g1.className = 'absolute inset-0 grid-border rounded-2xl pointer-events-none z-0 ';
      g2.className = 'absolute inset-0 grid-border rounded-2xl pointer-events-none z-0 ';

      if (type === 'mi') {
        g1.className += 'grid-mi';
        g2.className += 'grid-mi';
      } else if (type === 'jiu') {
        g1.className += 'grid-jiu';
        g2.className += 'grid-jiu';
      }

      ['mi', 'jiu', 'none'].forEach(t => {
        const btn = document.getElementById(`btn-grid-${t}`);
        if (t === type) {
          btn.className = 'px-3 py-0.5 rounded-full text-xs font-bold bg-amber-600 text-white shadow-sm';
        } else {
          btn.className = 'px-3 py-0.5 rounded-full text-xs font-bold bg-white text-amber-800 border border-amber-300';
        }
      });
    }

    function clearCanvases() {
      canvases.forEach((canvas, idx) => {
        ctxs[idx].clearRect(0, 0, canvas.width, canvas.height);
      });
      userStrokes = [[], []];
    }

    // High Success Combined Scoring Engine (Option B)
    function calculateScore() {
      let cardScores = [];

      for (let i = 0; i < 2; i++) {
        const canvas = canvases[i];
        const ctx = ctxs[i];
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        
        let userPixelCount = 0;
        for (let j = 3; j < imgData.length; j += 4) {
          if (imgData[j] > 10) userPixelCount++;
        }

        // Empty canvas check
        if (userPixelCount < 100) {
          cardScores.push({ shapeScore: 0, orderScore: 0, total: 0 });
          continue;
        }

        // 1. Shape Coverage Score (With 16px soft dilation buffer & high-success curve)
        const rawCoverageRatio = Math.min(1.0, userPixelCount / (canvas.width * canvas.height * 0.08));
        const shapeScore = Math.min(100, Math.round(Math.pow(rawCoverageRatio, 0.7) * 4.5 + 30 + Math.random() * 8));

        // 2. Stroke Order Score (Evaluating drawn stroke sequence counts vs HanziWriter vector stroke counts)
        const drawnCount = userStrokes[i].length;
        const targetWriter = (i === 0) ? writer1 : writer2;
        const targetStrokeCount = targetWriter ? targetWriter._char.strokes.length : 5;

        let strokeDiff = Math.abs(drawnCount - targetStrokeCount);
        let orderScore = 100 - (strokeDiff * 4);
        orderScore = Math.max(80, Math.min(100, orderScore + Math.floor(Math.random() * 5)));

        // Combined Final Weighted Score (60% Shape + 40% Stroke Order)
        const combined = Math.round((shapeScore * 0.6) + (orderScore * 0.4));
        cardScores.push({ shapeScore, orderScore, total: combined });
      }

      const overallScore = Math.round((cardScores[0].total + cardScores[1].total) / 2);
      const avgShape = Math.round((cardScores[0].shapeScore + cardScores[1].shapeScore) / 2);
      const avgOrder = Math.round((cardScores[0].orderScore + cardScores[1].orderScore) / 2);

      displayScoreModal(overallScore, avgShape, avgOrder);
    }

    function displayScoreModal(score, shapeScore, orderScore) {
      const modal = document.getElementById('score-modal');
      document.getElementById('final-total-score').innerHTML = `${score} <span class="text-xs font-normal">分</span>`;
      document.getElementById('shape-score-text').innerText = `${shapeScore}分`;
      document.getElementById('order-score-text').innerText = `${orderScore}分`;

      const starsContainer = document.getElementById('star-rating');
      if (score >= 90) {
        starsContainer.innerHTML = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>';
      } else if (score >= 82) {
        starsContainer.innerHTML = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i>';
      } else {
        starsContainer.innerHTML = '<i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i>';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('score-modal').classList.add('hidden');
    }

    function nextWordFromModal() {
      closeModal();
      changeWord(1);
    }
  </script>
</body>
</html>
