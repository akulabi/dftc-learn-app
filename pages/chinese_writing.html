<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>升小寫字神器 - K3/P1 繁體漢字筆順練寫</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Hanzi Writer -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 九宮格 / 米字格 輔助線 */
    .grid-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    
    .grid-nine {
      background-image: 
        linear-gradient(to right, rgba(239, 68, 68, 0.2) 1px, transparent 1px),
        linear-gradient(to right, rgba(239, 68, 68, 0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(239, 68, 68, 0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(239, 68, 68, 0.2) 1px, transparent 1px);
      background-size: 33.333% 100%, 66.666% 100%, 100% 33.333%, 100% 66.666%;
      background-repeat: no-repeat;
    }

    .grid-cross {
      background-image: 
        linear-gradient(to right, rgba(239, 68, 68, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(239, 68, 68, 0.25) 1px, transparent 1px);
      background-size: 50% 100%, 100% 50%;
      background-repeat: no-repeat;
    }

    /* 隱藏原生 Canvas (僅供背後計分計算用) */
    .hidden-canvas {
      display: none;
    }

    /* 動態彈出獎勵特效 */
    @keyframes rewardPop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-reward {
      animation: rewardPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-amber-50 h-screen w-screen overflow-hidden flex flex-col justify-between pb-16">

  <!-- 頂欄：標題與字帖設定 -->
  <header class="w-full bg-amber-400 px-3 py-2 shadow-sm flex justify-between items-center z-20">
    <div class="flex items-center space-x-2">
      <span class="text-xl">✏️</span>
      <h1 class="font-bold text-amber-900 text-base md:text-lg tracking-wide">升小寫字神器</h1>
    </div>

    <!-- 字帖詞語切換與朗讀 -->
    <div class="flex items-center space-x-2">
      <select id="word-selector" class="bg-white border-2 border-amber-300 text-amber-900 font-bold rounded-lg px-2 py-1 text-sm focus:outline-none shadow-inner">
        <option value="大小">大小</option>
        <option value="日月">日月</option>
        <option value="天地">天地</option>
        <option value="人口">人口</option>
        <option value="手足">手足</option>
        <option value="山水">山水</option>
      </select>

      <button id="btn-tts" class="bg-amber-600 hover:bg-amber-700 text-white rounded-lg px-2.5 py-1 text-xs font-bold flex items-center gap-1 shadow active:scale-95 transition">
        <i class="fa-solid fa-volume-high"></i>
        <span>讀音</span>
      </button>

      <button id="btn-animate" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-2.5 py-1 text-xs font-bold flex items-center gap-1 shadow active:scale-95 transition">
        <i class="fa-solid fa-play"></i>
        <span>筆順</span>
      </button>
    </div>
  </header>

  <!-- 中間主區域：1:1 雙字帖卡片（佔約 95% 螢幕寬度） -->
  <main class="flex-1 flex flex-col justify-center items-center px-2 py-1 relative">
    
    <!-- 格線風格選擇器 -->
    <div class="flex justify-center space-x-4 mb-2">
      <label class="inline-flex items-center cursor-pointer text-xs font-bold text-amber-800">
        <input type="radio" name="gridStyle" value="nine" checked class="form-radio text-amber-600 focus:ring-amber-500">
        <span class="ml-1">九宮格</span>
      </label>
      <label class="inline-flex items-center cursor-pointer text-xs font-bold text-amber-800">
        <input type="radio" name="gridStyle" value="cross" class="form-radio text-amber-600 focus:ring-amber-500">
        <span class="ml-1">米字格</span>
      </label>
      <label class="inline-flex items-center cursor-pointer text-xs font-bold text-amber-800">
        <input type="radio" name="gridStyle" value="none" class="form-radio text-amber-600 focus:ring-amber-500">
        <span class="ml-1">留白</span>
      </label>
    </div>

    <!-- 雙字帖容器 -->
    <div class="w-full flex justify-center items-center gap-2 max-w-lg">
      
      <!-- 字帖一 -->
      <div class="relative w-[46.5vw] max-w-[240px] aspect-square bg-white rounded-xl border-4 border-amber-300 shadow-md overflow-hidden flex justify-center items-center">
        <div id="grid-overlay-1" class="grid-overlay grid-nine"></div>
        <!-- HanziWriter 底圖渲染區 -->
        <div id="writer-target-1" class="absolute inset-0 flex justify-center items-center pointer-events-none"></div>
        <!-- 描紅寫字 Canvas -->
        <canvas id="draw-canvas-1" class="absolute inset-0 z-20 touch-none cursor-crosshair"></canvas>
        <span class="absolute top-1 left-2 text-[10px] text-amber-400 font-bold z-30">一</span>
      </div>

      <!-- 字帖二 -->
      <div class="relative w-[46.5vw] max-w-[240px] aspect-square bg-white rounded-xl border-4 border-amber-300 shadow-md overflow-hidden flex justify-center items-center">
        <div id="grid-overlay-2" class="grid-overlay grid-nine"></div>
        <!-- HanziWriter 底圖渲染區 -->
        <div id="writer-target-2" class="absolute inset-0 flex justify-center items-center pointer-events-none"></div>
        <!-- 描紅寫字 Canvas -->
        <canvas id="draw-canvas-2" class="absolute inset-0 z-20 touch-none cursor-crosshair"></canvas>
        <span class="absolute top-1 left-2 text-[10px] text-amber-400 font-bold z-30">二</span>
      </div>

    </div>
  </main>

  <!-- 底部固定工具列 (Fixed Bottom Bar: 100% 可見，零滾動) -->
  <footer class="w-full bg-white/95 backdrop-blur border-t-2 border-amber-200 px-3 py-2 fixed bottom-0 left-0 right-0 z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-1">
      
      <!-- 粗細選擇 -->
      <div class="flex items-center bg-amber-50 p-1 rounded-lg border border-amber-200 space-x-1">
        <button id="size-thin" class="w-7 h-7 rounded-md flex justify-center items-center hover:bg-amber-200 text-amber-900 transition">
          <div class="w-1.5 h-1.5 bg-current rounded-full"></div>
        </button>
        <button id="size-medium" class="w-7 h-7 rounded-md bg-amber-300 flex justify-center items-center text-amber-900 font-bold shadow-sm transition">
          <div class="w-3 h-3 bg-current rounded-full"></div>
        </button>
        <button id="size-thick" class="w-7 h-7 rounded-md flex justify-center items-center hover:bg-amber-200 text-amber-900 transition">
          <div class="w-4.5 h-4.5 bg-current rounded-full"></div>
        </button>
      </div>

      <!-- 顏色與橡皮擦 -->
      <div class="flex items-center space-x-1.5">
        <button id="color-black" class="w-7 h-7 rounded-full bg-slate-900 border-2 border-white ring-2 ring-slate-900 shadow-sm active:scale-90 transition"></button>
        <button id="color-blue" class="w-7 h-7 rounded-full bg-blue-600 border-2 border-white ring-2 ring-transparent shadow-sm active:scale-90 transition"></button>
        <button id="color-red" class="w-7 h-7 rounded-full bg-rose-600 border-2 border-white ring-2 ring-transparent shadow-sm active:scale-90 transition"></button>
        
        <!-- 橡皮擦按鈕 -->
        <button id="btn-eraser" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 flex justify-center items-center border border-slate-300 shadow-sm active:scale-95 transition">
          <i class="fa-solid fa-eraser text-xs"></i>
        </button>
      </div>

      <!-- 清除重寫 & 評分提交按鈕 -->
      <div class="flex items-center space-x-1.5">
        <button id="btn-clear" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-3 py-1.5 rounded-lg text-xs border border-amber-300 shadow-sm active:scale-95 transition flex items-center gap-1">
          <i class="fa-solid fa-rotate-left"></i>
          <span>重寫</span>
        </button>

        <button id="btn-submit" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-4 py-1.5 rounded-lg text-xs shadow-md active:scale-95 transition flex items-center gap-1">
          <i class="fa-solid fa-check"></i>
          <span>提交評分</span>
        </button>
      </div>

    </div>
  </footer>

  <!-- 分數與讚賞彈出燈箱 (Modal) -->
  <div id="score-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex justify-center items-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl border-4 border-amber-300 animate-reward">
      <div class="text-5xl mb-2" id="modal-emoji">🌟</div>
      <h2 id="modal-title" class="text-2xl font-extrabold text-amber-900 mb-1">寫得太棒了！</h2>
      <p id="modal-subtitle" class="text-xs text-slate-500 mb-4">繼續保持，字跡越來越漂亮囉！</p>
      
      <!-- 雙字分數 -->
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="bg-amber-50 p-3 rounded-xl border border-amber-200">
          <span class="block text-xs font-bold text-amber-700 mb-1" id="modal-word1-label">「大」</span>
          <span class="text-3xl font-black text-amber-600" id="modal-word1-score">92</span>
          <span class="text-xs text-amber-500">分</span>
        </div>
        <div class="bg-amber-50 p-3 rounded-xl border border-amber-200">
          <span class="block text-xs font-bold text-amber-700 mb-1" id="modal-word2-label">「小」</span>
          <span class="text-3xl font-black text-amber-600" id="modal-word2-score">88</span>
          <span class="text-xs text-amber-500">分</span>
        </div>
      </div>

      <!-- 總分 -->
      <div class="mb-6">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-1">平均得分</span>
        <div class="inline-flex items-baseline gap-1">
          <span class="text-5xl font-black text-emerald-500" id="modal-avg-score">90</span>
          <span class="text-sm font-bold text-emerald-600">/ 100</span>
        </div>
      </div>

      <button id="btn-modal-close" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 font-extrabold py-3 rounded-xl text-base shadow-lg active:scale-95 transition">
        下一題 🚀
      </button>
    </div>
  </div>

  <!-- JavaScript 核心邏輯 -->
  <script>
    // 全局狀態與參數
    let currentWord = "大小";
    let writer1 = null, writer2 = null;
    let strokeWidth = 14;
    let strokeColor = '#0f172a'; // slate-900
    let isEraser = false;

    // Canvas 與 Context
    const canvas1 = document.getElementById('draw-canvas-1');
    const canvas2 = document.getElementById('draw-canvas-2');
    const ctx1 = canvas1.getContext('2d');
    const ctx2 = canvas2.getContext('2d');

    // 初始化畫布尺寸
    function resizeCanvases() {
      [canvas1, canvas2].forEach(c => {
        const rect = c.parentElement.getBoundingClientRect();
        c.width = rect.width;
        c.height = rect.height;
      });
    }

    // 初始化 HanziWriter
    function initWriters(word) {
      document.getElementById('writer-target-1').innerHTML = '';
      document.getElementById('writer-target-2').innerHTML = '';

      const char1 = word[0] || '大';
      const char2 = word[1] || '小';

      const options = {
        width: 180,
        height: 180,
        padding: 10,
        showOutline: true,
        strokeColor: '#334155', // 筆劃顏色
        outlineColor: '#cbd5e1', // 底字灰邊
        drawingWidth: 20
      };

      writer1 = HanziWriter.create('writer-target-1', char1, options);
      writer2 = HanziWriter.create('writer-target-2', char2, options);
    }

    // 筆劃繪製事件綁定
    function bindDrawingEvents(canvas, ctx) {
      let isDrawing = false;
      let lastX = 0, lastY = 0;

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - rect.left,
          y: clientY - rect.top
        };
      }

      function startDraw(e) {
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
      }

      function moveDraw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        if (isEraser) {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = strokeWidth * 2;
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = strokeWidth;
        }

        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDraw() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', startDraw);
      canvas.addEventListener('mousemove', moveDraw);
      canvas.addEventListener('mouseup', stopDraw);
      canvas.addEventListener('mouseleave', stopDraw);

      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', stopDraw);
    }

    // 清空畫布
    function clearCanvases() {
      ctx1.clearRect(0, 0, canvas1.width, canvas1.height);
      ctx2.clearRect(0, 0, canvas2.width, canvas2.height);
    }

    // 順序播放筆順動畫
    function playSequentialAnimation() {
      if (!writer1 || !writer2) return;
      speakCantonese(currentWord);
      writer1.animateCharacter({
        onComplete: function() {
          setTimeout(() => {
            writer2.animateCharacter();
          }, 300);
        }
      });
    }

    // 廣東話語音朗讀 (zh-HK)
    function speakCantonese(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-HK';
        utterance.rate = 0.85; // 稍微放慢語速適合幼童
        window.speechSynthesis.speak(utterance);
      }
    }

    // -------------------------------------------------------------
    // 🌟 高成就感計分演算法 (+12px Dilation Buffer & Score*0.75+25)
    // -------------------------------------------------------------
    function calculateKidFriendlyScore(userCanvas, writerInstance) {
      const w = userCanvas.width;
      const h = userCanvas.height;

      // 檢查用戶是否完全沒寫
      const userImgData = userCanvas.getContext('2d').getImageData(0, 0, w, h);
      let userPixelCount = 0;
      for (let i = 3; i < userImgData.data.length; i += 4) {
        if (userImgData.data[i] > 20) userPixelCount++;
      }
      if (userPixelCount < 50) return 0; // 空白沒寫返回 0 分

      // 1. 生成底字 Template Pixel Data
      const tCanvas = document.createElement('canvas');
      tCanvas.width = w;
      tCanvas.height = h;
      const tCtx = tCanvas.getContext('2d');
      tCtx.fillStyle = '#000000';

      // 簡易繪製標準字體作為比較基底
      tCtx.font = `bold ${Math.floor(h * 0.75)}px sans-serif`;
      tCtx.textAlign = 'center';
      tCtx.textBaseline = 'middle';
      tCtx.fillText(writerInstance.character, w / 2, h / 2);

      const templateImgData = tCtx.getImageData(0, 0, w, h);

      // 2. 建立帶有 +12px Dilation (膨脹擴充) 的容錯 Array
      const bufferRadius = 12; // 12px 邊緣防手抖 buffer
      const dilatedTemplate = new Uint8Array(w * h);

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = (y * w + x) * 4;
          if (templateImgData.data[idx + 3] > 50) {
            // 將周圍 radius 範圍內都標記為有效覆蓋區
            for (let dy = -bufferRadius; dy <= bufferRadius; dy++) {
              for (let dx = -bufferRadius; dx <= bufferRadius; dx++) {
                const nx = x + dx;
                const ny = y + dy;
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                  dilatedTemplate[ny * w + nx] = 1;
                }
              }
            }
          }
        }
      }

      // 3. 計算改進版 Jaccard 指數 (重疊度)
      let intersection = 0;
      let union = 0;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const uIdx = (y * w + x) * 4;
          const isUserDrawn = userImgData.data[uIdx + 3] > 20;
          const isTemplateArea = dilatedTemplate[y * w + x] === 1;

          if (isUserDrawn && isTemplateArea) {
            intersection++;
          }
          if (isUserDrawn || isTemplateArea) {
            union++;
          }
        }
      }

      const rawJaccard = union > 0 ? (intersection / union) * 100 : 0;

      // 4. 高成就感保底換算公式：Raw * 0.75 + 25 (保底 80-92 分)
      let finalScore = Math.round(rawJaccard * 0.75 + 25);
      if (finalScore > 100) finalScore = 100;
      if (finalScore < 60 && userPixelCount > 200) finalScore = 75; // 只要有寫就給予鼓勵保底 75

      return finalScore;
    }

    // 評分提交處理
    function handleSubmitScores() {
      const score1 = calculateKidFriendlyScore(canvas1, writer1);
      const score2 = calculateKidFriendlyScore(canvas2, writer2);

      const avgScore = Math.round((score1 + score2) / 2);

      // 更新 Modal 內容
      document.getElementById('modal-word1-label').textContent = `「${currentWord[0]}」`;
      document.getElementById('modal-word2-label').textContent = `「${currentWord[1]}」`;
      document.getElementById('modal-word1-score').textContent = score1;
      document.getElementById('modal-word2-score').textContent = score2;
      document.getElementById('modal-avg-score').textContent = avgScore;

      const emoji = document.getElementById('modal-emoji');
      const title = document.getElementById('modal-title');
      const subtitle = document.getElementById('modal-subtitle');

      if (avgScore >= 90) {
        emoji.textContent = '🌟';
        title.textContent = '太完美了！天才小畫家！';
        subtitle.textContent = '字跡極度工整，繼續保持 100 分！';
        speakCantonese('太完美了！寫得太棒了！');
      } else if (avgScore >= 80) {
        emoji.textContent = '🎉';
        title.textContent = '寫得非常漂亮！';
        subtitle.textContent = '筆順與架構都非常標準喔！';
        speakCantonese('寫得非常漂亮！好棒！');
      } else {
        emoji.textContent = '💪';
        title.textContent = '加油！越來越進步了！';
        subtitle.textContent = '再試一次，一定可以拿到更高的分數！';
        speakCantonese('加油！再寫一次會更漂亮！');
      }

      document.getElementById('score-modal').classList.remove('hidden');
    }

    // 初始化與 UI 事件監聽
    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvases();
      initWriters(currentWord);

      bindDrawingEvents(canvas1, ctx1);
      bindDrawingEvents(canvas2, ctx2);

      // 字詞切換
      document.getElementById('word-selector').addEventListener('change', (e) => {
        currentWord = e.target.value;
        initWriters(currentWord);
        clearCanvases();
        speakCantonese(currentWord);
      });

      // 工具列：筆劃粗細
      document.getElementById('size-thin').addEventListener('click', () => { strokeWidth = 8; });
      document.getElementById('size-medium').addEventListener('click', () => { strokeWidth = 14; });
      document.getElementById('size-thick').addEventListener('click', () => { strokeWidth = 22; });

      // 工具列：顏色
      document.getElementById('color-black').addEventListener('click', () => { strokeColor = '#0f172a'; isEraser = false; });
      document.getElementById('color-blue').addEventListener('click', () => { strokeColor = '#2563eb'; isEraser = false; });
      document.getElementById('color-red').addEventListener('click', () => { strokeColor = '#e11d48'; isEraser = false; });
      
      // 橡皮擦
      document.getElementById('btn-eraser').addEventListener('click', () => { isEraser = true; });

      // 按鈕功能
      document.getElementById('btn-clear').addEventListener('click', clearCanvases);
      document.getElementById('btn-tts').addEventListener('click', () => speakCantonese(currentWord));
      document.getElementById('btn-animate').addEventListener('click', playSequentialAnimation);
      document.getElementById('btn-submit').addEventListener('click', handleSubmitScores);

      // Modal 下一題按鈕
      document.getElementById('btn-modal-close').addEventListener('click', () => {
        document.getElementById('score-modal').classList.add('hidden');
        clearCanvases();
        
        // 切換至下一個詞語
        const selector = document.getElementById('word-selector');
        const nextIdx = (selector.selectedIndex + 1) % selector.options.length;
        selector.selectedIndex = nextIdx;
        currentWord = selector.value;
        initWriters(currentWord);
        speakCantonese(currentWord);
      });

      // 格線切換
      document.querySelectorAll('input[name="gridStyle"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          const style = e.target.value;
          const g1 = document.getElementById('grid-overlay-1');
          const g2 = document.getElementById('grid-overlay-2');

          [g1, g2].forEach(g => {
            g.className = 'grid-overlay';
            if (style === 'nine') g.classList.add('grid-nine');
            if (style === 'cross') g.classList.add('grid-cross');
          });
        });
      });
    });

    window.addEventListener('resize', resizeCanvases);
  </script>
</body>
</html>
