<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Fun & Learn Keyboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fredoka', cursive, sans-serif;
    }
    
    /* Ensure clean rendering of multi-byte & color emojis across platforms */
    .emoji-text {
      font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji', 'Android Emoji', 'EmojiOne Color', sans-serif;
      line-height: 1.1;
    }

    /* Custom Keyframe Animations */
    @keyframes popBounce {
      0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(10deg); }
      70% { transform: scale(0.9) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 10px 15px rgba(255, 182, 193, 0.4)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 20px 25px rgba(255, 105, 180, 0.6)); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      75% { transform: rotate(12deg); }
    }

    /* Swipeable Track Transition */
    .pages-track {
      display: flex;
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    .page-slide {
      min-width: 100%;
      flex-shrink: 0;
    }

    .animate-pop-bounce {
      animation: popBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .animate-pulse-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }

    .animate-wiggle {
      animation: wiggle 0.4s ease-in-out;
    }

    .animate-float {
      animation: floatBubble 4s ease-in-out infinite;
    }

    /* Speech bubble arrow */
    .speech-bubble-arrow::after {
      content: '';
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 14px 14px 0 14px;
      border-style: solid;
      border-color: #ffffff transparent transparent transparent;
    }

    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

      if (isMuted || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = selectedLang;
      utterance.rate = 0.9;
      utterance.pitch = 1.1;

      utterance.onstart = () => soundWaves.classList.remove('opacity-0');
      utterance.onend = () => soundWaves.classList.add('opacity-0');
      utterance.onerror = () => soundWaves.classList.add('opacity-0');

      const voices = window.speechSynthesis.getVoices();
      const matchVoice = voices.find(v => v.lang.toLowerCase().replace('_', '-') === selectedLang.toLowerCase().replace('_', '-'));
      if (matchVoice) utterance.voice = matchVoice;

      window.speechSynthesis.speak(utterance);
    }

    // Get localized emoji name
    function getEmojiName(emojiObj) {
      if (!emojiObj || !emojiObj.names) return 'Emoji';
      return emojiObj.names[selectedLang] || emojiObj.names['en-US'] || 'Emoji';
    }

    // --- Render Category Tabs ---
    function renderTabs() {
      categoryTabs.innerHTML = '';
      EMOJI_CATEGORIES.forEach(cat => {
        const isActive = cat.id === activeCategory;
        const btn = document.createElement('button');
        btn.className = `px-3 py-1 rounded-xl font-semibold text-xs flex items-center gap-1.5 whitespace-nowrap transition-all duration-200 ${
          isActive 
            ? 'bg-gradient-to-r from-purple-500 to-indigo-500 text-white shadow-sm scale-105' 
            : 'bg-slate-100 text-slate-600 hover:bg-slate-200 hover:text-slate-800'
        }`;
        btn.innerHTML = `<span>${cat.icon}</span> <span>${cat.name}</span>`;
        btn.addEventListener('click', () => {
          activeCategory = cat.id;
          searchInput.value = '';
          clearSearchBtn.classList.add('hidden');
          currentPageIndex = 0;
          renderTabs();
          renderPaginatedKeyboard();
        });
        categoryTabs.appendChild(btn);
      });
    }

    // --- Paginated Keyboard Rendering & Calculation ---
    function renderPaginatedKeyboard(filterQuery = '') {
      pagesTrack.innerHTML = '';
      let listToRender = [];

      if (filterQuery.trim() !== '') {
        const query = filterQuery.toLowerCase();
        EMOJI_CATEGORIES.forEach(cat => {
          cat.emojis.forEach(item => {
            const name = getEmojiName(item).toLowerCase();
            if (name.includes(query) || item.char.includes(query)) {
              listToRender.push(item);
            }
          });
        });
      } else {
        const cat = EMOJI_CATEGORIES.find(c => c.id === activeCategory);
        if (cat) listToRender = cat.emojis;
      }

      // Calculate total page count
      totalPages = Math.max(1, Math.ceil(listToRender.length / ITEMS_PER_PAGE));
      if (currentPageIndex >= totalPages) currentPageIndex = totalPages - 1;

      if (listToRender.length === 0) {
        pagesTrack.innerHTML = `
          <div class="page-slide w-full py-6 text-center text-slate-400 font-medium text-xs">
            No emojis found for "${filterQuery}" 🔍
          </div>
        `;
        renderPaginationDots();
        updatePagePosition();
        return;
      }

      // Build Slides for each page
      for (let p = 0; p < totalPages; p++) {
        const pageItems = listToRender.slice(p * ITEMS_PER_PAGE, (p + 1) * ITEMS_PER_PAGE);
        const slideEl = document.createElement('div');
        slideEl.className = 'page-slide px-1';

        const gridEl = document.createElement('div');
        gridEl.className = 'grid grid-cols-6 gap-2';

        pageItems.forEach(item => {
          const btn = document.createElement('button');
          btn.className = 'emoji-text aspect-square flex items-center justify-center text-2xl sm:text-3xl bg-slate-50 hover:bg-purple-100 rounded-xl border border-slate-200 hover:border-purple-300 shadow-sm hover:shadow active:scale-90 transition-all cursor-pointer select-none';
          btn.textContent = item.char;
          btn.title = getEmojiName(item);

          btn.addEventListener('click', (e) => {
            if (isDragging) return;
            selectEmoji(item.char, getEmojiName(item));
          });

          gridEl.appendChild(btn);
        });

        slideEl.appendChild(gridEl);
        pagesTrack.appendChild(slideEl);
      }

      renderPaginationDots();
      updatePagePosition();
    }

    // Update Pagination Dots UI
    function renderPaginationDots() {
      paginationDots.innerHTML = '';
      if (totalPages <= 1) return;

      for (let i = 0; i < totalPages; i++) {
        const dot = document.createElement('button');
        dot.className = `h-2 rounded-full transition-all duration-300 ${
          i === currentPageIndex 
            ? 'bg-purple-600 w-5' 
            : 'bg-slate-300 hover:bg-slate-400 w-2'
        }`;
        dot.title = `Page ${i + 1}`;
        dot.addEventListener('click', () => {
          currentPageIndex = i;
          updatePagePosition();
        });
        paginationDots.appendChild(dot);
      }
    }

    // Set Track Horizontal Position & Control Buttons State
    function updatePagePosition() {
      const width = swipeViewport.clientWidth;
      currentTranslate = -currentPageIndex * width;
      prevTranslate = currentTranslate;
      pagesTrack.style.transform = `translateX(${currentTranslate}px)`;

      // Arrow states
      prevPageBtn.disabled = currentPageIndex === 0;
      nextPageBtn.disabled = currentPageIndex === totalPages - 1;

      renderPaginationDots();
    }

    // Move to next / previous page
    function goToNextPage() {
      if (currentPageIndex < totalPages - 1) {
        currentPageIndex++;
        updatePagePosition();
      }
    }

    function goToPrevPage() {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        updatePagePosition();
      }
    }

    // --- Touch / Mouse Drag Swipe Gestures ---
    function touchStart(index) {
      return function(event) {
        isDragging = true;
        startX = getPositionX(event);
        pagesTrack.style.transition = 'none';
      }
    }

    function touchMove(event) {
      if (!isDragging) return;
      const currentPosition = getPositionX(event);
      const diff = currentPosition - startX;
      currentTranslate = prevTranslate + diff;
      pagesTrack.style.transform = `translateX(${currentTranslate}px)`;
    }

    function touchEnd() {
      if (!isDragging) return;
      isDragging = false;
      pagesTrack.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
      const movedBy = currentTranslate - prevTranslate;

      // Threshold for swipe trigger (50px)
      if (movedBy < -50 && currentPageIndex < totalPages - 1) {
        currentPageIndex++;
      }
      if (movedBy > 50 && currentPageIndex > 0) {
        currentPageIndex--;
      }

      updatePagePosition();
    }

    function getPositionX(event) {
      return event.type.includes('touch') ? event.touches[0].clientX : event.clientX;
    }

    // Attach Swipe Events
    swipeViewport.addEventListener('touchstart', touchStart(0));
    swipeViewport.addEventListener('touchend', touchEnd);
    swipeViewport.addEventListener('touchmove', touchMove);

    swipeViewport.addEventListener('mousedown', touchStart(0));
    swipeViewport.addEventListener('mouseup', touchEnd);
    swipeViewport.addEventListener('mouseleave', touchEnd);
    swipeViewport.addEventListener('mousemove', touchMove);

    // Prev / Next Button Listeners
    prevPageBtn.addEventListener('click', goToPrevPage);
    nextPageBtn.addEventListener('click', goToNextPage);

    // Resize Event - recalculate carousel offsets on window resize
    window.addEventListener('resize', () => {
      updatePagePosition();
    });

    // --- Action: Select & Trigger Big Animation + Speech ---
    function selectEmoji(char, word) {
      currentEmoji = { char, word };

      displayWord.textContent = word;
      emojiDisplay.textContent = char;

      emojiDisplay.classList.remove('animate-pop-bounce', 'animate-wiggle');
      void emojiDisplay.offsetWidth; // Force Reflow
      emojiDisplay.classList.add('animate-pop-bounce');

      wordBubble.classList.remove('animate-wiggle');
      void wordBubble.offsetWidth;
      wordBubble.classList.add('animate-wiggle');

      speak(word);
    }

    // --- Global Event Listeners ---
    wordBubble.addEventListener('click', () => {
      speak(displayWord.textContent);
      wordBubble.classList.remove('animate-wiggle');
      void wordBubble.offsetWidth;
      wordBubble.classList.add('animate-wiggle');
    });

    emojiDisplayWrapper.addEventListener('click', () => {
      speak(displayWord.textContent);
      emojiDisplay.classList.remove('animate-pop-bounce');
      void emojiDisplay.offsetWidth;
      emojiDisplay.classList.add('animate-pop-bounce');
    });

    soundToggleBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      soundIcon.textContent = isMuted ? '🔇' : '🔊';
      soundToggleBtn.className = isMuted 
        ? 'flex items-center justify-center p-2.5 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-2xl transition shadow-sm border border-rose-200 active:scale-95'
        : 'flex items-center justify-center p-2.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-700 rounded-2xl transition shadow-sm border border-emerald-200 active:scale-95';
      
      if (isMuted && window.speechSynthesis) {
        window.speechSynthesis.cancel();
        soundWaves.classList.add('opacity-0');
      }
    });

    langSelect.addEventListener('change', (e) => {
      selectedLang = e.target.value;
      let matchedItem = null;
      EMOJI_CATEGORIES.forEach(c => {
        c.emojis.forEach(item => {
          if (item.char === currentEmoji.char) matchedItem = item;
        });
      });

      if (matchedItem) {
        selectEmoji(matchedItem.char, getEmojiName(matchedItem));
      } else {
        speak(displayWord.textContent);
      }
      renderPaginatedKeyboard(searchInput.value);
    });

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value;
      if (val.length > 0) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }

      const emojiRegex = /(\p{Extended_Pictographic})/u;
      const match = val.match(emojiRegex);
      if (match) {
        const typedChar = match[0];
        let found = null;
        EMOJI_CATEGORIES.forEach(c => {
          c.emojis.forEach(item => {
            if (item.char === typedChar) found = item;
          });
        });

        if (found) {
          selectEmoji(found.char, getEmojiName(found));
        } else {
          selectEmoji(typedChar, 'Emoji');
        }
      }

      currentPageIndex = 0;
      renderPaginatedKeyboard(val);
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      currentPageIndex = 0;
      renderPaginatedKeyboard();
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    // --- Initial Setup ---
    window.onload = () => {
      renderTabs();
      renderPaginatedKeyboard();
      selectEmoji('🥳', EMOJI_CATEGORIES[0].emojis[21].names['en-US']);
    };
  </script>
</body>
</html>
