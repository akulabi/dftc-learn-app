<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湊十小勇士 - 幼稚園數學練習</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti Library for Clear-Board Celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts for playful text -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mochiy+Pop+One&family=Noto+Sans+TC:wght@500;700;900&display=swap">

    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka One', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            touch-action: manipulation;
        }

        .bubble-btn {
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0 rgba(0,0,0,0.15), inset 0 -4px 0 rgba(0,0,0,0.2);
        }

        .bubble-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .bubble-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.15), inset 0 -2px 0 rgba(0,0,0,0.2);
        }

        .number-card {
            transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.18s ease, background-color 0.2s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.12);
        }

        .number-card:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.04);
        }

        .number-card:active:not(:disabled) {
            transform: translateY(2px) scale(0.96);
            box-shadow: 0 2px 0 rgba(0,0,0,0.12);
        }

        .selected-card {
            border: 4px solid #f59e0b !important;
            background-color: #fef3c7 !important;
            transform: scale(1.08) !important;
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.7) !important;
            animation: pulse-ring 1s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        /* Shake animation for wrong selection */
        .shake-anim {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            background-color: #fecdd3 !important;
            border-color: #f43f5e !important;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0) scale(1.02); }
            20%, 80% { transform: translate3d(4px, 0, 0) scale(1.02); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0) scale(1.02); }
            40%, 60% { transform: translate3d(6px, 0, 0) scale(1.02); }
        }

        /* Match disappearance animation */
        .vanish-out {
            animation: vanishOut 0.3s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards;
        }

        @keyframes vanishOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35) rotate(12deg); opacity: 0.8; }
            100% { transform: scale(0); opacity: 0; }
        }

        /* Full Board Drop In animation */
        .board-drop-in {
            animation: boardDrop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes boardDrop {
            0% { transform: scale(0.6) translateY(-30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Clear Banner Pop Overlay */
        .clear-banner-anim {
            animation: clearPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes clearPop {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.15) rotate(5deg); opacity: 1; }
            80% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0.8) translateY(-20px); opacity: 0; }
        }

        /* Modal Visibility Transitions & Click-through Prevention */
        .modal-overlay {
            transition: opacity 0.25s ease, visibility 0.25s ease;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Floating background elements */
        .floating-bg {
            position: absolute;
            z-index: 0;
            pointer-events: none;
            animation: floatSlow 8s ease-in-out infinite alternate;
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between min-h-screen p-3 md:p-6 overflow-x-hidden relative">

    <!-- Decorative Animated Background Shapes -->
    <div class="floating-bg text-yellow-300 opacity-40 top-6 left-6 text-6xl md:text-8xl"><i class="fa-solid fa-cloud"></i></div>
    <div class="floating-bg text-pink-300 opacity-40 top-20 right-8 text-5xl md:text-7xl" style="animation-delay: -3s;"><i class="fa-solid fa-star"></i></div>

                </div>
            </div>

            <div class="flex items-center gap-2">

                <button id="homeBtn" onclick="returnToHome()" title="返回主頁" class="bubble-btn bg-emerald-500 hover:bg-emerald-600 text-white w-10 h-10 md:w-12 md:h-12 rounded-2xl flex items-center justify-center text-lg md:text-xl font-bold cursor-pointer">

                <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center text-4xl mb-3 shadow-sm border-2 border-amber-300">
                    🧩

                <h2 class="text-2xl md:text-3xl font-black text-indigo-900 mb-2">湊十清版挑戰賽！</h2>
                <div class="text-gray-600 font-medium mb-6 text-sm md:text-base max-w-xs space-y-1">
                    <p>點選 2 個數字相加等於 <span class="text-amber-500 font-black text-lg">10</span> 即可消除！</p>

                    <i class="fa-solid fa-pause"></i> 暫停

                    <i class="fa-solid fa-rotate-right"></i> 重新開始

            </div>
        </div>
    </main>

    <!-- Footer Prompt -->

    <!-- Game Over Modal -->
    <div id="gameOverModal" class="modal-overlay fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">

                </button>
                <button onclick="closeGameOverModal(); returnToHome();" class="bubble-btn bg-sky-500 hover:bg-sky-600 text-white font-bold px-4 py-3 rounded-2xl text-base md:text-lg cursor-pointer">

    <!-- Leaderboard Modal -->
    <div id="leaderboardModal" onclick="handleLeaderboardBackdropClick(event)" class="modal-overlay fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">

            <div class="flex items-center justify-center gap-2 mb-4">
                <i class="fa-solid fa-trophy text-yellow-400 text-3xl"></i>

            </div>

            <!-- High Score List Container -->
            <div class="max-h-64 overflow-y-auto mb-5 rounded-2xl border border-gray-100 p-2 space-y-2" id="leaderboardList">

            </div>

            <button onclick="closeLeaderboard()" class="w-full bubble-btn bg-indigo-500 hover:bg-indigo-600 text-white font-black py-3 rounded-2xl text-lg cursor-pointer">
                返回

    <!-- Game Logic JavaScript -->
    <script>
        // --- Web Audio API Sound Generator ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
            }

            playTone(freq, type = 'sine', duration = 0.15, startVol = 0.3) {
                if (this.muted) return;
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }

            // Click selection feedback
            playClickSound() {
                if (this.muted) return;
                this.playTone(480, 'sine', 0.06, 0.2);
            }

            // Cheerful match sparkle sound
            playMatchSound() {
                if (this.muted) return;
                this.playTone(523.25, 'triangle', 0.1, 0.3); // C5
                setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.3), 70); // E5
                setTimeout(() => this.playTone(783.99, 'triangle', 0.25, 0.4), 140); // G5
            }

            // Error sound
            playErrorSound() {
                if (this.muted) return;
                this.playTone(220, 'sawtooth', 0.15, 0.25);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.2, 0.25), 90);
            }

            // Full Board Cleared Celebration Fanfare
            playClearBoardSound() {
                if (this.muted) return;
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.2, 0.35), idx * 100);
                });
            }

            // Timer Warning Ticking Sound
            playTickSound() {
                if (this.muted) return;
                this.playTone(880, 'sine', 0.05, 0.15);
            }

            // Game end fanfare
            playGameOverSound() {
                if (this.muted) return;
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'triangle', 0.22, 0.3), idx * 120);
                });
            }
        }

        const sounds = new SoundFX();

        // --- Game State Variables ---
        const GRID_SIZE = 12; // 12 cards total (6 pairs of 10)
        let numbers = []; // Stores number or null for cleared slots
        let selectedIndices = [];
        let score = 0; // Number of matched 10-pairs
        let clearBoardCount = 0; // Number of full board refreshes
        let timeLeft = 30;
        let timerInterval = null;
        let isPlaying = false;
        let isPaused = false;
        let isGameOver = false;

        // Color palettes for playful kindergarten cards
        const cardColors = [
            { bg: 'bg-red-100', text: 'text-red-600', border: 'border-red-300' },
            { bg: 'bg-orange-100', text: 'text-orange-600', border: 'border-orange-300' },
            { bg: 'bg-amber-100', text: 'text-amber-600', border: 'border-amber-300' },
            { bg: 'bg-emerald-100', text: 'text-emerald-600', border: 'border-emerald-300' },
            { bg: 'bg-teal-100', text: 'text-teal-600', border: 'border-teal-300' },
            { bg: 'bg-sky-100', text: 'text-sky-600', border: 'border-sky-300' },
            { bg: 'bg-indigo-100', text: 'text-indigo-600', border: 'border-indigo-300' },
            { bg: 'bg-purple-100', text: 'text-purple-600', border: 'border-purple-300' },
            { bg: 'bg-pink-100', text: 'text-pink-600', border: 'border-pink-300' }
        ];

        // --- Generate Solvable 10-Pair Board ---
        function generateSolvableBoard() {
            let board = [];
            // Pick 6 random pairs that equal 10
            for (let i = 0; i < GRID_SIZE / 2; i++) {
                const first = Math.floor(Math.random() * 9) + 1; // 1 to 9
                const second = 10 - first;
                board.push(first, second);
            }
            
            // Fisher-Yates Shuffle
            for (let i = board.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [board[i], board[j]] = [board[j], board[i]];
            }

            return board;
        }

        // Mascot expressions helper
        function updateMascot(emotion) {
            const mascot = document.getElementById('mascotIcon');
            switch(emotion) {
                case 'happy': mascot.innerText = '🦁'; break;
                case 'excited': mascot.innerText = '🤩'; break;
                case 'cheer': mascot.innerText = '🎉'; break;
                case 'oops': mascot.innerText = '😮'; break;
                default: mascot.innerText = '🦁'; break;
            }
        }

        // --- Sound Toggle ---
        function toggleSound() {
            sounds.muted = !sounds.muted;
            const icon = document.getElementById('soundIcon');
            if (sounds.muted) {
                icon.className = 'fa-solid fa-volume-xmark';
            } else {
                icon.className = 'fa-solid fa-volume-high';
                sounds.playClickSound();
            }
        }

        // --- Render Board Grid ---
        function renderBoard(animateAll = false) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            numbers.forEach((num, index) => {
                if (num === null) {
                    // Empty slot placeholder (maintains layout grid structure)
                    const emptySlot = document.createElement('div');
                    emptySlot.className = 'w-full h-20 md:h-24 rounded-2xl border-2 border-dashed border-indigo-100/60 bg-white/20';
                    container.appendChild(emptySlot);
                } else {
                    const colorStyle = cardColors[(num - 1) % cardColors.length];
                    const card = document.createElement('button');
                    card.id = `card-${index}`;
                    card.onclick = () => handleCardClick(index);
                    
                    const dropClass = animateAll ? 'board-drop-in' : '';
                    card.className = `number-card ${dropClass} w-full h-20 md:h-24 rounded-2xl border-4 ${colorStyle.border} ${colorStyle.bg} ${colorStyle.text} font-black text-3xl md:text-4xl flex items-center justify-center relative cursor-pointer select-none`;
                    
                    card.innerHTML = `<span>${num}</span>`;

                    if (selectedIndices.includes(index)) {
                        card.classList.add('selected-card');
                    }

                    container.appendChild(card);
                }
            });
        }

        // --- Handle Card Selection & Pair Logic ---
        function handleCardClick(index) {
            if (!isPlaying || isPaused || numbers[index] === null) return;

            // If clicking already selected card, deselect it
            if (selectedIndices.includes(index)) {
                selectedIndices = selectedIndices.filter(i => i !== index);
                sounds.playClickSound();
                renderBoard();
                return;
            }

            sounds.playClickSound();
            selectedIndices.push(index);
            renderBoard();

            // When two cards are selected, evaluate sum
            if (selectedIndices.length === 2) {
                const [idx1, idx2] = selectedIndices;
                const val1 = numbers[idx1];
                const val2 = numbers[idx2];

                if (val1 + val2 === 10) {
                    // Match Success!
                    sounds.playMatchSound();
                    updateMascot('excited');
                    score++;
                    document.getElementById('scoreDisplay').innerText = `${score} 組`;

                    const card1 = document.getElementById(`card-${idx1}`);
                    const card2 = document.getElementById(`card-${idx2}`);

                    if (card1) card1.classList.add('vanish-out');
                    if (card2) card2.classList.add('vanish-out');

                    // After disappearance animation, mark slots as null
                    setTimeout(() => {
                        numbers[idx1] = null;
                        numbers[idx2] = null;
                        selectedIndices = [];

                        // CHECK IF ENTIRE BOARD IS CLEARED!
                        const isFullyCleared = numbers.every(val => val === null);

                        if (isFullyCleared) {
                            handleBoardCleared();
                        } else {
                            renderBoard();
                        }
                    }, 300);

                } else {
                    // Match Failed!
                    sounds.playErrorSound();
                    updateMascot('oops');

                    const card1 = document.getElementById(`card-${idx1}`);
                    const card2 = document.getElementById(`card-${idx2}`);

                    if (card1) card1.classList.add('shake-anim');
                    if (card2) card2.classList.add('shake-anim');

                    setTimeout(() => {
                        selectedIndices = [];
                        renderBoard();
                        updateMascot('happy');
                    }, 400);
                }
            }
        }

        // --- Handle Board Cleared Victory & Refresh ---
        function handleBoardCleared() {
            clearBoardCount++;
            document.getElementById('clearDisplay').innerText = `${clearBoardCount} 次`;
            sounds.playClearBoardSound();
            updateMascot('cheer');

            // Trigger Confetti Celebration
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 }
                });
            }

            // Show Animated Banner
            const banner = document.getElementById('clearBanner');
            banner.classList.remove('hidden');

            setTimeout(() => {
                banner.classList.add('hidden');
                // Generate a fresh new board
                numbers = generateSolvableBoard();
                renderBoard(true); // Animate new drop-in
                updateMascot('happy');
            }, 800);
        }

        // --- Timer Loop ---
        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isPaused && isPlaying) {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerText = `${timeLeft}s`;

                    if (timeLeft <= 5 && timeLeft > 0) {
                        sounds.playTickSound();
                        document.getElementById('timerDisplay').classList.add('text-rose-600', 'animate-pulse');
                    } else {
                        document.getElementById('timerDisplay').classList.remove('text-rose-600', 'animate-pulse');
                    }

                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);
        }

        // --- Return To Home Screen State ---
        function returnToHome() {
            sounds.playClickSound();
            clearInterval(timerInterval);

            isPlaying = false;
            isPaused = false;
            isGameOver = false;

            score = 0;
            clearBoardCount = 0;
            timeLeft = 30;
            selectedIndices = [];

            document.getElementById('scoreDisplay').innerText = `0 組`;
            document.getElementById('clearDisplay').innerText = `0 次`;
            document.getElementById('timerDisplay').innerText = `30s`;
            document.getElementById('timerDisplay').classList.remove('text-rose-600', 'animate-pulse');

            // Disable controls
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('restartBtn').disabled = true;

            // Reset overlays cleanly
            document.getElementById('gameOverModal').classList.remove('active');
            document.getElementById('pauseOverlay').classList.remove('active');
            document.getElementById('leaderboardModal').classList.remove('active');
            
            // Show Start Game Screen Overlay
            document.getElementById('startOverlay').classList.add('active');

            updateMascot('happy');
            numbers = generateSolvableBoard();
            renderBoard();
        }

        // --- Game Flow Actions ---
        function startGame() {
            sounds.init();
            sounds.playClickSound();

            clearInterval(timerInterval);

            score = 0;
            clearBoardCount = 0;
            timeLeft = 30;
            isPlaying = true;
            isPaused = false;
            isGameOver = false;
            selectedIndices = [];

            // Generate initial solvable board
            numbers = generateSolvableBoard();

            document.getElementById('scoreDisplay').innerText = `0 組`;
            document.getElementById('clearDisplay').innerText = `0 次`;
            document.getElementById('timerDisplay').innerText = `${timeLeft}s`;
            document.getElementById('timerDisplay').classList.remove('text-rose-600', 'animate-pulse');

            // Hide overlays
            document.getElementById('startOverlay').classList.remove('active');
            document.getElementById('pauseOverlay').classList.remove('active');
            document.getElementById('gameOverModal').classList.remove('active');
            document.getElementById('leaderboardModal').classList.remove('active');
            
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('restartBtn').disabled = false;

            updateMascot('happy');
            renderBoard(true);
            startTimer();
        }

        function pauseGame() {
            if (!isPlaying || isGameOver) return;
            sounds.playClickSound();
            isPaused = true;
            document.getElementById('pauseOverlay').classList.add('active');
        }

        function resumeGame() {
            sounds.playClickSound();
            isPaused = false;
            document.getElementById('pauseOverlay').classList.remove('active');
        }

        function endGame() {
            clearInterval(timerInterval);
            isPlaying = false;
            isGameOver = true;
            sounds.playGameOverSound();
            updateMascot('cheer');

            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('restartBtn').disabled = true;

            // Show Game Over Modal Details
            document.getElementById('finalScore').innerText = `${score} 組`;
            document.getElementById('finalClears').innerText = `${clearBoardCount} 次`;

            // Calculate Star Rating & Friendly Rank
            let starsHtml = '';
            let rankText = '';
            let emoji = '👏';

            if (score >= 12 || clearBoardCount >= 2) {
                starsHtml = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>';
                rankText = '超級湊十王 👑';
                emoji = '🏆';
            } else if (score >= 6 || clearBoardCount >= 1) {
                starsHtml = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i>';
                rankText = '湊十小勇士 🌟';
                emoji = '🎉';
            } else {
                starsHtml = '<i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i>';
                rankText = '湊十小精靈 ✨';
                emoji = '💪';
            }

            document.getElementById('starContainer').innerHTML = starsHtml;
            document.getElementById('finalRank').innerText = rankText;
            document.getElementById('modalEmoji').innerText = emoji;

            // Reset Input Name
            document.getElementById('playerNameInput').value = '';

            document.getElementById('gameOverModal').classList.add('active');
        }

        function closeGameOverModal() {
            document.getElementById('gameOverModal').classList.remove('active');
        }

        // --- Leaderboard LocalStorage Management ---
        function getLeaderboard() {
            const data = localStorage.getItem('make10_leaderboard');
            return data ? JSON.parse(data) : [
                { name: '小明', score: 18, clears: 3, date: '2026-10-15' },
                { name: '美美', score: 12, clears: 2, date: '2026-10-18' },
                { name: '巧虎', score: 6, clears: 1, date: '2026-10-20' }
            ];
        }

        function saveScore() {
            const nameInput = document.getElementById('playerNameInput').value.trim() || '湊十勇士';
            const board = getLeaderboard();

            const dateStr = new Date().toISOString().split('T')[0];
            board.push({ name: nameInput, score: score, clears: clearBoardCount, date: dateStr });

            // Sort high score first, then clears
            board.sort((a, b) => (b.score - a.score) || (b.clears - a.clears));
            const topBoard = board.slice(0, 7);

            localStorage.setItem('make10_leaderboard', JSON.stringify(topBoard));

            closeGameOverModal();
            openLeaderboard();
        }

        function openLeaderboard() {
            sounds.playClickSound();
            const listContainer = document.getElementById('leaderboardList');
            const board = getLeaderboard();

            listContainer.innerHTML = '';

            if (board.length === 0) {
                listContainer.innerHTML = '<p class="text-gray-400 py-4 font-bold">目前還沒有紀錄喔！</p>';
            } else {
                board.forEach((item, index) => {
                    let badgeColor = 'bg-slate-100 text-slate-600';
                    if (index === 0) badgeColor = 'bg-amber-100 text-amber-800 font-black border border-amber-300';
                    if (index === 1) badgeColor = 'bg-slate-200 text-slate-700 font-bold';
                    if (index === 2) badgeColor = 'bg-orange-100 text-orange-800 font-bold';

                    const row = document.createElement('div');
                    row.className = `flex items-center justify-between p-3 rounded-xl ${badgeColor}`;
                    row.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full bg-white/80 flex items-center justify-center text-xs font-black shadow-sm">
                                ${index + 1}
                            </span>
                            <span class="font-bold text-sm md:text-base">${escapeHtml(item.name)}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-xs text-amber-600 font-bold bg-amber-50 px-2 py-0.5 rounded-md">${item.clears || 0} 清版</span>
                            <span class="text-base font-black text-indigo-600">${item.score} 組</span>
                        </div>
                    `;
                    listContainer.appendChild(row);
                });
            }

            document.getElementById('leaderboardModal').classList.add('active');
        }

        function closeLeaderboard() {
            sounds.playClickSound();
            document.getElementById('leaderboardModal').classList.remove('active');
        }

        function handleLeaderboardBackdropClick(event) {
            if (event.target === document.getElementById('leaderboardModal')) {
                closeLeaderboard();
            }
        }

        // Sanitize string for safety
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // Initialize preview grid on load
        window.onload = () => {
            numbers = generateSolvableBoard();
            renderBoard();
        };
    </script>
</body>
</html>
