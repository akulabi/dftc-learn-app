<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kid Learning Hub</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Child Friendly Google Fonts (Fredoka & Comic Neue) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Application JavaScript Logic / Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'sans-serif'],
                        comic: ['Comic Neue', 'cursive'],
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-full font-sans antialiased bg-gradient-to-br from-amber-100 via-sky-100 to-pink-100 text-slate-800 p-4 md:p-8">

    <div class="max-w-2xl mx-auto space-y-4">
        <!-- Header -->
        <header class="bg-white border-4 border-yellow-300 rounded-2xl p-4 flex items-center space-x-3 shadow-md">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center text-white font-bold shadow-md shadow-pink-300/50 transform -rotate-3 shrink-0">
                <i class="fa-solid fa-rocket text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl text-sky-600 tracking-wide">Kid Learning Hub 🌟</h1>
            </div>
        </header>

        <!-- Main Page List -->
        <main class="bg-white border-4 border-sky-200 rounded-3xl p-4 shadow-xl space-y-3">
            <!-- Search Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-sky-400 text-sm"></i>
                <input type="text" id="search-input" placeholder="Search pages..." class="w-full bg-sky-50 text-sm text-slate-700 placeholder-sky-400 pl-10 pr-4 py-2.5 rounded-2xl border-2 border-sky-200 focus:outline-none focus:border-sky-400 transition-colors font-bold">
            </div>

            <!-- List Container (Single Column) -->
            <div id="pages-list" class="grid grid-cols-1 gap-3">
                <!-- Items populated by JavaScript -->
            </div>
        </main>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        // Curated bright, child-friendly colors for badges
        const colorPalette = [
            'bg-amber-400 text-white',
            'bg-pink-400 text-white',
            'bg-sky-400 text-white',
            'bg-purple-400 text-white',
            'bg-emerald-400 text-white',
            'bg-rose-400 text-white',
            'bg-indigo-400 text-white',
            'bg-orange-400 text-white',
            'bg-teal-400 text-white',
            'bg-lime-500 text-white',
            'bg-violet-400 text-white',
            'bg-fuchsia-400 text-white'
        ];

        // Helper function to pick a random color from the palette
        function getRandomColor() {
            return colorPalette[Math.floor(Math.random() * colorPalette.length)];
        }

        // List of pages inside the /pages/ directory with contextual icons
        const pagesList = [
            { id: '1', title: 'Chinese Speaking', file: 'chinese_speaking.html', icon: 'fa-comments' },
            { id: '2', title: 'Chinese Writing', file: 'chinese_writing.html', icon: 'fa-pen-to-square' },
            { id: '3', title: 'English Spelling', file: 'english_spelling.html', icon: 'fa-spell-check' },
            { id: '4', title: 'Phonics Keyboard', file: 'phonics.html', icon: 'fa-keyboard' },
            { id: '5', title: 'Sentence Builder', file: 'sentence_builder.html', icon: 'fa-cubes' },
            { id: '6', title: 'Word Recognition', file: 'word_recognition.html', icon: 'fa-book-open-reader' },
            { id: '7', title: 'Balloon word', file: 'balloon_recognition.html', icon: 'fa-book-open-reader' },
            { id: '8', title: 'Maths 10 Game', file: 'maths_ten.html', icon: 'fa-calculator' },
            { id: '9', title: 'Maths Simple', file: 'maths_simple.html', icon: 'fa-calculator' },
            { id: '10', title: 'Song Lyrics Speaker', file: 'song_lyrics.html', icon: 'fa-music' },
        ];

        // DOM Elements
        const pagesListContainer = document.getElementById('pages-list');
        const searchInput = document.getElementById('search-input');

        // Render Page List
        function renderPages(query = '') {
            pagesListContainer.innerHTML = '';
            
            const filteredPages = pagesList.filter(page => 
                page.title.toLowerCase().includes(query.toLowerCase()) || 
                page.file.toLowerCase().includes(query.toLowerCase())
            );

            if (filteredPages.length === 0) {
                pagesListContainer.innerHTML = `
                    <div class="col-span-1 py-8 text-center text-slate-400 font-bold text-sm">
                        <i class="fa-solid fa-face-frown text-2xl mb-2 text-sky-300 block"></i>
                        No pages found matching "${query}"
                    </div>
                `;
                return;
            }

            filteredPages.forEach(page => {
                const fullPath = `pages/${page.file}`;
                const link = document.createElement('a');
                
                // Get a bright random color for each card's icon badge
                const randomColorClass = getRandomColor();

                link.href = fullPath;
                link.target = '_blank';
                link.className = 'group flex items-center justify-between p-3 rounded-2xl border-2 border-sky-100 bg-white hover:border-sky-300 hover:bg-sky-50 transition-all shadow-sm hover:shadow-md hover:scale-[1.01]';

                link.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-xl ${randomColorClass} flex items-center justify-center shrink-0 text-base font-bold shadow-sm transition-transform group-hover:rotate-6">
                            <i class="fa-solid ${page.icon}"></i>
                        </div>
                        <div class="truncate">
                            <div class="font-bold text-sm text-slate-800">${page.title}</div>
                        </div>
                    </div>
                    <div class="p-2 text-sky-400 group-hover:text-sky-600 transition-colors shrink-0">
                        <i class="fa-solid fa-arrow-up-right-from-square text-sm"></i>
                    </div>
                `;

                pagesListContainer.appendChild(link);
            });
        }

        // Search Input Event Listener
        searchInput.addEventListener('input', (e) => {
            renderPages(e.target.value.trim());
        });

        // Initial render on page load
        window.addEventListener('DOMContentLoaded', () => renderPages());
    </script>
</body>
</html>
